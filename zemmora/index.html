<title>زمورة تعلم اللغات — Zemmora Language Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2433;--mut:#6b7488;--pri:#2563eb;--pri2:#1e40af;--ok:#16a34a;--bad:#dc2626;--acc:#f59e0b;--line:#e3e8f0;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:light}
button{color:var(--ink);font-family:inherit}
input{color:var(--ink);background:#fff;font-family:inherit}
.opt.ok,.opt.no{color:var(--ink)}
html{-webkit-text-size-adjust:100%}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:#d9e0ee;color:var(--ink);overscroll-behavior-y:contain}
#shell{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(0,0,0,.15)}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 22px;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:22px;font-weight:800}
header p{margin:4px 0 0;opacity:.9;font-size:14px}
.stats{display:flex;gap:10px;margin-top:12px}
.pill{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
main{padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(30,40,80,.06);margin-bottom:14px}
h2{font-size:19px;margin:6px 0 12px}
.levels{display:grid;gap:12px}
.lv{display:flex;align-items:center;gap:14px;cursor:pointer;border:2px solid transparent;transition:.15s}
.lv:hover{border-color:var(--pri)}
.lv .ic{font-size:34px;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;flex:none}
.lv b{font-size:17px}.lv small{color:var(--mut);display:block}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);width:0;transition:.4s}
.back{background:none;border:0;color:var(--pri);font:600 15px Cairo;cursor:pointer;padding:4px 0;margin-bottom:6px}
.les{display:flex;align-items:center;gap:12px;cursor:pointer}
.les .ic{font-size:30px}
.les .done{margin-inline-start:auto;font-size:22px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:20;border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.08)}
nav button{background:none;border:0;font:600 11px Cairo;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 6px;flex:1}
nav button span{font-size:22px}nav button.on{color:var(--pri)}
.lpb{position:sticky;top:0;z-index:20;height:8px;background:#e5e7eb;border-radius:6px;margin:-4px 0 10px;overflow:hidden}.lpb i{display:block;height:100%;width:0;border-radius:6px;transition:width .4s,background .4s}
.tabs{display:flex;gap:6px;background:#e9eef7;padding:5px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font:700 14px Cairo;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:11px 18px;font:700 15px Cairo;cursor:pointer}
.btn:hover{background:var(--pri2)}.btn.sec{background:#e8eefc;color:var(--pri)}.btn:disabled{opacity:.5;cursor:default}
.flash{perspective:900px;height:300px;cursor:pointer;margin-bottom:12px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center}
.face.f{background:linear-gradient(160deg,#fff,#eef3ff);border:2px solid var(--line)}
.face.b{background:linear-gradient(160deg,#eef6ff,#e6f9ee);border:2px solid #bfe3cf;transform:rotateY(180deg)}
.big{font-size:104px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.04)}}
.w{font-size:30px;font-weight:800}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.ar{color:var(--pri2);font-weight:700;font-size:22px}
.ex{color:var(--mut);font-size:15px}
.spk{background:#fff;border:2px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer}
.tip{background:#fff8e6;border:1px solid #fde4a1;border-radius:14px;padding:12px;font-size:15px;line-height:1.8}
/* video */
.stage{position:relative;height:380px;border-radius:var(--r);overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.stage .floaters{position:absolute;inset:0;pointer-events:none}
.stage .floaters span{position:absolute;font-size:44px;opacity:.28;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px) rotate(8deg)}}
.chars{position:absolute;top:34px;inset-inline:0;display:flex;justify-content:space-around;align-items:flex-end}
.ch{font-size:78px;transition:.3s;filter:grayscale(.6) brightness(.8);transform:scale(.9)}
.ch.on{filter:none;transform:scale(1.15) translateY(-6px)}
.ch small{display:block;font-size:13px;text-align:center;font-weight:700}
.sub{position:relative;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:12px 14px;min-height:112px;text-align:center}
.sub .e{font-size:20px;font-weight:700;direction:ltr}
.sub .a{font-size:16px;margin-top:4px;color:#ffe9a8}
.prog{height:5px;background:rgba(255,255,255,.3)}.prog i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
/* quiz */
.q{font-size:18px;font-weight:700;text-align:center;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font:700 17px Cairo;cursor:pointer}
.opt.ok{background:#dcfce7;border-color:var(--ok)}.opt.no{background:#fee2e2;border-color:var(--bad)}
/* chat */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:600 13px Cairo;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chat{flex:1;overflow:auto;background:#eef2f8;padding:12px;display:flex;flex-direction:column;gap:10px}.chat.hidear .msg .a{display:none}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.7;font-size:16px}
.msg.me{align-self:flex-start;background:var(--pri);color:#fff;border-end-start-radius:4px}
.msg.bot{align-self:flex-end;background:#fff;border-end-end-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.msg .e{font-weight:700;font-size:17px;direction:ltr;display:block;text-align:left}
.msg .a{color:var(--pri2);font-size:14px;display:block;margin-top:4px}
.msg .f{background:#fff4d6;border-radius:10px;padding:6px 9px;margin-top:6px;font-size:14px;display:block}
.inp{display:flex;gap:8px;margin-top:10px}
.inp input{flex:1;border:2px solid var(--line);border-radius:14px;padding:12px;font:16px Cairo;min-width:0}
.inp input:focus{outline:none;border-color:var(--pri)}
.mic{background:#fff;border:2px solid var(--line);border-radius:14px;width:48px;font-size:20px;cursor:pointer}.mic.rec{background:#fee2e2;border-color:var(--bad)}
.note{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.7}
.convo{display:flex;flex-direction:column;height:100dvh}
.ctop{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.ctop small{display:block;opacity:.85;font-size:12px}.ctop .chip{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}.ctop .chip.on{background:#fff;color:var(--pri)}
.cb2{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.mission{background:#fff8e6;border-bottom:1px solid #fde4a1;padding:8px 14px;font-size:14px;font-weight:600}.mission.won{background:#dcfce7;border-color:#86efac}
.sug{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;background:var(--bg);min-height:8px}.sug .chip{white-space:nowrap;flex:none;background:#fff}
.convo .inp{padding:8px 10px calc(10px + env(safe-area-inset-bottom));margin:0;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sc{cursor:pointer;margin:0;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}.sc:active{border-color:var(--pri)}.sc small{color:var(--mut);font-size:12px;line-height:1.5}
.chips{overflow-x:auto;flex-wrap:nowrap}.chip{flex:none}
body.inchat header,body.inchat nav{display:none}body.inchat #shell{padding-bottom:0}body.inchat main{padding:0}
.next{display:flex;align-items:center;gap:12px;cursor:pointer;background:linear-gradient(135deg,#fef3c7,#fde68a)}
.sn{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line);font-size:18px;line-height:1.9;direction:ltr;text-align:left;cursor:pointer;border-radius:10px}
.sn.hl{background:#fff3c4}.sn .tr{flex-basis:100%;direction:rtl;text-align:right;color:var(--pri2);font-size:15px;line-height:1.7}
.sb{background:#eef3ff;border:0;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;flex:none;margin-top:4px}
.spkr{flex-basis:100%;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:-8px;direction:ltr}
.wd.gl{border-bottom:2px dotted var(--acc);font-weight:600}
.hidetxt .txt{filter:blur(9px);user-select:none;pointer-events:none}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));width:min(92%,480px);background:#1d2433;color:#fff;border-radius:16px;padding:10px 14px;z-index:30;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.dctin{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:18px system-ui}.dctin:focus{outline:none;border-color:var(--pri)}
.sc.dim{opacity:.45}
.sug.w{flex-wrap:wrap;max-height:34vh;overflow-y:auto}.sug.w .chip{white-space:normal;text-align:left;direction:ltr;border-radius:14px;padding:8px 12px}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mc{position:relative;height:84px;border:2px solid var(--line);border-radius:14px;background:#e8eefc;font:700 16px Cairo;cursor:pointer;padding:2px;color:var(--ink)}.mc .mb{display:none;line-height:1.2}.mc.up,.mc.ok{background:#fff}.mc.up .mf,.mc.ok .mf{display:none}.mc.up .mb,.mc.ok .mb{display:block}.mc.ok{background:#dcfce7;border-color:var(--ok)}
.slots{display:flex;gap:6px;justify-content:center;margin:14px 0;direction:ltr;flex-wrap:wrap}.sl{width:36px;height:44px;border-bottom:3px solid var(--pri);font:800 24px Cairo;display:flex;align-items:center;justify-content:center;color:var(--ink)}.slots.good .sl{color:var(--ok);border-color:var(--ok)}.slots.bad .sl{color:var(--bad);border-color:var(--bad)}
.lts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}.lt{width:46px;height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;font:800 22px Cairo;cursor:pointer;color:var(--ink)}.lt:disabled{opacity:.25}
.rh{display:flex;justify-content:space-around;margin-bottom:8px;font-size:18px}
.sb{min-height:52px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;justify-content:center;align-items:center;margin-bottom:10px}.sb.good{border-color:var(--ok);background:#dcfce7}.sb.bad{border-color:var(--bad);background:#fee2e2}.sb.pool{border:0}
.wd{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font:700 17px Cairo;cursor:pointer;color:var(--ink)}.wd.p{background:#e8eefc}
nav button{padding:4px 2px}
.hide{display:none!important}
@media print{body.printcert #shell>*:not(#x),body.printcert nav{display:none!important}body.printcert #cm{position:static!important;background:#fff!important;padding:0!important}body.printcert #cm .card>*:not(#cimg){display:none!important}body.printcert #cm .card{box-shadow:none;border:0}body.printcert #cimg{width:100%!important;border:0!important}@page{size:A4 landscape;margin:0}}
.win{text-align:center;padding:20px}.win .big{font-size:80px}
.vid-links a{display:inline-block;margin:4px;padding:8px 12px;background:#fee2e2;color:#b91c1c;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="shell"><header>
  <h1>🎓 زمورة تعلم اللغات <span class="en" style="font-weight:600;font-size:15px">Zemmora</span> <button id="lg" class="pill" style="border:0;cursor:pointer;font:700 13px Cairo;float:left;color:#1e3a8a">🇬🇧 EN</button></h1>
  <p>تعلّم الإنجليزية من المبتدئ إلى المتقدّم — بالدارجة الجزائرية 🇩🇿</p>
  <div class="stats"><div class="pill">⭐ <span id="xp">0</span> نقطة</div><div class="pill">✅ <span id="dn">0</span>/30 درس</div><div class="pill">🔥 <span id="st">0</span> يوم</div></div>
</header>
<main id="app"></main></div>
<nav>

  <button data-v="listen"><span>🎧</span>استماع</button>

  <button data-v="games"><span>🎮</span>ألعاب</button>
  <button data-v="prog"><span>📈</span>تقدّمي</button>
</nav>

<script>

const LEVELS=[
 {id:"A1",name:"مبتدئ",en:"Beginner",ic:"🌱",c:"#dcfce7"},
 {id:"A2",name:"أساسي",en:"Elementary",ic:"🌿",c:"#d1fae5"},
 {id:"B1",name:"متوسط",en:"Intermediate",ic:"🌳",c:"#dbeafe"},
 {id:"B2",name:"فوق المتوسط",en:"Upper-Intermediate",ic:"🚀",c:"#ede9fe"},
 {id:"C1",name:"متقدّم",en:"Advanced",ic:"👑",c:"#fef3c7"}
];
// words: [en, darija, emoji, example, exampleDarija]
const LEN=[
{id:1,lv:"A1",t:"التحيات",en:"Greetings",ic:"👋",g:["#4f46e5","#06b6d4"],chars:["🧑","👩"],names:["Amine","Sara"],
 w:[["Hello","السلام / أهلا","👋","Hello, my name is Amine.","أهلا، سميتي أمين."],
 ["Goodbye","بصحتك / سلام","🤚","Goodbye, see you tomorrow!","بصحتك، نشوفك غدوة!"],
 ["Please","عفاك","🙏","Water, please.","الما، عفاك."],
 ["Thank you","بارك الله فيك / شكرا","😊","Thank you very much!","شكرا بزاف!"],
 ["Sorry","سامحني","😔","Sorry, I'm late.","سامحني، تأخرت."],
 ["Friend","صاحبي","🤝","He is my friend.","هذا صاحبي."]],
 d:[[0,"Hello! How are you?","السلام! واش راك؟"],[1,"I'm fine, thank you. And you?","لاباس، شكرا. وإنتِ؟"],[0,"I'm good. What's your name?","مليح. واش سميتك؟"],[1,"My name is Sara. Nice to meet you!","سميتي سارة. تشرفنا!"]],
 tip:"«How are you?» = «واش راك؟» والجواب «I'm fine» = «لاباس». وحاول تقول «Nice to meet you» كي تعرف واحد جديد."},
{id:2,lv:"A1",t:"الأكل والمشروبات",en:"Food & Drinks",ic:"🍞",g:["#f59e0b","#ef4444"],chars:["🧑‍🍳","🧑"],names:["Waiter","Customer"],
 w:[["Water","الما","💧","I want water.","نحب الما."],
 ["Bread","الخبز","🍞","I eat bread every day.","ناكل الخبز كل نهار."],
 ["Coffee","القهوة","☕","One coffee, please.","قهوة وحدة، عفاك."],
 ["Milk","الحليب","🥛","The milk is cold.","الحليب بارد."],
 ["Apple","التفاحة","🍎","This apple is sweet.","هاذ التفاحة حلوة."],
 ["Hungry","جيعان","🍽️","I am hungry.","راني جيعان."]],
 d:[[0,"Hello! What would you like?","السلام! واش تحب؟"],[1,"I would like a coffee, please.","نحب قهوة، عفاك."],[0,"Anything else?","حاجة أخرى؟"],[1,"Yes, a bottle of water. How much is it?","إيه، قارورة ما. بشحال؟"]],
 tip:"في الدارجة «نحب» تعني «نريد» و«نحب» (أُحِبّ). في الإنجليزية: «I want» = نبغي/نحب الشيء، و«I like» = يعجبني. للتأدب قُل «I would like»."},
{id:3,lv:"A2",t:"التسوّق",en:"Shopping",ic:"🛍️",g:["#ec4899","#8b5cf6"],chars:["🧑","🧑‍💼"],names:["Customer","Seller"],
 w:[["Expensive","غالي","💰","This bag is expensive.","هاذ الصاك غالي."],
 ["Cheap","رخيص","🏷️","The shoes are cheap.","الصباط رخيص."],
 ["Discount","تخفيض","🔖","Can I get a discount?","نقدر نخذ تخفيض؟"],
 ["Size","المقاس","📏","What size are you?","واش مقاسك؟"],
 ["Bag","الصاك","👜","I need a new bag.","نحتاج صاك جديد."],
 ["Receipt","الفاكتورة / الوصل","🧾","Keep the receipt.","حافظ على الوصل."]],
 d:[[0,"How much is this jacket?","بشحال هاد الجاكيط؟"],[1,"It's four thousand dinars.","ب4000 دينار."],[0,"That's too expensive. Can you give me a discount?","غالي بزاف. تنقص لي شوية؟"],[1,"OK, three thousand five hundred for you.","مليح، 3500 ليك."]],
 tip:"«too + صفة» = «بزاف»: too expensive = غالي بزاف. و«Can you ...?» = «تقدر ...؟» لطلب مؤدب."},
{id:4,lv:"A2",t:"الاتجاهات",en:"Directions",ic:"🧭",g:["#0ea5e9","#22c55e"],chars:["🧑","👮"],names:["Tourist","Police officer"],
 w:[["Left","اليسار","⬅️","Turn left.","دور على اليسار."],
 ["Right","اليمين","➡️","Turn right.","دور على اليمين."],
 ["Straight","طول","⬆️","Go straight.","امشي طول."],
 ["Near","قريب","📍","The school is near.","المدرسة قريبة."],
 ["Far","بعيد","🏔️","It is far from here.","بعيدة من هنا."],
 ["Street","الشارع","🛣️","This street is long.","هاذ الشارع طويل."]],
 d:[[0,"Excuse me, where is the pharmacy?","سمحلي، وين كاين الصيدلية؟"],[1,"Go straight, then turn left.","امشي طول، وبعد دور على اليسار."],[0,"Is it far?","بعيدة؟"],[1,"No, it's near the mosque.","لا، قريبة من الجامع."]],
 tip:"«Excuse me» تستعملها قبل ما تسول واحد (سمحلي). و«Where is...?» = «وين...؟»."},
{id:5,lv:"B1",t:"السفر والمطار",en:"Travel & Airport",ic:"✈️",g:["#0369a1","#6366f1"],chars:["🧳","🧑‍✈️"],names:["Passenger","Agent"],
 w:[["Ticket","التذكرة","🎫","I bought a ticket online.","شريت التذكرة أونلاين."],
 ["Passport","جواز السفر","🛂","Don't forget your passport.","ما تنساش جواز السفر."],
 ["Luggage","الباغاج","🧳","My luggage is heavy.","الباغاج تاعي ثقيل."],
 ["Delayed","متأخر","⏰","The flight is delayed.","الطيارة متأخرة."],

/* ---------- SPEECH ---------- */
let voiceEN=null;
let voiceFR=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voiceFR=v.find(x=>/fr[-_]FR/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang))||null;voiceEN=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
let _tid=0;const _tcb={};window.__ttsDone=id=>{if(_tcb[id])_tcb[id]()};
let _sayTok=0;
async function say(text,o={}){
  const tok=++_sayTok;
  text=String(text).replace(/ﷺ/g," peace be upon him").replace(/[\u0600-\u06FF\u0750-\u077F]+/g," ").replace(/[«»“”"]/g," ").replace(/[’‘]/g,"'").replace(/\s+/g," ").trim();
  if(!text)return;
  const parts=text.length<=110?[text]:(text.match(/[^.!?;:]+[.!?;:]?/g)||[text]).map(x=>x.trim()).filter(Boolean);
  const chunks=[];let cur="";parts.forEach(x=>{if((cur+" "+x).length>110&&cur){chunks.push(cur);cur=x}else cur=(cur+" "+x).trim()});if(cur)chunks.push(cur);
  for(let i=0;i<chunks.length;i++){if(tok!==_sayTok)return;await say1(chunks[i],o)}
}
function say1(text,{rate=.9,pitch=1}={}){
  return new Promise(res=>{
    const guess=Math.max(1200,text.length*75);
    if(window.AndroidTTS){const id="u"+(++_tid);let d=false;const fin=()=>{if(!d){d=true;delete _tcb[id];res()}};_tcb[id]=fin;setTimeout(fin,guess+8000);try{if(AndroidTTS.speakL)AndroidTTS.speakL(text,rate,pitch,id,LN().tag);else AndroidTTS.speak(text,rate,pitch,id)}catch(e){fin()}return}
    try{
      if(!window.speechSynthesis)throw 0;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang=LN().tag;u.rate=rate;u.pitch=pitch;{const vv=S.lang==="fr"?voiceFR:voiceEN;if(vv)u.voice=vv}
      let done=false;const fin=()=>{if(!done){done=true;res()}};
      u.onend=fin;u.onerror=fin;setTimeout(fin,guess+4000);
      speechSynthesis.speak(u);
    }catch(e){setTimeout(res,guess)}
  });
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function quizTab(l){
  const all=L.flatMap(x=>x.w);
  const qs=shuffle(l.w).flatMap((w,i)=>{
    const t=i%3;
    const pool=(k,n)=>shuffle(all.filter(x=>x[k]!==w[k])).slice(0,n).map(x=>x[k]);
    if(t===0)return[{p:`<div class="big" style="font-size:90px">${w[2]}</div><div class="q">ماذا تعني هذه الصورة باللغة ${LN().ar}؟</div>`,a:w[0],o:shuffle([w[0],...pool(0,3)]),en:true,k:w[0]}];
    if(t===1)return[{p:`<div class="q">ما معنى ${E(w[0])} بالدارجة؟</div>`,a:w[1],o:shuffle([w[1],...pool(1,3)]),en:false,k:w[0]}];
    return[{p:`<div class="q">🔊 استمع واختر الكلمة الصحيحة</div><div class="row"><button class="spk" id="ql">🔊</button></div>`,a:w[0],o:shuffle([w[0],...pool(0,3)]),en:true,say:w[0],k:w[0]}];
  });
  let i=0,score=0;
  const show=()=>{lpb(60+i/qs.length*40);
    if(i>=qs.length){lpb(100);const ok=score>=qs.length*0.6;if(ok){S.done[l.id]=1;addXP(score*5+20);seedLesson(l);planMark(1)}save();head();
      $("#body").innerHTML=`<div class="card win"><div class="big">${ok?"🏆":"💪"}</div><h2>${score} / ${qs.length}</h2><div>${ok?"ممتاز! أنهيت الدرس وربحت نقاط ⭐"+(levelDone(l.lv)?`<div style="margin-top:12px"><button class="btn" id="cg" data-l="${l.lv}">🎓 أنهيت مستوى ${l.lv}! احصل على شهادتك</button></div>`:""):"قريب! راجع البطاقات وجرّب من جديد"}</div><div class="row" style="margin-top:14px"><button class="btn sec" id="rt">🔁 أعد</button><button class="btn" id="bk">القائمة</button></div></div>`;
      $("#rt").onclick=()=>quizTab(l);$("#bk").onclick=()=>go("lessons");return}
    const q=qs[i];
    $("#body").innerHTML=`<div class="card"><div class="ex" style="text-align:center">السؤال ${i+1} / ${qs.length}</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>${q.p}<div class="opts">${q.o.map(o=>`<button class="opt">${q.en?E(o):esc(o)}</button>`).join("")}</div></div>`;
    if(q.say){say(q.say);$("#ql").onclick=()=>say(q.say,{rate:.7})}
    app.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>{
      const good=q.o[k]===q.a;sfx(good);if(good)score++;if(q.k)srsRec(wid(q.k),good);
      app.querySelectorAll(".opt").forEach((x,m)=>{x.disabled=true;if(q.o[m]===q.a)x.classList.add("ok")});
      if(!good)b.classList.add("no");
      setTimeout(()=>{i++;show()},good?700:1400);
    });
  };
  show();
}

function pdfFromJpeg(jpg,w,h){

  obj(3,"<</Type/Page/Parent 2 0 R/MediaBox[0 0 841.89 595.28]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>");
  off[4]=len;push(enc(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`));push(jpg);push(enc("\nendstream\nendobj\n"));
  const cs="q 841.89 0 0 595.28 0 0 cm /Im0 Do Q";obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);

  push(enc(xr+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`));

{lv:"A1",ic:"🟢",t:"Être et avoir",ar:"فعلا الكينونة والملك",rules:["<b>être</b>: je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.","<b>avoir</b>: j'ai, tu as, il/elle a, nous avons, vous avez, ils/elles ont.","نستعمل avoir للعمر: J'ai vingt ans (وليس je suis).","النفي: ne ... pas حول الفعل: Je ne suis pas fatigué."],ex:[["Je suis étudiant.","أنا طالب."],["Elle a deux frères.","عندها أخوان."],["Nous ne sommes pas à la maison.","لسنا في البيت."],["Tu as quel âge ?","كم عمرك؟"]],q:[["Nous ___ contents.",["sommes","avons","êtes"],0],["J'___ vingt ans.",["suis","ai","as"],1],["Elle ___ une voiture.",["est","a","ont"],1],["Je ne ___ pas fatigué.",["suis","ai","es"],0]]},
{lv:"A1",ic:"🟢",t:"Articles and gender",ar:"أدوات التعريف والتنكير والجنس",rules:["كل اسم مذكر أو مؤنث. المعرّف: le (مذكر)، la (مؤنث)، l' (قبل حرف متحرك)، les (جمع).","النكرة: un (مذكر)، une (مؤنث)، des (جمع).","الجمع غالباً بإضافة s الصامتة: un livre → des livres.","احفظ الاسم مع أداته: le garçon، la fille، l'ami."],ex:[["Le livre est sur la table.","الكتاب على الطاولة."],["J'ai une sœur et un frère.","عندي أخت وأخ."],["Les enfants jouent.","الأطفال يلعبون."],["L'école est ouverte.","المدرسة مفتوحة."]],q:[["___ table est grande.",["Le","La","Les"],1],["Il y a ___ chat dans le jardin.",["un","une","des"],0],["___ amis de Paul sont ici.",["Le","La","Les"],2],["___ école est près d'ici.",["La","L'","Le"],1]]},
{lv:"A1",ic:"🟢",t:"Present tense and negation",ar:"المضارع والنفي",rules:["أفعال -er في المضارع: je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent.","النفي: ne + الفعل + pas. Je ne parle pas arabe ici.","قبل حرف متحرك: n': Il n'aime pas le thé.","السؤال: Est-ce que tu parles français ؟ أو بالتنغيم: Tu parles français ؟"],ex:[["Elle parle trois langues.","هي تتكلم ثلاث لغات."],["Nous mangeons à midi.","نأكل عند الظهر."],["Je n'aime pas le café.","لا أحب القهوة."],["Est-ce que vous habitez ici ?","هل تسكنون هنا؟"]],q:[["Nous ___ français.",["parlons","parlez","parle"],0],["Ils ___ au football.",["joue","jouent","jouons"],1],["Je ___ aime pas ça.",["ne","n'","pas"],0],["Il ___ aime pas le thé.",["ne","n'","non"],1]]},
{lv:"A2",ic:"🟡",t:"Passé composé",ar:"الماضي المركب",rules:["avoir (أو être) في المضارع + اسم المفعول: j'ai mangé, tu as fini, il a pris.","أفعال الحركة مع être: aller, venir, partir, arriver, rester... وتتفق مع الفاعل: elle est allée.","اسم المفعول لـ -er ينتهي بـ é: parler → parlé.","النفي يحيط بالمساعد: Je n'ai pas mangé."],ex:[["Hier, j'ai regardé un film.","البارحة شاهدت فيلماً."],["Elle est partie à huit heures.","غادرت عند الثامنة."],["Nous avons fini le travail.","أنهينا العمل."],["Ils n'ont pas répondu.","لم يجيبوا."]],q:[["Hier, j'___ mangé du poisson.",["suis","ai","a"],1],["Elle ___ allée au marché.",["a","est","ont"],1],["Nous ___ fini.",["avons","sommes","avez"],0],["Participe passé de parler:",["parlé","parlait","parler"],0]]},
{lv:"A2",ic:"🟡",t:"Futur proche",ar:"المستقبل القريب",rules:["aller في المضارع + المصدر: je vais manger, tu vas partir.","نستعمله لما سيحدث قريباً أو لخطة: Demain, je vais travailler.","النفي: Je ne vais pas sortir.","تصريف aller: vais, vas, va, allons, allez, vont."],ex:[["Je vais appeler ma mère.","سأتصل بأمي."],["Nous allons voyager en juillet.","سنسافر في جويلية."],["Il va pleuvoir.","ستمطر."],["Elles ne vont pas venir.","لن يأتين."]],q:[["Demain, je ___ travailler.",["vais","vas","va"],0],["Nous ___ partir bientôt.",["allons","allez","vont"],0],["Il ___ pleuvoir.",["vais","va","vont"],1],["Ils ___ venir ce soir.",["va","allons","vont"],2]]},
{lv:"A2",ic:"🟡",t:"Adjectives and possessives",ar:"الصفات وأدوات الملكية",rules:["الصفة تتفق مع الاسم: un grand garçon, une grande fille, des grands garçons.","المؤنث غالباً بإضافة e: petit → petite. والجمع بإضافة s.","الملكية: mon/ma/mes, ton/ta/tes, son/sa/ses، وتتبع جنس الشيء المملوك.","قبل مؤنث يبدأ بحرف متحرك نقول mon: mon amie."],ex:[["Ma sœur est petite.","أختي صغيرة."],["Ce sont mes amis.","هؤلاء أصدقائي."],["C'est une belle maison.","إنه بيت جميل."],["Son père est grand.","أبوه (أو أبوها) طويل."]],q:[["Une ___ fille.",["petit","petite","petits"],1],["___ mère est gentille.",["Mon","Ma","Mes"],1],["Ce sont ___ livres.",["mon","ma","mes"],2],["___ amie s'appelle Léa.",["Ma","Mon","Mes"],1]]},
{lv:"B1",ic:"🟠",t:"Imparfait vs passé composé",ar:"الماضي الناقص والمركب",rules:["<b>imparfait</b> للعادة والوصف والخلفية: Quand j'étais petit, je jouais dehors.","<b>passé composé</b> لحدث محدد منتهٍ: Hier, j'ai joué au foot.","الاثنان معاً: Il pleuvait quand je suis sorti.","تكوين imparfait: جذر nous في المضارع + ais, ais, ait, ions, iez, aient."],ex:[["Enfant, j'habitais à Alger.","وأنا طفل كنت أسكن في الجزائر."],["Il faisait beau quand nous sommes arrivés.","كان الجو جميلاً لما وصلنا."],["Elle lisait quand le téléphone a sonné.","كانت تقرأ لما رنّ الهاتف."],["Tous les étés, nous allions à la mer.","كل صيف كنا نذهب إلى البحر."]],q:[["Quand j'___ petit, je jouais dehors.",["étais","ai été","suis"],0],["Hier, il ___ un accident.",["avait","a eu","aura"],1],["Il ___ quand je suis sorti.",["pleuvait","a plu","pleut"],0],["L'imparfait sert à exprimer...",["une habitude passée","un futur","un ordre"],0]]},
{lv:"B1",ic:"🟠",t:"Object pronouns (COD / COI)",ar:"ضمائر المفعول",rules:["COD (مباشر): le, la, l', les. Je vois Paul → Je le vois.","COI (غير مباشر بـ à): lui, leur. Je parle à Marie → Je lui parle.","الضمير قبل الفعل: Je le mange. وفي الماضي المركب قبل المساعد: Je l'ai mangé.","me, te, nous, vous للمتكلم والمخاطب."],ex:[["Je la connais bien.","أعرفها جيداً."],["Il lui a téléphoné.","اتصل بها (أو به)."],["Nous les avons vus hier.","رأيناهم البارحة."],["Elle ne me comprend pas.","هي لا تفهمني."]],q:[["Je vois Paul. → Je ___ vois.",["le","lui","la"],0],["Je parle à Marie. → Je ___ parle.",["la","lui","leur"],1],["J'ai acheté les livres. → Je ___ ai achetés.",["les","leur","le"],0],["Il téléphone à ses parents. → Il ___ téléphone.",["les","leur","lui"],1]]},

S.gd=S.gd||{};S.pd=S.pd||{};S.vd=S.vd||{};S.rv=S.rv||{};S.stt=S.stt||"g";S.stl=S.stl||"A1";S.sti=null;
const SD=()=>S.lang==="fr"?{G:GR_FR,P:PH_FR,V:VP_FR}:{G:GR_EN,P:PH_EN,V:VP_EN};
const sk=(k,i)=>S.lang+k+i;
const clean=w=>w.replace(/\s*\(.*\)/,"");
function study(){
  const D=SD(),T=S.stt;
  const tabs=[["g","📘 القواعد"],["p","🔊 النطق"],["v","🔤 مفردات"],["r","🧪 مراجعة"]];
  const chips=`<div class="chips" id="slv">${LEVELS.map(l=>`<button class="chip ${S.stl===l.id?"on":""}" data-v="${l.id}">${l.ic} ${l.id}</button>`).join("")}</div>`;
  let body="";
  if(S.sti!=null){return studyItem()}
  if(T==="g"){body=chips+D.G.map((x,i)=>x.lv===S.stl?`<div class="card les" data-i="${i}"><div class="ic">${x.ic}</div><div><b class="en">${esc(x.t)}</b> <span>· ${x.ar}</span><div class="ex">${S.gd[sk("g",i)]?"✅ أنجزته":"شرح + أمثلة + 4 تمارين"}</div></div></div>`:"").join("")}
  else if(T==="p"){body=`<div class="note">أصوات صعبة على الناطق بالعربية، مع كلمات وتدريب استماع.</div>`+D.P.map((x,i)=>`<div class="card les" data-i="${i}"><div class="ic">${x.ic}</div><div><b class="en">${esc(x.t)}</b><div class="ex">${S.pd[sk("p",i)]?"✅ أنجزته":x.w.length+" كلمات"+(x.p.length?" + تدريب استماع":"")}</div></div></div>`).join("")}
  else if(T==="v"){body=chips+D.V.map((x,i)=>x.lv===S.stl?`<div class="card les" data-i="${i}"><div class="ic">${x.ic}</div><div><b class="en">${esc(x.t)}</b><div class="ex">${S.vd[sk("v",i)]?"✅ أنجزته":x.w.length+" كلمة + اختبار"}</div></div></div>`:"").join("")}
  else{const b=S.rv[S.lang+S.stl];body=chips+`<div class="card" style="text-align:center"><div style="font-size:44px">🧪</div><b>اختبار مراجعة مستوى ${S.stl}</b><div class="note">10 أسئلة من القواعد والمفردات الإضافية لهذا المستوى. النجاح بـ 8 من 10 يمنحك 30 نقطة.</div>${b!=null?`<div class="pill" style="background:#fef3c7;color:#92400e;margin:6px 0">🏆 أفضل نتيجة: ${b} / 10</div>`:""}<button class="btn" id="rst">ابدأ الاختبار</button></div>`}
  app.innerHTML=`<h2>📘 القواعد والنطق والمراجعة</h2><div class="chips" id="stt">${tabs.map(t=>`<button class="chip ${T===t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>`+body;
  $("#stt").onclick=e=>{const t=e.target.dataset.t;if(t){S.stt=t;study()}};
  const sl=$("#slv");if(sl)sl.onclick=e=>{const v=e.target.dataset.v;if(v){S.stl=v;study()}};
  app.querySelectorAll(".les").forEach(c=>c.onclick=()=>{S.sti=+c.dataset.i;study();scrollTo(0,0)});
  const rs=$("#rst");if(rs)rs.onclick=()=>studyReview();
}
function quizRun(box,qs,done,rate){
  let i=0,sc=0;
  const q=()=>{
    if(i>=qs.length){done(sc);return}
    const t=qs[i],o=shuffle(t.o.map((v,k)=>k));
    box.innerHTML=`<div style="font-size:12px;color:#6b7488">${i+1} / ${qs.length}</div>`+(t.say?`<button class="spk" id="qs" style="margin:6px 0">🔊 اسمع</button>`:"")+(t.q?`<div class="en" style="margin:8px 0;font-weight:700;direction:ltr;text-align:left;font-size:17px">${esc(t.q)}</div>`:"")+(t.h?`<div style="color:#6b7488;font-size:14px">${t.h}</div>`:"")+o.map(k=>`<button class="opt" data-k="${k}" style="display:block;width:100%;margin-top:8px;direction:ltr;text-align:left">${esc(t.o[k])}</button>`).join("");
    if(t.say){const p=()=>say(t.say,{rate:rate||.85});$("#qs").onclick=p;setTimeout(p,250)}
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const good=+b.dataset.k===t.a;sfx(good);if(good)sc++;if(t.id)srsRec(t.id,good);box.querySelectorAll(".opt").forEach(e=>{e.disabled=true;if(+e.dataset.k===t.a)e.classList.add("ok")});if(!good)b.classList.add("no");setTimeout(()=>{i++;q()},good?700:1400)});

function place(){
  const D=SD(),B=bank(),allW=D.V.flatMap(v=>v.w);
  app.innerHTML=`<button class="back">→ رجوع</button><h2>🎯 اختبار تحديد المستوى (${LN().ar})</h2><div class="note" style="margin:-6px 0 8px">أسئلة متدرجة من A1 إلى C1، ويتوقف الاختبار عند الصعوبة. أجب بصدق ولا تخمّن كثيراً.</div><div class="card" id="pbx"></div>`;
  $(".back").onclick=()=>go("home");const box=$("#pbx");
  const res={lv:[],g:[0,0],v:[0,0]};let li=0;
  const mkLevel=lv=>{
    const gq=[];D.G.forEach((g,gi)=>{if(g.lv===lv)g.q.forEach((q,k)=>gq.push({id:gid(gi,k),k:"mcq",ty:"g",p:`<div class="en" style="font-weight:700;font-size:17px;direction:ltr;text-align:left;margin:8px 0">${esc(q[0])}</div>`,o:q[1],a:q[2]}))});
    const vw=D.V.filter(v=>v.lv===lv).flatMap(v=>v.w);
    const mkv=(w,listen)=>{const d=shuffle(allW.filter(x=>x[0]!==w[0])).slice(0,3),o=shuffle([w,...d]);return{id:wid(w[0]),k:"mcq",ty:"v",o:o.map(x=>x[0]),a:o.indexOf(w),say:listen?w[0]:null,p:listen?`<div class="q">🔊 اسمع واختر الكلمة</div>`:`<div style="text-align:center;font-size:48px">${w[2]}</div><div class="q">ما الكلمة المناسبة لـ <b>${esc(w[1])}</b>؟</div>`}};
    const vs=shuffle(vw);
    return[...shuffle(gq).slice(0,2),mkv(vs[0],false),mkv(vs[1],true)];
  };
  const step=()=>{
    if(li>=LEVELS.length)return fin();
    const lv=LEVELS[li].id,tasks=mkLevel(lv);let k=0,sc=0;
    k=0;sc=0;
    const go1=()=>{
      if(k>=tasks.length){res.lv.push(sc);if(sc<=1)return fin();li++;return step()}
      const t=tasks[k];
      box.innerHTML=`<div class="ex" style="text-align:center">المستوى ${lv} · ${k+1} / ${tasks.length}</div><div class="bar"><i style="width:${(li*4+k)/(LEVELS.length*4)*100}%"></i></div><div id="tk"></div>`;
      exMCQ($("#tk"),t,good=>{if(good)sc++;const r=res[t.ty];r[0]++;if(good)r[1]++;srsRec(t._id||t.id,good);k++;go1()});
    };go1();
  };
  const fin=()=>{
    let placed="A1";for(let i=0;i<res.lv.length;i++){if(res.lv[i]>=3)placed=LEVELS[Math.min(i+1,LEVELS.length-1)].id;else{placed=LEVELS[i].id;break}}
    if(res.lv.length===LEVELS.length&&res.lv.every(x=>x>=3))placed="C1";
    const gp=res.g[0]?Math.round(100*res.g[1]/res.g[0]):0,vp=res.v[0]?Math.round(100*res.v[1]/res.v[0]):0;
    S.pl[S.lang]={lv:placed,g:gp,v:vp,d:dnum(),n:res.lv.length};S.dl=placed;S.gl=placed;S.stl=placed;save();addXP(20);
    const lvo=LEVELS.find(l=>l.id===placed),adv=gp+10<vp?"قواعدك أضعف من مفرداتك، ركّز على قسم القواعد.":vp+10<gp?"مفرداتك أضعف من قواعدك، ركّز على المفردات والمراجعة اليومية.":"مفرداتك وقواعدك متوازنة، تابع بانتظام.";
    box.innerHTML=`<div class="win"><div class="big">${lvo.ic}</div><h2>مستواك: ${lvo.name} <span class="en">${placed}</span></h2><div style="margin:8px 0">📚 المفردات والاستماع: <b>${vp}%</b> · 📘 القواعد: <b>${gp}%</b></div><div class="note">${adv}</div><div style="margin-top:10px"><button class="btn" id="g1">ابدأ من هنا</button> <button class="btn sec" id="g2">أعد الاختبار</button></div></div>`;
    $("#g1").onclick=()=>go("home");$("#g2").onclick=()=>place();
  };
  step();
}

function alTrace(){
  const B=alBase();S.alti=S.alti==null?0:S.alti;
  const ch=B[S.alti][0],txt=S.alcase==="l"?ch.toLowerCase():ch;
  const cv=$("#trc"),c=cv.getContext("2d"),W=260;
  const mk=(lw,fill)=>{const o=document.createElement("canvas");o.width=W;o.height=W;const x=o.getContext("2d");x.font="bold 190px Arial,sans-serif";x.textAlign="center";x.textBaseline="middle";if(fill){x.fillStyle="#000";x.fillText(txt,W/2,W/2+8)}else{x.lineWidth=lw;x.strokeStyle="#000";x.lineJoin="round";x.strokeText(txt,W/2,W/2+8);x.fillText(txt,W/2,W/2+8)}return o};
  const mask=mk(0,true),wide=mk(34,false);
  const user=document.createElement("canvas");user.width=W;user.height=W;const u=user.getContext("2d");u.lineWidth=18;u.lineCap="round";u.lineJoin="round";u.strokeStyle="#000";
  const draw=()=>{c.clearRect(0,0,W,W);c.globalAlpha=.18;c.drawImage(mask,0,0);c.globalAlpha=1;c.drawImage(user,0,0);c.save();c.globalCompositeOperation="source-in";c.restore()};
  const paintUser=()=>{c.clearRect(0,0,W,W);c.globalAlpha=.15;c.drawImage(mask,0,0);c.globalAlpha=1;const t=document.createElement("canvas");t.width=W;t.height=W;const x=t.getContext("2d");x.drawImage(user,0,0);x.globalCompositeOperation="source-in";x.fillStyle="#4f46e5";x.fillRect(0,0,W,W);c.drawImage(t,0,0)};
  paintUser();
  let dn=false,lp=null;const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*W/r.height]};
  cv.onpointerdown=e=>{dn=true;lp=pos(e);cv.setPointerCapture(e.pointerId);u.beginPath();u.moveTo(lp[0],lp[1]);u.lineTo(lp[0]+.1,lp[1]);u.stroke();paintUser()};
  cv.onpointermove=e=>{if(!dn)return;const p=pos(e);u.beginPath();u.moveTo(lp[0],lp[1]);u.lineTo(p[0],p[1]);u.stroke();lp=p;paintUser()};
  cv.onpointerup=cv.onpointercancel=()=>{dn=false};
  $("#trx").onclick=()=>{u.clearRect(0,0,W,W);paintUser();$("#trr").textContent=""};
  $("#trn").onclick=()=>{S.alti=(S.alti+1)%B.length;alpha()};
  $("#alt2").onclick=e=>{const v=e.target.dataset.c;if(v){S.alcase=v;alpha()}};
  $("#alt3").onclick=e=>{const b=e.target.closest("[data-i]");if(b){S.alti=+b.dataset.i;alpha()}};
  $("#trk").onclick=()=>{
    const md=mask.getContext("2d").getImageData(0,0,W,W).data,wd=wide.getContext("2d").getImageData(0,0,W,W).data,ud=u.getImageData(0,0,W,W).data;
    let mt=0,mh=0,ut=0,uo=0;
    for(let i=3;i<md.length;i+=4){const m=md[i]>100,w=wd[i]>100,uu=ud[i]>100;if(m)mt++;if(m&&uu)mh++;if(uu){ut++;if(w)uo++}}
    const cov=mt?mh/mt:0,pre=ut?uo/ut:0,ok=cov>=.5&&pre>=.6&&ut>200;
    sfx(ok);
    if(ok){const k=S.lang+"t"+txt;if(!S.alc[k]){S.alc[k]=1;addXP(5)}save()}
    $("#trr").innerHTML=ok?`<span style="color:#16a34a">✅ أحسنت! تغطية ${Math.round(cov*100)}%</span>`:`<span style="color:#dc2626">${ut<=200?"ارسم الحرف أولاً":cov<.5?"لم تغطِّ الحرف كاملاً ("+Math.round(cov*100)+"%)":"خرجتَ كثيراً عن الخطوط"} · امسح وحاول</span>`;
    if(ok)say(B[S.alti][1],{rate:.7});
  };
}

    $("#wi").focus();let fin=false;

function wrPrompt(){

 pts:["الصلاة ثاني أركان الإسلام، وهي عمود الدين وأول ما يحاسب عليه العبد.","الصلوات المفروضة خمس في اليوم والليلة: الفجر ركعتان، الظهر أربع، العصر أربع، المغرب ثلاث، العشاء أربع.","لكل صلاة وقت: الفجر من الفجر الصادق إلى طلوع الشمس، والظهر من زوال الشمس، والعصر إذا صار ظل الشيء مثله، والمغرب من غروب الشمس، والعشاء من مغيب الشفق.","شروط الصلاة: الإسلام والعقل والتمييز، ودخول الوقت، والطهارة، وستر العورة، واستقبال القبلة، والنية."],
 q:[["كم ركعة في صلاة المغرب؟",["اثنتان","ثلاث","أربع"],1],["كم عدد الصلوات المفروضة يومياً؟",["ثلاث","خمس","سبع"],1],["أيّ مما يلي من شروط الصلاة؟",["استقبال القبلة","الصيام","الحج"],0]]},
{id:"i4",ic:"🧎",t:"كيف نصلّي؟",en:[["Standing (qiyam)","القيام"],["Bowing (ruku)","الركوع"],["Prostration (sujud)","السجود"],["Sitting (julus)","الجلوس"],["Qiblah","القبلة"],["Peace be upon you","السلام عليكم"]],
 pts:["أركان الصلاة: القيام مع القدرة، تكبيرة الإحرام، قراءة الفاتحة، الركوع، الرفع منه، السجود، الجلوس بين السجدتين، التشهد الأخير، التسليم.","تبدأ بـ «الله أكبر» وتنتهي بالتسليم عن اليمين والشمال.","السجود على سبعة أعضاء: الجبهة مع الأنف، واليدان، والركبتان، وأطراف القدمين.","قال ﷺ: «صلّوا كما رأيتموني أصلّي»، فتعلّم الصلاة من عالم أو مصلٍّ متقن."],
 q:[["بماذا تبدأ الصلاة؟",["بالسلام","بتكبيرة الإحرام","بالركوع"],1],["بماذا تنتهي الصلاة؟",["بالتسليم","بالسجود","بالفاتحة"],0],["الركن الذي يُقرأ فيه سورة الفاتحة هو...",["القيام","الركوع","الجلوس"],0]]}]},
{sec:"الصيام",items:[
{id:"i5",ic:"🌙",t:"صيام رمضان",en:[["Fasting (sawm)","الصيام"],["Ramadan","رمضان"],["Pre-dawn meal (suhoor)","السحور"],["Breaking the fast (iftar)","الإفطار"],["Intention","النية"],["Eid","العيد"]],
 pts:["صيام رمضان ثالث أركان الإسلام، قال تعالى: ﴿يا أيها الذين آمنوا كُتب عليكم الصيام﴾.","يبدأ الصوم من طلوع الفجر الصادق إلى غروب الشمس، ويشترط له النية من الليل في الفرض.","مبطلاته: الأكل والشرب عمداً، والجماع، والقيء عمداً، وانقطاع دم الحيض والنفاس مع الحيض والنفاس نفسه.","يُسنّ السحور وتعجيل الفطر، والإكثار من القرآن والصدقة. ويُرخّص للمريض والمسافر الفطر مع القضاء."],
 q:[["من أي وقت يبدأ الصوم؟",["طلوع الشمس","طلوع الفجر الصادق","الظهر"],1],["أيّ مما يلي يبطل الصوم؟",["الأكل عمداً","النوم","المشي"],0],["ما حكم المسافر في رمضان؟",["يُرخّص له الفطر ثم يقضي","يُمنع من الصيام","لا يقضي"],0]]}]},
{sec:"الزكاة",items:[
{id:"i6",ic:"🤲",t:"الزكاة ومصارفها",en:[["Almsgiving (zakat)","الزكاة"],["The poor","الفقراء"],["The needy","المساكين"],["Wealth","المال"],["Charity (sadaqah)","الصدقة"],["Threshold (nisab)","النصاب"]],
 pts:["الزكاة رابع أركان الإسلام، وهي حق واجب في المال لأصناف معينة.","تجب إذا بلغ المال النصاب (ما يعادل 85 غراماً من الذهب تقريباً) وحال عليه الحول، وقدر زكاة النقود 2.5%.","مصارفها ثمانية بنص القرآن: الفقراء، المساكين، العاملون عليها، المؤلفة قلوبهم، وفي الرقاب، والغارمون، وفي سبيل الله، وابن السبيل.","زكاة الفطر صاع من طعام عن كل فرد قبل صلاة العيد، وهي طُهرة للصائم وطعمة للمساكين."],
 q:[["ما نسبة زكاة النقود؟",["2.5%","10%","20%"],0],["كم مصرفاً للزكاة؟",["ثلاثة","خمسة","ثمانية"],2],["متى تُخرج زكاة الفطر؟",["قبل صلاة العيد","بعد العيد بشهر","في رجب"],0]]}]},
{sec:"الآداب والأخلاق",items:[

 pts:["قال ﷺ: «إنما بُعثت لأتمم مكارم الأخلاق».","الصدق يهدي إلى البر، والكذب يهدي إلى الفجور. وأمانة الكلمة والعمل من الإيمان.","بر الوالدين من أعظم الواجبات، قال تعالى: ﴿وقضى ربك ألا تعبدوا إلا إياه وبالوالدين إحساناً﴾.","حق الجار عظيم، قال ﷺ: «من كان يؤمن بالله واليوم الآخر فليكرم جاره»."],
 q:[["الصدق يهدي إلى...",["البر","الفجور","الغفلة"],0],["بعد عبادة الله مباشرة في الآية يأتي الأمر بـ...",["الإحسان إلى الوالدين","السفر","التجارة"],0],["حق الجار...",["عظيم","لا يهم","للأغنياء فقط"],0]]},
{id:"i8",ic:"🍽️",t:"آداب يومية",en:[["Greeting (salam)","السلام"],["Eating with the right hand","الأكل باليمين"],["In the name of God","بسم الله"],["Thank God","الحمد لله"],["Visiting","الزيارة"]],
 pts:["إفشاء السلام: «السلام عليكم ورحمة الله»، والرد بأحسن منها أو بمثلها.","آداب الطعام: التسمية في أوله، والأكل باليمين مما يليك، والحمد في آخره، وعدم الإسراف.","استئذان الدخول ثلاثاً، فإن أُذن لك وإلا رجعت.","عيادة المريض واتباع الجنازة وإجابة الدعوة من حقوق المسلم على أخيه."],

{sec:"العقيدة",items:[

 pts:["أركان الإسلام خمسة: الشهادتان، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحج البيت لمن استطاع.","أركان الإيمان ستة: الإيمان بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، والقدر خيره وشره.","الإحسان: «أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك»، كما في حديث جبريل.","أصل الدين توحيد الله وإفراده بالعبادة، وهو معنى لا إله إلا الله."],
 q:[["كم عدد أركان الإسلام؟",["خمسة","ستة","أربعة"],0],["كم عدد أركان الإيمان؟",["خمسة","ستة","سبعة"],1],["الإحسان أن تعبد الله...",["كأنك تراه","في السر فقط","وقت الفراغ"],0]]}]},
{sec:"الأصول الثلاثة",items:[
{id:"i10",ic:"❓",t:"الأصول الثلاثة: التعريف",en:[["Lord","الرب"],["Religion","الدين"],["Prophet","النبي"],["Knowledge","العلم"],["Action","العمل"]],
 pts:["«الأصول الثلاثة وأدلتها» رسالة مختصرة للشيخ محمد بن عبد الوهاب (ت 1206هـ) رحمه الله.","موضوعها ثلاثة أسئلة يُسأل عنها كل عبد في قبره: من ربك؟ وما دينك؟ ومن نبيك؟","افتتحها بأربع مسائل يجب تعلمها: العلم، والعمل به، والدعوة إليه، والصبر على الأذى فيه.","ومعنى العلم هنا: معرفة الله ومعرفة نبيه ومعرفة دين الإسلام بالأدلة."],
 q:[["كم سؤالاً تدور عليه الرسالة؟",["ثلاثة","خمسة","سبعة"],0],["أيّ مما يلي من المسائل الأربع؟",["العلم","التجارة","السفر"],0],["من هو مؤلف الأصول الثلاثة؟",["الشيخ محمد بن عبد الوهاب","ابن بطوطة","الغزالي"],0]]},
{id:"i11",ic:"🕋",t:"الأصل الأول: معرفة الله",en:[["Creator","الخالق"],["Worship","العبادة"],["Supplication","الدعاء"],["Fear","الخوف"],["Hope","الرجاء"],["Trust in God","التوكل"]],
 pts:["إذا قيل لك: من ربك؟ فقل: ربي الله الذي رباني وربى جميع العالمين بنعمه، وهو معبودي ليس لي معبود سواه.","ودليله: ﴿الحمد لله رب العالمين﴾. ونعرف الله بآياته ومخلوقاته: الليل والنهار والشمس والقمر والسماوات والأرض.","الله خلقنا لعبادته: ﴿وما خلقت الجن والإنس إلا ليعبدون﴾، والعبادة هي توحيده وطاعته.","من أنواع العبادة: الدعاء والخوف والرجاء والتوكل والرغبة والرهبة والاستعانة والذبح والنذر، وصرفها لغير الله شرك."],
 q:[["لماذا خلقنا الله؟",["لعبادته","للهو","للتجارة"],0],["الدعاء من أنواع...",["العبادة","العادات","الألعاب"],0],["صرف العبادة لغير الله يسمى...",["شركاً","أدباً","سفراً"],0]]},
{id:"i12",ic:"📜",t:"الأصل الثاني: معرفة الدين",en:[["Submission","الاستسلام"],["Obedience","الطاعة"],["Three levels","ثلاث مراتب"],["Excellence (ihsan)","الإحسان"]],
 pts:["الدين: الاستسلام لله بالتوحيد والانقياد له بالطاعة والبراءة من الشرك وأهله.","للدين ثلاث مراتب: الإسلام، والإيمان، والإحسان، ولكل مرتبة أركان.","الإسلام خمسة أركان، والإيمان ستة، والإحسان ركن واحد: عبادة الله كأنك تراه.","هذه المراتب مأخوذة من حديث جبريل عليه السلام حين سأل النبي ﷺ عن الإسلام والإيمان والإحسان."],
 q:[["كم مرتبة للدين؟",["ثلاث","اثنتان","أربع"],0],["عدد أركان الإحسان:",["واحد","ثلاثة","ستة"],0],["من أين أُخذت مراتب الدين؟",["حديث جبريل","قصة شعبية","مثل عربي"],0]]},
{id:"i13",ic:"🌹",t:"الأصل الثالث: معرفة النبي ﷺ",en:[["Prophet Muhammad","النبي محمد"],["Mecca","مكة"],["Medina","المدينة"],["Migration (hijrah)","الهجرة"],["Messenger","الرسول"],["Seal of the prophets","خاتم النبيين"]],
 pts:["هو محمد بن عبد الله بن عبد المطلب بن هاشم، من قريش، وقريش من العرب، والعرب من ذرية إسماعيل بن إبراهيم عليهما السلام.","عاش ثلاثاً وستين سنة: أربعين قبل النبوة، وثلاثاً وعشرين نبياً ورسولاً.","نُبّئ بـ «اقرأ» وأُرسل بـ «المدثر»، وبُعث بمكة وهاجر إلى المدينة، وأقام بمكة ثلاث عشرة سنة بعد النبوة.","أرسله الله بالنذارة عن الشرك والدعوة إلى التوحيد، وهو خاتم النبيين، وطاعته واجبة واتباعه سبيل الجنة."],
 q:[["في أي مدينة بُعث النبي ﷺ؟",["مكة","المدينة","الشام"],0],["إلى أي مدينة هاجر؟",["المدينة","الطائف","القدس"],0],["كم عاش النبي ﷺ؟",["63 سنة","40 سنة","80 سنة"],0]]}]}

i1:{pts:["Purification is a condition for a valid prayer. The Prophet ﷺ said that God does not accept prayer without purification.","The Quran names four obligatory parts of wudu: washing the face, washing the arms up to the elbows, wiping the head, and washing the feet up to the ankles.","It is recommended to begin by saying 'Bismillah', then wash the hands, rinse the mouth and nose, and do the parts in order.","Wudu is broken by anything that comes out of the private parts, deep sleep, and loss of consciousness. Schools of thought differ on some details, so ask a scholar."],
 q:[["How many obligatory parts of wudu does the Quran mention?",["Two","Four","Six"]],["Which of these breaks wudu?",["Drinking water","Deep sleep","Walking"]],["Purification is a condition for a valid...",["Prayer","Meal","Journey"]]]},
i2:{pts:["A full bath (ghusl) is required after sexual impurity and after menstruation or postnatal bleeding ends.","Ghusl: make the intention, then wash the whole body with water, including rinsing the mouth and nose.","Tayammum (dry ablution) replaces water when it is not available or when using it would harm you because of illness.","How to do it: make the intention, strike clean earth with both palms, then wipe the face and the hands."],
 q:[["When is tayammum allowed?",["When water is unavailable or harmful to use","Before every prayer","Before eating"]],["What makes ghusl obligatory?",["Sexual impurity","Eating","Sleeping"]],["What do we use for tayammum?",["Clean earth","Hot water","Oil"]]]},
i3:{pts:["Prayer is the second pillar of Islam. It is the pillar of the religion and the first thing a person is asked about.","There are five daily prayers: Fajr has two rak'ahs, Dhuhr four, Asr four, Maghrib three, and Isha four.","Each prayer has its time: Fajr from true dawn to sunrise, Dhuhr after the sun passes its peak, Asr in the afternoon, Maghrib from sunset, and Isha when the red twilight fades.","Conditions of prayer: being Muslim, sane and mature, the time has come, purification, covering the awrah, facing the Qiblah, and the intention."],
 q:[["How many rak'ahs are in Maghrib?",["Two","Three","Four"]],["How many obligatory prayers are there each day?",["Three","Five","Seven"]],["Which is a condition of prayer?",["Facing the Qiblah","Fasting","Pilgrimage"]]]},
i4:{pts:["Pillars of prayer: standing if able, the opening takbeer, reciting Al-Fatihah, bowing, rising from it, prostrating, sitting between the two prostrations, the final tashahhud, and the salam.","The prayer begins with 'Allahu Akbar' and ends with the salam to the right and to the left.","Prostration is on seven parts: the forehead with the nose, both hands, both knees, and the toes.","The Prophet ﷺ said: 'Pray as you have seen me pray.' So learn the prayer from a knowledgeable teacher."],
 q:[["How does the prayer begin?",["With the salam","With the opening takbeer","With bowing"]],["How does the prayer end?",["With the salam","With prostration","With Al-Fatihah"]],["In which part do we recite Al-Fatihah?",["Standing","Bowing","Sitting"]]]},
i5:{pts:["Fasting in Ramadan is the third pillar of Islam. God says: 'O you who believe, fasting is prescribed for you.'","The fast lasts from true dawn until sunset, and the intention must be made at night for the obligatory fast.","What breaks the fast: eating or drinking on purpose, intercourse, vomiting on purpose, and menstruation or postnatal bleeding.","It is recommended to eat suhoor and to break the fast quickly. The sick and the traveller may break the fast and make it up later."],
 q:[["When does the fast begin?",["Sunrise","True dawn","Noon"]],["Which of these breaks the fast?",["Eating on purpose","Sleeping","Walking"]],["What about a traveller in Ramadan?",["May break the fast and make it up later","Is forbidden to fast","Never makes it up"]]]},
i6:{pts:["Zakat is the fourth pillar of Islam. It is an obligatory right in certain kinds of wealth.","It is due when your savings reach the nisab (about 85 grams of gold) and a full year has passed. The rate on cash is 2.5%.","The Quran names eight groups who may receive it: the poor, the needy, those who collect it, those whose hearts are being reconciled, freeing captives, those in debt, in the cause of God, and the traveller in need.","Zakat al-Fitr is one saa' of staple food per person, paid before the Eid prayer. It purifies the fasting person and feeds the poor."],
 q:[["What is the rate of zakat on cash?",["2.5%","10%","20%"]],["How many groups may receive zakat?",["Three","Five","Eight"]],["When is Zakat al-Fitr paid?",["Before the Eid prayer","A month after Eid","In Rajab"]]]},
i7:{pts:["The Prophet ﷺ said: 'I was sent to perfect good character.'","Honesty leads to goodness, and lying leads to wrongdoing. Being trustworthy in word and deed is part of faith.","Kindness to parents is among the greatest duties. God says to worship Him alone and to be good to your parents.","The neighbour has a great right. The Prophet ﷺ said that whoever believes in God and the Last Day should honour his neighbour."],
 q:[["Honesty leads to...",["Goodness","Wrongdoing","Neglect"]],["After worshipping God, the verse commands...",["Kindness to parents","Travelling","Trading"]],["The right of the neighbour is...",["Great","Unimportant","Only for the rich"]]]},
i8:{pts:["Spread the greeting: say 'Peace be upon you and God's mercy', and reply with a better greeting or the same.","Table manners: say 'Bismillah' first, eat with the right hand from what is in front of you, say 'Alhamdulillah' at the end, and do not waste.","Ask permission three times before entering a home. If you are not allowed in, go back.","Visiting the sick, attending a funeral, and accepting an invitation are rights a Muslim owes to his brother."],
 q:[["What do we say before eating?",["Bismillah","Alhamdulillah","Subhanallah"]],["Which hand do we eat with?",["The right","The left","Either"]],["How many times do we ask permission before entering?",["Three","Ten","Only once"]]]},
i9:{pts:["The five pillars of Islam: the two testimonies of faith, prayer, zakat, fasting Ramadan, and pilgrimage to the House for those who are able.","The six pillars of faith: belief in God, His angels, His books, His messengers, the Last Day, and the divine decree, its good and its bad.","Ihsan means to worship God as if you see Him, and if you do not see Him, He certainly sees you. This is from the hadith of Jibreel.","The root of the religion is the oneness of God and worshipping Him alone. This is the meaning of 'There is no god but God'."],
 q:[["How many pillars of Islam are there?",["Five","Six","Four"]],["How many pillars of faith are there?",["Five","Six","Seven"]],["Ihsan is to worship God...",["As if you see Him","Only in secret","In free time"]]]},
i10:{pts:["'The Three Fundamental Principles and Their Proofs' is a short treatise by Shaykh Muhammad ibn Abd al-Wahhab (died 1206 AH), may God have mercy on him.","It is built around three questions every person is asked in the grave: Who is your Lord? What is your religion? Who is your Prophet?","He opens with four matters to learn: knowledge, acting on it, calling others to it, and being patient with the harm that comes with it.","Knowledge here means knowing God, knowing His Prophet, and knowing the religion of Islam, with evidence."],
 q:[["How many questions does the treatise revolve around?",["Three","Five","Seven"]],["Which is one of the four matters?",["Knowledge","Trade","Travel"]],["Who wrote the Three Fundamental Principles?",["Muhammad ibn Abd al-Wahhab","Ibn Battuta","Al-Ghazali"]]]},
i11:{pts:["If you are asked 'Who is your Lord?', say: my Lord is God, who raised me and all the worlds with His blessings. He is the one I worship and I have no god besides Him.","The proof: 'All praise is for God, Lord of the worlds.' We know God through His signs: night and day, the sun and moon, the heavens and the earth.","God created us to worship Him: 'I did not create jinn and humans except to worship Me.' Worship means to make God one and to obey Him.","Kinds of worship include supplication, fear, hope, trust, longing, awe, seeking help, sacrifice, and vows. Giving any of these to anyone besides God is shirk."],
 q:[["Why did God create us?",["To worship Him","For play","For trade"]],["Supplication is a kind of...",["Worship","Custom","Game"]],["Giving worship to anyone besides God is called...",["Shirk","Good manners","Travel"]]]},
i12:{pts:["The religion is to submit to God by making Him one, to obey Him, and to be free of shirk and its people.","The religion has three levels: Islam, Iman, and Ihsan, and each level has pillars.","Islam has five pillars, Iman has six, and Ihsan has one: to worship God as if you see Him.","These levels come from the hadith of Jibreel, when he asked the Prophet ﷺ about Islam, faith, and ihsan."],
 q:[["How many levels does the religion have?",["Three","Two","Four"]],["How many pillars does Ihsan have?",["One","Three","Six"]],["Where do the levels of the religion come from?",["The hadith of Jibreel","A folk story","An Arab proverb"]]]},
i13:{pts:["He is Muhammad, son of Abdullah, son of Abd al-Muttalib, son of Hashim, from Quraysh. Quraysh are Arabs, descended from Ismail, son of Ibrahim, peace be upon them.","He lived sixty-three years: forty before prophethood and twenty-three as a prophet and messenger.","He became a prophet with 'Read!' and a messenger with 'O you who is wrapped'. He was sent in Mecca and migrated to Medina, after thirteen years in Mecca.","God sent him to warn against shirk and call to the oneness of God. He is the final prophet, obeying him is required, and following him is the path to Paradise."],
 q:[["In which city was the Prophet ﷺ sent?",["Mecca","Medina","Damascus"]],["To which city did he migrate?",["Medina","Taif","Jerusalem"]],["How long did the Prophet ﷺ live?",["63 years","40 years","80 years"]]]}

pts:["La purification est une condition de validité de la prière. Le Prophète ﷺ a dit que Dieu n'accepte pas la prière sans purification.","Le Coran cite quatre obligations des ablutions : laver le visage, laver les bras jusqu'aux coudes, essuyer la tête et laver les pieds jusqu'aux chevilles.","Il est recommandé de commencer par dire « Bismillah », puis de laver les mains, de rincer la bouche et le nez, et de suivre l'ordre des gestes.","Les ablutions sont annulées par ce qui sort des parties intimes, par le sommeil profond et par la perte de conscience. Les écoles divergent sur certains détails : demandez à un savant."],
q:[["Combien d'obligations des ablutions le Coran mentionne-t-il ?",["Deux","Quatre","Six"]],["Lequel de ces actes annule les ablutions ?",["Boire de l'eau","Le sommeil profond","Marcher"]],["La purification est une condition de validité de...",["la prière","un repas","un voyage"]]]},
i2:{t:"Le bain rituel et le tayammum",v:[["le bain rituel (ghusl)","الغسل"],["l'ablution sèche (tayammum)","التيمم"],["la terre propre","تراب طاهر"],["l'impureté","النجاسة"]],
pts:["Le bain rituel (ghusl) est obligatoire après l'impureté sexuelle et à la fin des règles ou des saignements post-nataux.","Le ghusl : faire l'intention, puis laver tout le corps avec de l'eau, en rinçant la bouche et le nez.","Le tayammum (ablution sèche) remplace l'eau quand on n'en a pas ou quand l'utiliser nuirait à cause d'une maladie.","Comment faire : formuler l'intention, frapper la terre propre avec les deux paumes, puis passer les mains sur le visage et sur les mains."],
q:[["Quand le tayammum est-il permis ?",["Quand l'eau manque ou nuit","Avant chaque prière","Avant de manger"]],["Qu'est-ce qui rend le ghusl obligatoire ?",["L'impureté sexuelle","Manger","Dormir"]],["Qu'utilise-t-on pour le tayammum ?",["De la terre propre","De l'eau chaude","De l'huile"]]]},
i3:{t:"Les cinq prières quotidiennes",v:[["la prière (salât)","الصلاة"],["la prière de l'aube (Fajr)","الفجر"],["la prière de midi (Dhuhr)","الظهر"],["la prière de l'après-midi (Asr)","العصر"],["la prière du coucher du soleil (Maghrib)","المغرب"],["la prière de la nuit (Isha)","العشاء"]],
pts:["La prière est le deuxième pilier de l'islam. Elle est le pilier de la religion et la première chose dont on est interrogé.","Il y a cinq prières par jour : le Fajr compte deux rak'at, le Dhuhr quatre, l'Asr quatre, le Maghrib trois et l'Isha quatre.","Chaque prière a son temps : le Fajr de l'aube vraie au lever du soleil, le Dhuhr après le zénith, l'Asr dans l'après-midi, le Maghrib au coucher du soleil et l'Isha quand le crépuscule rouge disparaît.","Conditions de la prière : être musulman, sain d'esprit et pubère, l'entrée du temps, la purification, couvrir l'awra, faire face à la Qibla et l'intention."],
q:[["Combien de rak'at compte le Maghrib ?",["Deux","Trois","Quatre"]],["Combien de prières obligatoires y a-t-il par jour ?",["Trois","Cinq","Sept"]],["Laquelle est une condition de la prière ?",["Faire face à la Qibla","Jeûner","Le pèlerinage"]]]},
i4:{t:"Comment prier ?",v:[["la station debout (qiyâm)","القيام"],["l'inclinaison (rukû')","الركوع"],["la prosternation (sujûd)","السجود"],["la position assise (julûs)","الجلوس"],["la Qibla","القبلة"],["Que la paix soit sur vous","السلام عليكم"]],
pts:["Piliers de la prière : se tenir debout si l'on peut, le takbîr d'ouverture, réciter Al-Fâtiha, s'incliner, se redresser, se prosterner, s'asseoir entre les deux prosternations, le dernier tashahhud et le salâm.","La prière commence par « Allahu Akbar » et se termine par le salâm à droite et à gauche.","La prosternation se fait sur sept parties : le front avec le nez, les deux mains, les deux genoux et le bout des pieds.","Le Prophète ﷺ a dit : « Priez comme vous m'avez vu prier. » Apprenez donc la prière auprès d'un enseignant compétent."],
q:[["Par quoi la prière commence-t-elle ?",["Par le salâm","Par le takbîr d'ouverture","Par l'inclinaison"]],["Par quoi la prière se termine-t-elle ?",["Par le salâm","Par la prosternation","Par Al-Fâtiha"]],["Dans quelle position récite-t-on Al-Fâtiha ?",["Debout","Incliné","Assis"]]]},
i5:{t:"Le jeûne du Ramadan",v:[["le jeûne (sawm)","الصيام"],["le Ramadan","رمضان"],["le repas avant l'aube (suhûr)","السحور"],["la rupture du jeûne (iftâr)","الإفطار"],["l'intention","النية"],["l'Aïd","العيد"]],
pts:["Le jeûne du Ramadan est le troisième pilier de l'islam. Dieu dit : « Ô vous qui croyez, le jeûne vous est prescrit. »","Le jeûne dure de l'aube vraie jusqu'au coucher du soleil, et l'intention doit être faite la nuit pour le jeûne obligatoire.","Ce qui rompt le jeûne : manger ou boire volontairement, les rapports conjugaux, vomir volontairement, et les règles ou les saignements post-nataux.","Il est recommandé de prendre le suhûr et de rompre le jeûne sans tarder. Le malade et le voyageur peuvent ne pas jeûner et rattraper plus tard."],
q:[["Quand le jeûne commence-t-il ?",["Au lever du soleil","À l'aube vraie","À midi"]],["Lequel de ces actes rompt le jeûne ?",["Manger volontairement","Dormir","Marcher"]],["Et le voyageur pendant le Ramadan ?",["Il peut ne pas jeûner et rattraper","Il lui est interdit de jeûner","Il ne rattrape jamais"]]]},
i6:{t:"La zakât",v:[["l'aumône légale (zakât)","الزكاة"],["les pauvres","الفقراء"],["les nécessiteux","المساكين"],["la richesse","المال"],["l'aumône volontaire (sadaqa)","الصدقة"],["le seuil (nisâb)","النصاب"]],
pts:["La zakât est le quatrième pilier de l'islam. C'est un droit obligatoire sur certains types de biens.","Elle est due lorsque l'épargne atteint le nisâb (environ 85 grammes d'or) et qu'une année entière s'est écoulée. Le taux sur l'argent est de 2,5 %.","Le Coran cite huit catégories de bénéficiaires : les pauvres, les nécessiteux, ceux qui la collectent, ceux dont les cœurs sont à rallier, l'affranchissement des captifs, les endettés, la voie de Dieu et le voyageur en difficulté.","La zakât al-fitr est un sâ' de nourriture de base par personne, versé avant la prière de l'Aïd. Elle purifie celui qui jeûne et nourrit les pauvres."],
q:[["Quel est le taux de la zakât sur l'argent ?",["2,5 %","10 %","20 %"]],["Combien de catégories peuvent la recevoir ?",["Trois","Cinq","Huit"]],["Quand verse-t-on la zakât al-fitr ?",["Avant la prière de l'Aïd","Un mois après l'Aïd","En Rajab"]]]},
i7:{t:"Le bon caractère",v:[["l'honnêteté","الصدق"],["la gentillesse","اللطف"],["la patience","الصبر"],["le respect","الاحترام"],["les parents","الوالدان"],["le voisin","الجار"]],
pts:["Le Prophète ﷺ a dit : « J'ai été envoyé pour parfaire les bonnes mœurs. »","L'honnêteté mène au bien, et le mensonge mène au mal. Être digne de confiance en paroles et en actes fait partie de la foi.","Être bon envers ses parents est l'un des plus grands devoirs. Dieu ordonne de L'adorer Lui seul et de bien traiter ses parents.","Le voisin a un grand droit. Le Prophète ﷺ a dit que celui qui croit en Dieu et au Jour dernier doit honorer son voisin."],
q:[["L'honnêteté mène...",["au bien","au mal","à l'oubli"]],["Après l'adoration de Dieu, le verset ordonne...",["la bonté envers les parents","de voyager","de commercer"]],["Le droit du voisin est...",["grand","sans importance","réservé aux riches"]]]},
i8:{t:"Les bonnes manières",v:[["le salut (salâm)","السلام"],["manger de la main droite","الأكل باليمين"],["Au nom de Dieu","بسم الله"],["Louange à Dieu","الحمد لله"],["la visite","الزيارة"]],
pts:["Répandez le salut : dites « Que la paix et la miséricorde de Dieu soient sur vous », et répondez par un meilleur salut ou le même.","Manières à table : dire « Bismillah » au début, manger de la main droite ce qui est devant soi, dire « Alhamdulillah » à la fin, et ne pas gaspiller.","Demandez la permission trois fois avant d'entrer dans une maison. Si l'on ne vous l'accorde pas, repartez.","Rendre visite au malade, suivre un enterrement et accepter une invitation sont des droits qu'un musulman doit à son frère."],
q:[["Que dit-on avant de manger ?",["Bismillah","Alhamdulillah","Subhânallah"]],["De quelle main mange-t-on ?",["La droite","La gauche","Les deux"]],["Combien de fois demande-t-on la permission avant d'entrer ?",["Trois","Dix","Une seule fois"]]]},
i9:{t:"Les piliers de l'islam et de la foi",v:[["la foi (îmân)","الإيمان"],["l'islam","الإسلام"],["l'unicité de Dieu (tawhîd)","التوحيد"],["les anges","الملائكة"],["les livres","الكتب"],["les messagers","الرسل"],["le Jour dernier","اليوم الآخر"],["le décret divin","القدر"]],
pts:["Les cinq piliers de l'islam : les deux attestations de foi, la prière, la zakât, le jeûne du Ramadan et le pèlerinage à la Maison pour qui le peut.","Les six piliers de la foi : croire en Dieu, en Ses anges, en Ses livres, en Ses messagers, au Jour dernier et au décret divin, bon ou mauvais.","L'ihsân, c'est adorer Dieu comme si tu Le voyais, car si tu ne Le vois pas, Lui te voit. C'est tiré du hadith de Jibrîl.","La racine de la religion est l'unicité de Dieu et L'adorer Lui seul. C'est le sens de « Il n'y a de dieu que Dieu »."],
q:[["Combien y a-t-il de piliers de l'islam ?",["Cinq","Six","Quatre"]],["Combien y a-t-il de piliers de la foi ?",["Cinq","Six","Sept"]],["L'ihsân, c'est adorer Dieu...",["comme si on Le voyait","seulement en secret","pendant le temps libre"]]]},
i10:{t:"Les trois fondements : introduction",v:[["le Seigneur","الرب"],["la religion","الدين"],["le Prophète","النبي"],["la science (savoir)","العلم"],["l'action","العمل"]],
pts:["« Les trois fondements et leurs preuves » est un court traité du cheikh Muhammad ibn Abd al-Wahhâb (mort en 1206 de l'Hégire), que Dieu lui fasse miséricorde.","Il s'articule autour de trois questions posées à chacun dans la tombe : Qui est ton Seigneur ? Quelle est ta religion ? Qui est ton Prophète ?","Il commence par quatre points à apprendre : le savoir, agir selon lui, appeler les autres à lui et patienter face au mal qui en découle.","Le savoir signifie ici connaître Dieu, connaître Son Prophète et connaître la religion de l'islam, avec les preuves."],
q:[["Autour de combien de questions le traité s'articule-t-il ?",["Trois","Cinq","Sept"]],["Lequel est l'un des quatre points ?",["Le savoir","Le commerce","Le voyage"]],["Qui a écrit Les trois fondements ?",["Muhammad ibn Abd al-Wahhâb","Ibn Battûta","Al-Ghazâlî"]]]},
i11:{t:"Premier fondement : connaître Dieu",v:[["le Créateur","الخالق"],["l'adoration","العبادة"],["l'invocation","الدعاء"],["la crainte","الخوف"],["l'espoir","الرجاء"],["la confiance en Dieu","التوكل"]],
pts:["Si l'on te demande « Qui est ton Seigneur ? », dis : mon Seigneur est Dieu, qui m'a élevé, moi et tous les mondes, par Ses bienfaits. C'est Lui que j'adore et je n'ai pas d'autre dieu que Lui.","La preuve : « Louange à Dieu, Seigneur des mondes. » Nous connaissons Dieu par Ses signes : la nuit et le jour, le soleil et la lune, les cieux et la terre.","Dieu nous a créés pour L'adorer : « Je n'ai créé les djinns et les hommes que pour qu'ils M'adorent. » L'adoration, c'est affirmer Son unicité et Lui obéir.","Parmi les formes d'adoration : l'invocation, la crainte, l'espoir, la confiance, le désir, la révérence, la demande d'aide, le sacrifice et le vœu. Les adresser à un autre que Dieu est du chirk (associationnisme)."],
q:[["Pourquoi Dieu nous a-t-Il créés ?",["Pour L'adorer","Pour jouer","Pour commercer"]],["L'invocation est une forme d'...",["adoration","habitude","amusement"]],["Adresser l'adoration à un autre que Dieu s'appelle...",["le chirk","la politesse","le voyage"]]]},
i12:{t:"Deuxième fondement : connaître la religion",v:[["la soumission","الاستسلام"],["l'obéissance","الطاعة"],["trois degrés","ثلاث مراتب"],["l'excellence (ihsân)","الإحسان"]],
pts:["La religion, c'est se soumettre à Dieu par l'affirmation de Son unicité, Lui obéir et se désavouer du chirk et de ses gens.","La religion comporte trois degrés : l'islam, l'îmân et l'ihsân, et chaque degré a ses piliers.","L'islam a cinq piliers, l'îmân en a six, et l'ihsân en a un : adorer Dieu comme si tu Le voyais.","Ces degrés viennent du hadith de Jibrîl, quand il interrogea le Prophète ﷺ sur l'islam, la foi et l'ihsân."],
q:[["Combien de degrés la religion comporte-t-elle ?",["Trois","Deux","Quatre"]],["Combien de piliers l'ihsân a-t-il ?",["Un","Trois","Six"]],["D'où viennent les degrés de la religion ?",["Du hadith de Jibrîl","D'un conte populaire","D'un proverbe arabe"]]]},
i13:{t:"Troisième fondement : connaître le Prophète ﷺ",v:[["le Prophète Muhammad","النبي محمد"],["La Mecque","مكة"],["Médine","المدينة"],["l'émigration (hijra)","الهجرة"],["le Messager","الرسول"],["le sceau des prophètes","خاتم النبيين"]],
pts:["Il est Muhammad, fils d'Abdallah, fils d'Abd al-Muttalib, fils de Hâchim, de Quraych. Les Quraych sont des Arabes, descendants d'Ismaël, fils d'Abraham, paix sur eux.","Il a vécu soixante-trois ans : quarante avant la prophétie et vingt-trois comme prophète et messager.","Il est devenu prophète avec « Lis ! » et messager avec « Ô toi, enveloppé dans ton manteau ». Il a été envoyé à La Mecque et a émigré à Médine, après treize ans passés à La Mecque.","Dieu l'a envoyé pour mettre en garde contre le chirk et appeler à l'unicité de Dieu. Il est le dernier prophète, lui obéir est obligatoire et le suivre est le chemin du Paradis."],

function islam(){
  const n=Object.keys(S.isl).length;
  app.innerHTML=`<button class="back">→ رجوع</button><h2>🕌 أساسيات الإسلام</h2><div class="note" style="margin:-6px 0 8px">دروس ب${S.lang==="fr"?"الفرنسية":"الإنجليزية"} البسيطة مع ترجمة عربية يمكن إخفاؤها ومفردات مشروحة بالعربية. أتممت ${n} / ${IA().length}. تختلف المذاهب الفقهية في بعض التفاصيل، فراجع عالماً موثوقاً في الجزئيات.</div>`+
  ISL.map(s=>`<h3 style="margin:14px 0 6px">${s.sec}</h3>`+s.items.map(x0=>{const x=IA().find(y=>y.id===x0.id);return `<div class="card les" data-i="${x.id}"><div class="ic">${x.ic}</div><div><b class="en">${esc(x.et)}</b> <span>· ${x.t}</span><div class="ex">${S.isl[x.id]?"✅ أنجزته":x.en.length+" مفردات"}</div></div></div>`}).join("")).join("");
  $(".back").onclick=()=>go("home");
  app.querySelectorAll(".les").forEach(e=>e.onclick=()=>go("islesson",{iid:e.dataset.i}));
}
function islesson(){
  const x=IA().find(y=>y.id===S.iid);
  app.innerHTML=`<button class="back">→ رجوع</button><h2>${x.ic} <span class="en">${esc(x.et)}</span> · ${x.t}</h2><div class="note" style="margin:-6px 0 8px">${x.sec} · اضغط 🔊 لسماع كل نقطة · <a id="tgl" style="color:var(--pri);cursor:pointer;font-weight:700">إظهار/إخفاء الترجمة العربية</a></div>
  <div class="card ${S.islAr===false?"hidear":""}" id="pc">${x.ept.map((p,i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="display:flex;gap:8px;align-items:flex-start"><button class="spk" data-p="${i}" style="width:34px;height:34px;font-size:14px;flex:none">🔊</button><div class="en" style="font-size:17px;line-height:1.7;font-weight:600;direction:ltr;text-align:left">${i+1}. ${esc(p)}</div></div><div class="arx" style="color:#6b7488;font-size:14px;line-height:1.8;margin-top:4px">🇩🇿 ${esc(x.pts[i])}</div></div>`).join("")}</div>
  <div class="card"><b>🔤 المفردات (${S.lang==="fr"?"فرنسي":"إنجليزي"} ← عربي)</b>${x.en.map((w,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><button class="spk" data-i="${i}" style="width:36px;height:36px;font-size:15px">🔊</button><span class="en" style="font-weight:700">${esc(w[0])}</span><span>${esc(w[1])}</span></div>`).join("")}</div>
  <div class="card"><b>🎯 Quiz</b><div id="iq"></div></div>`;
  const ar=()=>{document.querySelectorAll(".arx").forEach(e=>e.style.display=S.islAr===false?"none":"")};ar();
  $("#tgl").onclick=()=>{S.islAr=S.islAr===false;ar()};
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>say(x.ept[+b.dataset.p],{rate:.8}));
  $(".back").onclick=()=>{stopVideo();go("islam")};
  app.querySelectorAll(".spk[data-i]").forEach(b=>b.onclick=()=>say(x.en[+b.dataset.i][0].replace(/\s*\(.*\)/,""),{rate:.8}));
  let i=0,sc=0;
  const q=()=>{
    if(i>=x.q.length){const ok=sc>=2;if(ok&&!S.isl[x.id]){S.isl[x.id]=1;addXP(20)}else save();sfx(ok);
      $("#iq").innerHTML=`<div class="win"><div class="big">${ok?"🏆":"💪"}</div><h2>${sc} / ${x.q.length}</h2><div>${S.lang==="fr"?(ok?"Bravo ! بارك الله فيك (+20 نقطة)":"Révisez la leçon et réessayez · راجع الدرس"):(ok?"Well done! بارك الله فيك (+20 نقطة)":"Review the lesson and try again · راجع الدرس")}</div><button class="btn" id="ir" style="margin-top:8px">🔁 أعد</button> <button class="btn sec" id="il">الدروس</button></div>`;
      $("#ir").onclick=()=>{i=0;sc=0;q()};$("#il").onclick=()=>go("islam");return}
    const t=x.eq[i],o=shuffle(t[1].map((v,k)=>k));
    $("#iq").innerHTML=`<div class="en" style="margin:8px 0;font-weight:700;direction:ltr;text-align:left">${i+1}. ${esc(t[0])}</div><div class="arx" style="color:#6b7488;font-size:14px;display:${S.islAr===false?"none":"block"}">🇩🇿 ${esc(t[3])}</div>`+o.map(k=>`<button class="opt" data-k="${k}" style="display:block;width:100%;margin-top:8px;direction:ltr">${esc(t[1][k])}</button>`).join("");
    $("#iq").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const good=+b.dataset.k===t[2];sfx(good);if(good)sc++;$("#iq").querySelectorAll(".opt").forEach(e=>{e.disabled=true;if(+e.dataset.k===t[2])e.classList.add("ok")});if(!good)b.classList.add("no");setTimeout(()=>{i++;q()},good?800:1500)});
  };
  q();
}

async function gemini(hist,maxTok,onText){

 s:[["Two years ago, Omar ate fast food every day.","قبل سنتين، عمر كان ياكل الفاست فود كل نهار."],["He felt tired and he had gained a lot of weight.","كان يحس بالتعب وزاد في وزنو بزاف."],["His doctor warned him that he needed to change his lifestyle.","طبيبو حذّرو بلي لازم يغيّر نمط حياتو."],["So he started walking for thirty minutes every morning.","فبدا يمشي 30 دقيقة كل صباح."],["He also replaced soft drinks with water and added vegetables to his meals.","وبدّل المشروبات الغازية بالما وزاد الخضرة في وجباتو."],["After a year, he had lost twenty kilos.","بعد عام، نقص 20 كيلو."],["Today he says that small habits can change a life.","اليوم يقول بلي العادات الصغيرة تغيّر حياة."]],

{id:"s10",lv:"B2",t:"The Remote Worker",ar:"الخدمة من البيت",ic:"💻",
 s:[["Since the pandemic, many companies have allowed employees to work from home.","منذ الجائحة، شركات كثيرة سمحت للموظفين يخدمو من الدار."],["Lina, a graphic designer, was thrilled at first.","لينا، مصممة، كانت متحمسة في الأول."],["She no longer wasted two hours commuting every day.","ما بقاتش تضيّع ساعتين في المواصلات كل نهار."],["However, she soon discovered that the boundary between work and rest had become blurred.","بصح اكتشفت بسرعة بلي الحدود بين الخدمة والراحة ولات ضبابية."],["She found herself answering emails at midnight.","لقات روحها ترد على الإيميلات في نص الليل."],["Eventually, she set strict working hours and created a separate workspace.","في الأخير، حددت ساعات عمل صارمة وخلقت مكان خدمة منفصل."],["As a result, her productivity increased and her stress decreased.","ونتيجة لذلك، زادت إنتاجيتها ونقص الضغط."]],
 g:{employees:"الموظفين",thrilled:"متحمس",commuting:"التنقل للعمل",boundary:"الحدود",blurred:"ضبابي",productivity:"الإنتاجية"},
