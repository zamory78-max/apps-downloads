{id:"s11",lv:"B2",t:"The Last Train",ar:"آخر قطار",ic:"🚆",
 s:[["It was nearly midnight when Hana realised she had missed the last train.","كانت تقريبا نص الليل كي لاحظت هنا بلي فاتها آخر تران."],["The platform was empty, apart from an old man reading a newspaper.","الرصيف كان فارغ، ماعدا شيخ يقرا جريدة."],["'You look worried,' he said without lifting his eyes.","قال من دون ما يرفع عينيه: باينة عليك قلقانة."],["She explained that her phone had died and that she had no way to call a taxi.","شرحتلو بلي تليفونها طفى وما عندها كيفاش تعيّط لطاكسي."],["To her surprise, he handed her his own phone without hesitation.","ولدهشتها، ناولها تليفونو من غير تردد."],["Within ten minutes, a taxi arrived, and Hana thanked him warmly.","في عشر دقايق، وصل طاكسي، وهنا شكرتو بحرارة."],["She never forgot that small act of kindness from a complete stranger.","ما نستش أبدا هذا الفعل الصغير من الطيبة من غريب تماما."]],
 g:{realised:"أدركت",platform:"الرصيف",hesitation:"تردد",stranger:"غريب",kindness:"الطيبة",handed:"ناول"},
 q:[["Why couldn't Hana call a taxi?",["She had no money","Her phone had died","She forgot the number"],1],["What did the old man do?",["Ignored her","Lent her his phone","Called the police"],1],["What did Hana remember afterwards?",["The delay","A small act of kindness","The cold weather"],1]]},
{id:"s12",lv:"B2",t:"Social Media Debate",ar:"جدل السوشيال ميديا",ic:"📱",
 s:[["Some people argue that social media brings the world closer together.","بعض الناس يقولو بلي السوشيال ميديا تقرّب العالم."],["Others claim that it makes us lonelier than ever.","وآخرين يزعمو بلي تخلينا أكثر وحدة من قبل."],["Research suggests that both views contain some truth.","الأبحاث تقترح بلي الرأيين فيهم شوية حقيقة."],["On the one hand, teenagers can share ideas with peers across continents.","من جهة، المراهقين يقدرو يتشاركو الأفكار مع أقرانهم عبر القارات."],["On the other hand, constant comparison with others can damage self-esteem.","ومن جهة أخرى، المقارنة المستمرة مع الآخرين تضر بالثقة بالنفس."],["Experts therefore recommend limiting screen time and following positive accounts.","لهذا ينصح الخبراء بتحديد وقت الشاشة ومتابعة حسابات إيجابية."],["Ultimately, the impact depends on how we choose to use it.","في الأخير، التأثير يعتمد على كيفاش نختارو نستعملوها."]],
 g:{argue:"يرى / يجادل",lonelier:"أكثر وحدة",peers:"الأقران",constant:"مستمر","self-esteem":"الثقة بالنفس",ultimately:"في النهاية"},
 q:[["What do experts recommend?",["Quitting entirely","Limiting screen time","Posting more"],1],["According to research...",["Only the first view is true","Both views contain some truth","Neither view is true"],1],["The impact depends on...",["The app","How we use it","The country"],1]]},
{id:"s13",lv:"C1",t:"The Paradox of Choice",ar:"مفارقة الاختيار",ic:"🧠",
 s:[["We tend to assume that having more options inevitably makes us happier.","نميلو نفترضو بلي كثرة الخيارات تسعدنا حتما."],["Psychologist Barry Schwartz challenged this assumption, arguing that an abundance of choices can be paralysing.","عالم النفس باري شوارتز شكّك في هذا الافتراض، قائلا إن وفرة الخيارات قد تشلّ."],["When faced with dozens of alternatives, people often postpone decisions or regret the ones they make.","حين نواجه عشرات البدائل، الناس غالبا يؤجلو القرارات أو يندمو على اللي يتخذوها."],["Moreover, the expectation of finding the perfect option fuels dissatisfaction, however good the outcome.","علاوة على ذلك، توقع إيجاد الخيار المثالي يغذّي عدم الرضا مهما كانت النتيجة جيدة."],["Some economists dispute these findings, noting that results vary considerably across cultures.","بعض الاقتصاديين يطعنو في هذه النتائج، مشيرين لاختلافها بين الثقافات."],["Nevertheless, the idea has influenced how designers simplify menus, websites and even ballots.","ومع ذلك، الفكرة أثّرت على كيفاش المصممين يبسطو القوائم والمواقع وحتى أوراق الاقتراع."]],
 g:{assumption:"افتراض",abundance:"وفرة",paralysing:"مشلّ",postpone:"يؤجّل",regret:"يندم",dispute:"يطعن في"},
 q:[["What did Schwartz argue?",["More choice always helps","Too many choices can paralyse","Choices are irrelevant"],1],["How do some economists respond?",["They agree fully","They dispute the findings","They ignore the idea"],1],["The idea has influenced...",["Design simplification","Tax law","Sports rules"],0]]},
{id:"s14",lv:"C1",t:"Lost Languages",ar:"اللغات المفقودة",ic:"🗣️",
 s:[["Linguists estimate that roughly one language disappears every two weeks.","اللغويون يقدّرو أن لغة تختفي تقريبا كل أسبوعين."],["When the last fluent speaker dies, an entire worldview is lost with them.","كي يموت آخر متحدث بطلاقة، تضيع معاه نظرة كاملة للعالم."],["This is not merely a matter of nostalgia: languages encode unique knowledge about medicine, ecology and history.","هذا ماشي مجرد حنين: اللغات تحمل معرفة فريدة عن الطب والبيئة والتاريخ."],["Despite grim predictions, some communities have achieved remarkable revivals.","رغم التوقعات القاتمة، بعض المجتمعات حققت إحياءات ملفتة."],["Welsh, for instance, has gained thousands of new speakers thanks to schools and digital media.","الويلزية مثلا اكتسبت آلاف المتحدثين الجدد بفضل المدارس والإعلام الرقمي."],["Whether such efforts can be replicated on a global scale remains an open question.","هل يمكن تكرار هذه الجهود على نطاق عالمي يبقى سؤالا مفتوحا."]],
 g:{linguists:"اللغويون",fluent:"طليق",nostalgia:"حنين",encode:"يحمل / يرمّز",revivals:"إحياء",replicated:"يُكرَّر"},

{id:"s15",lv:"C1",t:"A Case for Slowness",ar:"في مدح البطء",ic:"🐢",
 s:[["In an age obsessed with speed, deliberately slowing down has become almost a radical act.","في عصر مهووس بالسرعة، التباطؤ عمدا صار شبه فعل ثوري."],["Proponents of the 'slow movement' contend that rushing erodes both quality and well-being.","أنصار حركة البطء يرون أن الاستعجال يضعف الجودة والعافية."],["A growing body of research indicates that deep concentration requires uninterrupted stretches of time.","مجموعة متنامية من الأبحاث تشير أن التركيز العميق يتطلب فترات متواصلة."],["Yet critics point out that few people can afford to disconnect, particularly those in precarious jobs.","لكن النقاد يشيرون أن قلة من الناس يقدرو ينقطعو، خاصة أصحاب الوظائف الهشة."],["Perhaps the truth lies somewhere in between: efficiency without frenzy.","ربما الحقيقة في الوسط: كفاءة بدون هوس."],["The challenge, as ever, is to apply that principle consistently.","التحدي، كالعادة، هو تطبيق هذا المبدأ باستمرار."]],
 g:{obsessed:"مهووس",proponents:"أنصار",erodes:"يضعف",precarious:"هشّ",frenzy:"هوس",consistently:"باستمرار"},
 q:[["What do proponents of the slow movement claim?",["Rushing erodes quality and well-being","Speed is always good","Work is useless"],0],["What do critics point out?",["Few can afford to disconnect","Everyone is slow","The research is wrong"],0],["What compromise is suggested?",["Efficiency without frenzy","Total silence","More meetings"],0]]},

{id:"a1",lv:"B2",t:"Why We Sleep",ar:"لماذا ننام",ic:"😴",
 s:[["Sleep is often treated as a luxury, yet scientists increasingly regard it as a biological necessity.","يُعامَل النوم كترف، بينما العلماء يعتبرونه ضرورة بيولوجية."],["During deep sleep, the brain consolidates memories and clears toxic waste accumulated during the day.","في النوم العميق، الدماغ يثبّت الذكريات وينظّف السموم المتراكمة في النهار."],["Adults need between seven and nine hours a night, though individual requirements vary.","البالغون يحتاجو بين 7 و9 ساعات في الليل، رغم اختلاف الاحتياجات."],["Chronic sleep deprivation has been linked to obesity, heart disease and depression.","الحرمان المزمن من النوم مرتبط بالسمنة وأمراض القلب والاكتئاب."],["Surprisingly, even a single sleepless night can impair concentration as much as alcohol.","والمدهش أن ليلة واحدة بلا نوم تُضعف التركيز مثل الكحول."],["Smartphones are a major culprit because their blue light suppresses the hormone that induces sleep.","الهواتف سبب رئيسي لأن ضوءها الأزرق يثبّط هرمون النوم."],["Experts therefore advise switching off screens an hour before bedtime.","لذلك ينصح الخبراء بإطفاء الشاشات قبل النوم بساعة."],["Keeping a regular schedule, even at weekends, also helps the body clock stay stable.","الحفاظ على جدول منتظم، حتى في العطلة، يساعد الساعة البيولوجية على الاستقرار."],["In short, prioritising sleep is one of the simplest investments we can make in our health.","باختصار، إعطاء النوم الأولوية من أبسط الاستثمارات في صحتنا."]],
 g:{consolidates:"يثبّت",chronic:"مزمن",deprivation:"حرمان",impair:"يُضعف",culprit:"المتسبب",prioritising:"إعطاء الأولوية"},
 q:[["How much sleep do adults generally need?",["Four to five hours","Seven to nine hours","Ten to twelve hours"],1],["What does deep sleep do for the brain?",["Raises blood pressure","Burns fat","Consolidates memories and clears waste"],2],["Why are smartphones a culprit?",["They are noisy","Blue light suppresses the sleep hormone","They are heavy"],1],["What do experts advise?",["Drink coffee at night","Sleep during the day","Switch off screens an hour before bed"],2]]},
{id:"a2",lv:"B2",t:"The Rise of Electric Cars",ar:"صعود السيارات الكهربائية",ic:"🚗",
 s:[["Not long ago, electric cars were regarded as a niche product for enthusiasts.","ما بعيد، السيارات الكهربائية كانت منتجا هامشيا لعشاقها."],["Today, falling battery prices and stricter emission rules are driving a rapid change.","اليوم، انخفاض أسعار البطاريات وتشديد قواعد الانبعاثات يدفعان لتغيير سريع."],["Several countries have announced that they will ban the sale of new petrol cars within two decades.","عدة دول أعلنت أنها ستمنع بيع سيارات البنزين الجديدة خلال عقدين."],["Proponents emphasise that electric vehicles produce no exhaust fumes and are cheaper to run.","المؤيدون يؤكدون أنها لا تنتج عوادم وأن تشغيلها أرخص."],["However, critics highlight the environmental cost of mining lithium and the shortage of charging stations.","بصح النقاد يبرزون التكلفة البيئية لتعدين الليثيوم ونقص محطات الشحن."],["Moreover, the electricity itself may come from polluting power plants, which undermines the benefits.","علاوة على ذلك، الكهرباء قد تأتي من محطات ملوِّثة، وهذا يقوّض الفوائد."],["Even so, studies show that over their lifetime, electric cars generally emit far less carbon.","ومع ذلك، الدراسات تبيّن أنها على مدى عمرها تُصدر كربونا أقل بكثير."],["The decisive factor will be how quickly grids switch to renewable sources.","العامل الحاسم هو سرعة تحوّل الشبكات إلى مصادر متجددة."],["If that happens, the transition could prove to be a turning point for the climate.","إذا حدث ذلك، قد يكون الانتقال نقطة تحوّل للمناخ."]],
 g:{niche:"هامشي",emission:"انبعاث",proponents:"المؤيدون",undermines:"يقوّض",decisive:"حاسم",grids:"الشبكات"},
 q:[["What is driving the change?",["Cheaper petrol","Falling battery prices and stricter rules","Fewer roads"],1],["What is one criticism of electric cars?",["They look odd","They are too fast","Lithium mining harms the environment"],2],["What do studies say about lifetime emissions?",["Electric cars emit far less carbon","They emit more","There is no difference"],0],["What is the decisive factor?",["Tyre prices","Car colours","How quickly grids switch to renewables"],2]]},
{id:"a3",lv:"B2",t:"Cities of the Future",ar:"مدن المستقبل",ic:"🏙️",
 s:[["By 2050, nearly seventy per cent of the world's population is expected to live in cities.","بحلول 2050، يُتوقع أن يعيش قرابة 70% من سكان العالم في المدن."],["This unprecedented urbanisation puts enormous pressure on housing, transport and public services.","هذا التحضّر غير المسبوق يضغط على السكن والنقل والخدمات العامة."],["Planners are therefore experimenting with 'smart city' technologies that monitor traffic and energy use in real time.","لذلك المخططون يجرّبون تقنيات المدينة الذكية التي ترصد المرور والطاقة آنيا."],["Some cities have introduced congestion charges to discourage cars from entering the centre.","بعض المدن فرضت رسوم ازدحام لمنع السيارات من دخول المركز."],["Others are creating green rooftops and parks to reduce heat and improve air quality.","وأخرى تنشئ أسطحا خضراء وحدائق لخفض الحرارة وتحسين جودة الهواء."],["Nevertheless, critics warn that data-driven cities may compromise residents' privacy.","ومع ذلك، يحذّر النقاد من أن المدن المعتمدة على البيانات قد تمسّ بخصوصية السكان."],["There is also the risk that affordable housing will remain out of reach for ordinary families.","وهناك خطر أن يبقى السكن بأسعار معقولة بعيد المنال عن العائلات العادية."],["Ultimately, a successful city is not defined by its technology alone, but by how inclusive it is.","في النهاية، المدينة الناجحة لا تُعرَّف بتقنيتها فقط بل بمدى شمولها."],["Citizens must therefore have a voice in shaping the places where they live.","لذلك يجب أن يكون للمواطنين صوت في تشكيل أماكن عيشهم."]],
 g:{unprecedented:"غير مسبوق",urbanisation:"التحضّر",congestion:"ازدحام",compromise:"يمسّ / يضرّ",affordable:"بأسعار معقولة",inclusive:"شامل"},
 q:[["What share of people will live in cities by 2050?",["About thirty per cent","About fifty per cent","About seventy per cent"],2],["What do congestion charges do?",["Build parks","Lower rents","Discourage cars from entering the centre"],2],["What privacy concern is raised?",["Cameras are broken","Data-driven cities may compromise privacy","Cities are too quiet"],1],["What defines a successful city?",["Technology alone","How inclusive it is","Its size"],1]]},
{id:"a4",lv:"C1",t:"The Ethics of Gene Editing",ar:"أخلاقيات التعديل الجيني",ic:"🧬",
 s:[["The advent of CRISPR has placed the power to rewrite DNA within the reach of ordinary laboratories.","ظهور كريسبر وضع قدرة إعادة كتابة الحمض النووي في متناول المخابر العادية."],["Proponents envisage a future in which hereditary diseases such as cystic fibrosis are eradicated before birth.","المؤيدون يتصورون مستقبلا تُستأصل فيه الأمراض الوراثية قبل الولادة."],["Yet the same technology could, in principle, be used to select traits like height or intelligence.","غير أن نفس التقنية يمكن مبدئيا استعمالها لاختيار صفات كالطول والذكاء."],["Ethicists caution that this could entrench inequality, since only the wealthy might afford such enhancements.","علماء الأخلاق يحذّرون من أن هذا قد يرسّخ اللامساواة، لأن الأثرياء فقط قد يتحمّلون التحسينات."],["Moreover, alterations to the germline are inheritable, which means that mistakes would be passed on to future generations.","علاوة على ذلك، تعديلات الخلايا الجنسية وراثية، أي أن الأخطاء تنتقل للأجيال القادمة."],["In 2018, the announcement that gene-edited babies had been born prompted worldwide condemnation.","في 2018، إعلان ولادة أطفال معدّلين وراثيا أثار إدانة عالمية."],["Consequently, many scientists now call for a moratorium on heritable editing until robust safeguards exist.","وبالتالي، يدعو علماء كثر إلى وقف مؤقت للتعديل الوراثي حتى توجد ضمانات قوية."],["Whether regulation can keep pace with innovation remains a matter of intense debate.","هل يمكن للتنظيم مواكبة الابتكار يبقى موضع جدل شديد."],["What is certain is that society, not scientists alone, must decide how far to go.","الأكيد أن المجتمع، وليس العلماء وحدهم، هو من يقرّر إلى أي مدى نذهب."]],
 g:{advent:"ظهور",hereditary:"وراثي",eradicated:"مُستأصَل",entrench:"يرسّخ",moratorium:"وقف مؤقت",safeguards:"ضمانات"},
 q:[["What do proponents hope for?",["To make people taller only","To eradicate hereditary diseases","To end all research"],1],["Why do ethicists worry?",["It is too cheap","It is too slow","It could entrench inequality"],2],["Why are germline edits especially risky?",["They are painless","Mistakes pass to future generations","They are temporary"],1],["What do many scientists now call for?",["Unlimited use","Immediate commercialisation","A moratorium on heritable editing"],2]]},
{id:"a5",lv:"C1",t:"Globalisation: Winners and Losers",ar:"العولمة: رابحون وخاسرون",ic:"🌐",
 s:[["Globalisation has lifted hundreds of millions out of poverty, particularly in East Asia.","العولمة انتشلت مئات الملايين من الفقر، خاصة في شرق آسيا."],["Consumers in wealthy countries have benefited from cheaper goods and a wider variety of products.","المستهلكون في الدول الغنية استفادوا من سلع أرخص وتنوّع أوسع."],["However, the gains have been distributed unevenly, both between and within countries.","غير أن المكاسب وُزّعت بشكل غير متساوٍ بين الدول وداخلها."],["In many industrial regions, factory closures have left communities with chronic unemployment and a sense of abandonment.","في مناطق صناعية كثيرة، غلق المصانع ترك مجتمعات بالبطالة المزمنة وشعور بالإهمال."],["This resentment has fuelled the rise of populist movements promising to restore protection.","هذا الاستياء غذّى صعود حركات شعبوية تعد بإعادة الحماية."],["Economists counter that tariffs often raise prices and invite retaliation, harming the very workers they aim to protect.","الاقتصاديون يردّون بأن الرسوم الجمركية ترفع الأسعار وتستجلب الرد بالمثل، فتضر بالعمال أنفسهم."],["A more constructive approach, they argue, would combine open trade with generous retraining and social support.","نهج أكثر بناءً، يقولون، يجمع التجارة المفتوحة مع إعادة تأهيل وإسناد اجتماعي سخي."],["The pandemic exposed the fragility of long supply chains, prompting firms to diversify their sources.","الجائحة كشفت هشاشة سلاسل الإمداد الطويلة، فدفعت الشركات لتنويع مصادرها."],["Globalisation is thus not ending, but evolving into something more resilient and, perhaps, more equitable.","العولمة إذن لا تنتهي بل تتطور إلى شيء أكثر صمودا وربما أكثر إنصافا."]],
 g:{unevenly:"بشكل غير متساوٍ",abandonment:"إهمال",resentment:"استياء",tariffs:"رسوم جمركية",fragility:"هشاشة",resilient:"صامد"},
 q:[["Who benefited from globalisation?",["Only the rich","Nobody","Hundreds of millions left poverty and consumers got cheaper goods"],2],["What happened in many industrial regions?",["New factories opened","Factory closures caused unemployment","Wages tripled"],1],["What do economists say about tariffs?",["They always help workers","They are free","They often raise prices and invite retaliation"],2],["What did the pandemic reveal?",["Cheap shipping","Unlimited stocks","The fragility of long supply chains"],2]]},
{id:"a6",lv:"C1",t:"The Science of Habit",ar:"علم العادة",ic:"🔁",
 s:[["Roughly forty per cent of our daily actions are performed not by conscious decision but by habit.","حوالي 40% من أفعالنا اليومية تتم بالعادة لا بقرار واعٍ."],["Researchers describe a three-step loop: a cue triggers a routine, which delivers a reward.","الباحثون يصفون حلقة من ثلاث خطوات: إشارة تحفّز روتينا يمنح مكافأة."],["Over time, the brain automates the sequence, freeing mental energy for other tasks.","مع الوقت، الدماغ يؤتمت التسلسل، محرّرا طاقة ذهنية لمهام أخرى."],["This efficiency, however, is a double-edged sword, since harmful habits become just as entrenched.","هذه الكفاءة سيف ذو حدّين، لأن العادات الضارة تترسّخ بالقدر نفسه."],["Contrary to popular belief, there is no magic number of days after which a habit forms.","خلافا للاعتقاد الشائع، لا يوجد رقم سحري من الأيام لتكوين العادة."],["One study found that the process ranged from eighteen to two hundred and fifty-four days.","دراسة وجدت أن المدة تراوحت بين 18 و254 يوما."],["Rather than relying on willpower, experts recommend redesigning one's environment to make good behaviour effortless.","بدل الاعتماد على قوة الإرادة، ينصح الخبراء بإعادة تصميم البيئة لجعل السلوك الجيد بلا جهد."],["Linking a new habit to an existing one, such as stretching after brushing teeth, markedly improves success.","ربط عادة جديدة بعادة قائمة، كالتمطّط بعد تنظيف الأسنان، يحسّن النجاح بشكل ملحوظ."],["Small, consistent steps, in other words, outperform heroic but short-lived efforts.","الخطوات الصغيرة المنتظمة، بعبارة أخرى، تتفوّق على الجهود البطولية قصيرة العمر."]],
 g:{cue:"إشارة",automates:"يؤتمت",entrenched:"راسخ",willpower:"قوة الإرادة",effortless:"بلا جهد",outperform:"يتفوّق على"},
 q:[["What are the parts of the habit loop?",["Wish, plan, fail","Cue, routine, reward","Rest, work, sleep"],1],["How long does a habit take to form?",["Exactly twenty-one days","One week","It varies widely"],2],["Why is automation a 'double-edged sword'?",["It uses more energy","Harmful habits also become entrenched","It is illegal"],1],["What do experts recommend?",["Rely on willpower","Avoid routines","Redesign your environment"],2]]},

{id:"s22",lv:"B2",t:"The Rise of Online Shopping",ar:"صعود التسوق الإلكتروني",ic:"🛒",
 s:[["Over the past decade, online shopping has transformed the way we buy almost everything.","خلال العقد الماضي، التسوق الإلكتروني غيّر طريقة شرائنا لكل شيء تقريبا."],["Consumers can now compare prices in seconds and have products delivered to their doorstep.","المستهلكون يقدرو الآن يقارنو الأسعار في ثواني ويوصلولهم المنتجات لباب الدار."],["This convenience, however, has come at a cost for small local shops.","هذه الراحة، مع ذلك، كان لها ثمن على المحلات الصغيرة."],["Many of them struggle to compete with giant platforms that offer lower prices.","كثير منها يكافح للمنافسة مع منصات عملاقة بأسعار أقل."],["Furthermore, the packaging and delivery involved generate a considerable amount of waste.","علاوة على ذلك، التغليف والتوصيل ينتجان كمية كبيرة من النفايات."],["Some governments are therefore encouraging customers to choose slower, greener delivery options.","لذلك بعض الحكومات تشجّع الزبائن على خيارات توصيل أبطأ وأخضر."],["In the end, wise consumers weigh up both convenience and consequences before clicking 'buy'.","في النهاية، المستهلك الحكيم يوازن بين الراحة والعواقب قبل الضغط على شراء."]],
 g:{transformed:"غيّر",doorstep:"عتبة الباب",convenience:"الراحة",compete:"ينافس",packaging:"التغليف",consequences:"العواقب"},

{id:"s23",lv:"B2",t:"A Lesson in Failure",ar:"درس في الفشل",ic:"💡",
 s:[["When Amira failed her driving test for the third time, she nearly gave up.","كي أميرة رسبت في امتحان السياقة للمرة الثالثة، كادت تستسلم."],["Her instructor, however, told her something she has never forgotten.","المدرب، مع ذلك، قال لها شيئا ما نستوش."],["'Failure is only feedback,' he said, 'and feedback is how experts are made.'","قال: الفشل مجرد ملاحظات، والملاحظات هي كيف يُصنع الخبراء."],["Encouraged, she analysed her mistakes and practised the difficult manoeuvres daily.","متشجعة، حللت أخطاءها وتدربت على المناورات الصعبة يوميا."],["Two months later, she passed with only one minor error.","بعد شهرين، نجحت بخطأ بسيط واحد فقط."],["She now believes that persistence matters more than natural talent.","هي تؤمن الآن أن المثابرة أهم من الموهبة الفطرية."],["Whenever she meets discouraged learners, she shares her story.","كل ما تلقى متعلمين محبطين، تشارك قصتها."]],
 g:{instructor:"المدرّب",feedback:"ملاحظات",analysed:"حلّلت",manoeuvres:"مناورات",persistence:"المثابرة",discouraged:"محبَط"},
 q:[["How many times did Amira fail the test?",["Once","Twice","Three times"],2],["What did the instructor say?",["Failure is only feedback","Give up","Try another test"],0],["What does she believe now?",["Persistence matters more than talent","Talent is everything","Luck decides"],0]]},
{id:"s24",lv:"C1",t:"The Attention Economy",ar:"اقتصاد الانتباه",ic:"📲",
 s:[["In the digital age, human attention has become the scarcest and most valuable commodity.","في العصر الرقمي، صار الانتباه البشري أندر سلعة وأثمنها."],["Platforms compete fiercely to capture it, deploying algorithms refined to exploit our psychological vulnerabilities.","المنصات تتنافس بشراسة لالتقاطه، بخوارزميات مصقولة لاستغلال نقاط ضعفنا النفسية."],["Notifications, infinite scrolling and autoplay are engineered to keep us engaged far beyond our intentions.","الإشعارات والتمرير اللانهائي والتشغيل التلقائي مصممة لتبقينا منشغلين أكثر من نيتنا."],["The consequence, critics argue, is a fragmented mind, ill-suited to deep reading or sustained reflection.","النتيجة، يقول النقاد، عقل مشتت لا يصلح للقراءة العميقة أو التأمل المستمر."],["Defenders counter that technology merely amplifies pre-existing human tendencies rather than creating them.","المدافعون يردون أن التقنية تضخّم الميول القائمة ولا تخلقها."],["Whatever the truth, a growing movement advocates 'digital minimalism', urging people to reclaim their attention deliberately.","أيا كانت الحقيقة، حركة متنامية تدعو إلى «الحد الأدنى الرقمي»، وتحث الناس على استعادة انتباههم عمدا."],["Ultimately, the question is not whether we use technology, but who is in control.","في النهاية، السؤال ليس هل نستعمل التقنية، بل من يتحكم."]],
 g:{scarcest:"الأندر",algorithms:"خوارزميات",vulnerabilities:"نقاط الضعف",fragmented:"مشتت",amplifies:"تضخّم",minimalism:"الحد الأدنى"},
 q:[["Why is attention valuable?",["It is the scarcest commodity","It is free","It is useless"],0],["What do defenders claim?",["Technology amplifies existing tendencies","Technology is evil","Nothing matters"],0],["What is the key question?",["Who is in control","How fast is Wi-Fi","Which app is best"],0]]},
{id:"s25",lv:"C1",t:"Mother Tongue and Identity",ar:"اللغة الأم والهوية",ic:"🌍",
 s:[["For millions of people, language is far more than a tool for communication; it is the vessel of identity.","لملايين الناس، اللغة أكثر بكثير من أداة تواصل؛ هي وعاء الهوية."],["Immigrants often describe an unsettling tension between assimilating into a new society and preserving their ancestral tongue.","المهاجرون يصفون غالبا توترا مقلقا بين الاندماج في مجتمع جديد والحفاظ على لغة الأجداد."],["Research indicates that children who grow up bilingual enjoy cognitive advantages, such as enhanced flexibility in problem-solving.","الأبحاث تشير أن الأطفال ثنائيي اللغة لهم مزايا معرفية مثل مرونة أكبر في حل المشكلات."],["Nevertheless, they may encounter prejudice if their accent or vocabulary deviates from the dominant norm.","ومع ذلك قد يواجهون تحيزا إذا انحرفت لهجتهم أو مفرداتهم عن المعيار السائد."],["Dialects, long dismissed as corrupted forms of standard languages, are now recognised by linguists as rich and legitimate systems.","اللهجات التي طالما اعتُبرت صيغا فاسدة من الفصحى صارت اليوم يعترف بها اللغويون كأنظمة غنية ومشروعة."],["Consequently, many educators advocate celebrating linguistic diversity rather than suppressing it.","وبالتالي يدعو كثير من المربين للاحتفاء بالتنوع اللغوي بدل قمعه."],["To lose a language, then, is to lose a unique way of seeing the world.","إذن، فقدان لغة هو فقدان طريقة فريدة لرؤية العالم."]],
 g:{vessel:"وعاء",assimilating:"الاندماج",bilingual:"ثنائي اللغة",prejudice:"التحيز",dialects:"اللهجات",suppressing:"قمع"},
 q:[["How is language described?",["The vessel of identity","Only a tool","A fashion"],0],["What advantage do bilingual children enjoy?",["Cognitive flexibility","Greater height","Nothing"],0],["How do linguists now regard dialects?",["As rich and legitimate systems","As errors","As slang only"],0]]},

{id:"d16",lv:"B2",t:"Job Offer Negotiation",ar:"التفاوض على عرض عمل",ic:"💰",d:["Candidate","HR Manager"],
 s:[["Thank you for the offer. I'm very enthusiastic, but the salary is below my expectations.","شكرا على العرض. متحمس جدا لكن الراتب أقل من توقعاتي.",0],["What figure did you have in mind?","واش الرقم اللي كنت تفكر فيه؟",1],["Given my experience, I was hoping for around fifteen per cent more.","بالنظر لخبرتي، كنت أتمنى 15% أكثر تقريبا.",0],["That's a significant increase. We could offer eight per cent plus extra holidays.","هذه زيادة معتبرة. نقدر نعرض 8% مع عطل إضافية.",1],["I'd accept that if there's a performance review after six months.","نقبل إذا كان هناك تقييم أداء بعد 6 شهور.",0],["That seems reasonable. I'll put it in writing.","يبدو معقولا. نكتبها رسميا.",1]],

{id:"d17",lv:"C1",t:"Panel Discussion: Remote Education",ar:"نقاش: التعليم عن بعد",ic:"🎤",d:["Moderator","Professor"],
 s:[["Has remote education fundamentally altered the university experience?","هل غيّر التعليم عن بعد تجربة الجامعة جذريا؟",0],["It has certainly democratised access, although it has also exposed a stark digital divide.","بالتأكيد ديمقراطَ الوصول، رغم أنه كشف أيضا فجوة رقمية صارخة.",1],["Some argue that the loss of spontaneous interaction undermines intellectual development.","بعضهم يرى أن فقدان التفاعل العفوي يقوّض النمو الفكري.",0],["That is a legitimate concern; nevertheless, hybrid models appear to preserve the best of both worlds.","هذا قلق مشروع؛ ومع ذلك النماذج الهجينة تحافظ على أفضل ما في العالمين.",1],["Would you say institutions are adequately prepared for such a shift?","هل تقول إن المؤسسات مستعدة بما يكفي لهذا التحول؟",0],["Frankly, no. Without sustained investment in infrastructure and training, the promise will remain unfulfilled.","بصراحة، لا. بدون استثمار مستمر في البنية والتدريب سيبقى الوعد غير متحقق.",1]],

const FRDD={7:["واش بيها طوموبيلتك؟","نظن خلصلنا البنزين، وما نفهمش الباقي.","ما تقلقش. ارتاح وأنا نشوف المحرك.","شكرا! نتذكر مساعدتك."],8:["راك حزين اليوم، صح؟","إيه، صاحبي ما جاش للموعد.","ما كاين باس، يلا نروحو ناكلو حاجة!","ماشي، بصح ماشي المطعم الغالي بزاف!"]};
function buildFR(){return LEN.map((l,i)=>{const f=FRD[i];return{...l,id:100+l.id,en:f.t,names:f.n||l.names,

  d:l.d.map((x,k)=>[x[0],f.d[k],FRDD[i]?FRDD[i][k]:x[2]]),tip:f.tip}})}

{id:"fs3",lv:"A2",t:"Le week-end en famille",ar:"نهاية الأسبوع مع العائلة",ic:"👨‍👩‍👧",s:[["Le week-end, ma famille se réveille tard.","في نهاية الأسبوع عائلتي تفيق متأخرة."],["Mon père prépare le petit-déjeuner pour tout le monde.","بابا يحضر الفطور للكل."],["Après le repas, nous allons au parc.","بعد الفطور نروحو للحديقة."],["Mes frères jouent au ballon et moi, je lis un livre.","خوتي يلعبو بالكورة وأنا نقرا كتاب."],["Le soir, nous regardons un film ensemble.","في العشية نشوفو فيلم مع بعض."],["C'est mon moment préféré de la semaine.","هذا وقتي المفضل في الأسبوع."]],g:{réveille:"تفيق",prépare:"يحضر",parc:"الحديقة",ballon:"الكورة",film:"فيلم",préféré:"المفضل"},q:[["Qui prépare le petit-déjeuner ?",["Le père","La mère","Le frère"],0],["Où va la famille après le repas ?",["Au marché","Au parc","Au cinéma"],1],["Que fait la narratrice au parc ?",["Elle joue au ballon","Elle lit un livre","Elle dort"],1]]},
{id:"fs4",lv:"B1",t:"Un voyage en train",ar:"رحلة بالقطار",ic:"🚆",s:[["Hier, j'ai pris le train pour aller à Oran.","البارح ركبت التران باش نروح لوهران."],["Le voyage a duré quatre heures.","الرحلة دامت أربع ساعات."],["À côté de moi, il y avait une dame très sympathique.","جنبي كانت مرا طيبة بزاف."],["Nous avons parlé de nos familles et de nos métiers.","تحدثنا على عائلاتنا وخدمتنا."],["Quand je suis arrivé, mon cousin m'attendait à la gare.","كي وصلت، ولد عمي كان يستناني في المحطة."],["J'ai trouvé ce voyage vraiment agréable.","لقيت هذه الرحلة ممتعة بزاف."]],g:{train:"التران",duré:"دامت",dame:"مرا",métiers:"الوظائف",attendait:"كان يستنى",agréable:"ممتعة"},q:[["Combien de temps a duré le voyage ?",["Deux heures","Quatre heures","Six heures"],1],["Qui attendait le narrateur à la gare ?",["Son cousin","Son ami","Sa mère"],0],["Comment était le voyage ?",["Ennuyeux","Fatigant","Agréable"],2]]},

["Lecture: The Origins of Language","محاضرة: أصول اللغة","🎓",[["Linguists have long debated when and how human language first emerged.","يناقش اللغويون منذ زمن طويل متى وكيف ظهرت اللغة البشرية."],["Some propose a gradual evolution from gestures, while others favour a sudden genetic mutation.","يقترح بعضهم تطورا تدريجيا من الإيماءات بينما يرجح آخرون طفرة جينية مفاجئة."],["What is certain is that language must have conferred a considerable advantage on cooperation.","المؤكد أن اللغة منحت التعاون ميزة كبيرة."],["In the next hour, we will examine the evidence from both archaeology and genetics.","في الساعة القادمة سنفحص الأدلة من علم الآثار والوراثة."]],[["What do some propose about language origins?",["Gradual evolution from gestures","It came from music","It was invented"],0],["What will the lecture examine?",["Archaeology and genetics","Poetry","Grammar"],0]]],

["Technology Podcast: Quantum Computing","بودكاست: الحوسبة الكمومية","🖥️",[["Unlike conventional computers, which use bits that are either zero or one, quantum computers use qubits that can exist in multiple states at once.","على عكس الحواسيب التقليدية التي تستعمل بتات صفرا أو واحدا تستعمل الكمومية كيوبتات توجد في حالات متعددة في آن."],["This could, in theory, solve certain problems in minutes that would take ordinary machines thousands of years.","وهذا قد يحل نظريا مسائل في دقائق تستغرق آلاف السنين على الآلات العادية."],["However, qubits are extremely fragile, and building stable machines remains a formidable challenge.","غير أن الكيوبتات هشة جدا وبناء آلات مستقرة ما يزال تحديا هائلا."]],[["What can qubits do?",["Exist in multiple states","Only zero","Only one"],0],["What is the challenge?",["Fragility","Price","Size only"],0]]],

["A Teacher Who Changed My Life","معلم غيّر حياتي","👨‍🏫",[["When I was fifteen, I was convinced that I was hopeless at mathematics.","عندما كنت في الخامسة عشرة كنت مقتنعا أنني ميؤوس مني في الرياضيات."],["My new teacher, Mr Rahmani, refused to let me give up.","أستاذي الجديد السيد رحماني رفض أن أستسلم."],["He stayed after class to explain problems patiently until I understood them.","كان يبقى بعد الحصة ليشرح المسائل بصبر حتى أفهمها."],["Today I am an engineer, and I owe my confidence to him.","اليوم أنا مهندس وأدين بثقتي له."]],[["How did he feel about maths at fifteen?",["Hopeless","Excited","Bored"],0],["What does he do today?",["Engineer","Teacher","Doctor"],0]]],
["Urban Gardens","الحدائق الحضرية","🌱",[["In crowded cities, residents are turning rooftops and balconies into small gardens.","في المدن المزدحمة يحول السكان الأسطح والشرفات إلى حدائق صغيرة."],["These gardens provide fresh vegetables and help cool the surrounding buildings.","توفر هذه الحدائق خضرا طازجة وتساعد على تبريد المباني المحيطة."],["They also bring neighbours together, which strengthens community ties.","كما تجمع الجيران مما يقوي الروابط المجتمعية."],["Some city councils now offer free seeds and training.","تقدم بعض المجالس البلدية الآن بذورا وتدريبا مجانا."]],[["What do gardens help cool?",["Buildings","Roads","Rivers"],0],["What do some councils offer?",["Free seeds","Free land","Free water"],0]]],
["A Night in the Sahara","ليلة في الصحراء","🏜️",[["We reached the dunes just before sunset and watched the sand turn golden, then red.","وصلنا الكثبان قبيل الغروب وشاهدنا الرمال تتحول إلى ذهبية ثم حمراء."],["After dinner, our guide put out the fire so we could see the stars.","بعد العشاء أطفأ المرشد النار لنرى النجوم."],["I had never seen so many; it felt as though the sky was within reach.","لم أر هذا العدد من قبل وبدا لي أن السماء في متناول اليد."],["It was so quiet that we could hear our own breathing.","كان الهدوء شديدا لدرجة أننا سمعنا أنفاسنا."]],[["Why did the guide put out the fire?",["To see the stars","It was late","It was cold"],0],["How was the desert?",["Very quiet","Noisy","Rainy"],0]]],
["The Debate on School Uniforms","نقاش الزي المدرسي","🎽",[["Supporters argue that uniforms create equality and reduce pressure to wear expensive brands.","يرى المؤيدون أن الزي يحقق المساواة ويخفف الضغط لارتداء ماركات غالية."],["Opponents, on the other hand, claim that uniforms limit self-expression.","أما المعارضون فيزعمون أن الزي يحد من التعبير عن الذات."],["Research suggests that the effect on academic results is small.","تشير الأبحاث إلى أن الأثر على النتائج الدراسية ضئيل."],["The decision, therefore, depends on what a school values most.","لذلك يعتمد القرار على ما تقدره المدرسة أكثر."]],[["What do supporters say uniforms create?",["Equality","Competition","Costs"],0],["How big is the effect on results?",["Small","Huge","Negative"],0]]],
["Losing a Language","فقدان لغة","🗣️",[["Linguists estimate that one language disappears every two weeks.","يقدر اللغويون أن لغة تختفي كل أسبوعين."],["When the last speakers die, centuries of stories, songs and knowledge vanish with them.","عندما يموت آخر المتحدثين تختفي معهم قرون من القصص والأغاني والمعرفة."],["Some communities are fighting back by teaching children in their mother tongue.","تقاوم بعض المجتمعات بتعليم الأطفال بلغتهم الأم."],["Technology, such as apps and online dictionaries, also helps to preserve them.","كما تساعد التقنية كالتطبيقات والقواميس على حفظها."]],[["How often does a language disappear?",["Every two weeks","Every year","Every day"],0],["What helps preserve languages?",["Apps and dictionaries","Silence","Travel"],0]]],
["My First Day as a Volunteer","يومي الأول كمتطوع","🙋",[["I arrived at the shelter feeling nervous, unsure of what to expect.","وصلت إلى الملجأ متوترا لا أدري ما أتوقع."],["The manager asked me to feed the dogs and clean their cages.","طلب مني المدير إطعام الكلاب وتنظيف أقفاصها."],["By lunchtime, I was exhausted but surprisingly happy.","وبحلول الغداء كنت منهكا لكن سعيدا على نحو مفاجئ."],["I signed up to return every week.","سجلت للعودة كل أسبوع."]],[["What did he do?",["Fed dogs and cleaned cages","Taught children","Cooked"],0],["How did he feel at lunchtime?",["Exhausted but happy","Angry","Bored"],0]]],
["The Printing Revolution","ثورة الطباعة","🖨️",[["Before the printing press, books were copied by hand and only the wealthy could afford them.","قبل المطبعة كانت الكتب تنسخ باليد ولا يقتنيها إلا الأثرياء."],["Once printing spread in the fifteenth century, knowledge became cheaper and ideas travelled faster.","حين انتشرت الطباعة في القرن الخامس عشر أصبحت المعرفة أرخص وانتقلت الأفكار أسرع."],["Historians argue that it paved the way for the Renaissance and modern science.","يرى المؤرخون أنها مهدت للنهضة والعلم الحديث."]],[["Who could afford books before printing?",["Only the wealthy","Everyone","Children"],0],["What did printing pave the way for?",["The Renaissance","Wars","Trade"],0]]],
["A Misunderstanding","سوء فهم","🙈",[["Last week, I sent a message to my boss that was meant for my sister.","الأسبوع الماضي أرسلت رسالة إلى مديري كانت مخصصة لأختي."],["It said, \"I can't wait for this boring meeting to finish.\"","كتبت: «لا أطيق انتظار انتهاء هذا الاجتماع الممل.»"],["Fortunately, he had a sense of humour and simply replied, \"Me neither.\"","لحسن الحظ كان لديه حس فكاهة فرد ببساطة: «ولا أنا.»"],["Since then, I always check the recipient twice.","منذ ذلك الحين أتحقق من المستلم مرتين."]],[["Who was the message meant for?",["His sister","His friend","His boss"],0],["How did the boss react?",["With humour","With anger","He ignored it"],0]]],
["The Benefits of Bilingualism","فوائد ثنائية اللغة","🧠",[["Studies show that bilingual people switch between tasks more easily.","تُظهر الدراسات أن ثنائيي اللغة ينتقلون بين المهام بسهولة أكبر."],["Some research even suggests that speaking two languages may delay memory loss in old age.","وتشير بعض الأبحاث إلى أن التحدث بلغتين قد يؤخر فقدان الذاكرة في الشيخوخة."],["Beyond cognitive benefits, bilinguals can connect with more people and cultures.","وبعيدا عن الفوائد الذهنية يتواصل ثنائيو اللغة مع ناس وثقافات أكثر."]],[["What do bilinguals do more easily?",["Switch tasks","Sleep","Cook"],0],["What may speaking two languages delay?",["Memory loss","Hunger","Growth"],0]]],
["Fixing the Roads","إصلاح الطرق","🚧",[["Residents have complained for years about the potholes on the main road.","اشتكى السكان لسنوات من الحفر في الطريق الرئيسي."],["The council has finally approved a budget for repairs, which will begin next month.","وافق المجلس أخيرا على ميزانية الإصلاحات التي تبدأ الشهر القادم."],["Drivers should expect delays, but the work is scheduled to finish within six weeks.","على السائقين توقع التأخير لكن العمل مقرر أن ينتهي خلال ستة أسابيع."]],[["What have residents complained about?",["Potholes","Noise","Prices"],0],["How long will the work take?",["Six weeks","Six days","Six months"],0]]],
["The Last Bookshop","آخر مكتبة","📕",[["In our neighbourhood, the last independent bookshop is struggling to survive.","في حينا تكافح آخر مكتبة مستقلة من أجل البقاء."],["Customers now prefer to order online, where prices are lower.","يفضل الزبائن الآن الطلب عبر الإنترنت حيث الأسعار أقل."],["The owner, however, refuses to give up and has started hosting readings and workshops.","غير أن المالك يرفض الاستسلام وبدأ باستضافة قراءات وورش."],["Slowly, people are returning, drawn by the atmosphere.","ببطء يعود الناس منجذبين إلى الأجواء."]],[["Why is the bookshop struggling?",["Online prices are lower","It is too small","No books"],0],["What has the owner started?",["Readings and workshops","Online sales only","Closing"],0]]],
["Space Exploration","استكشاف الفضاء","🚀",[["Space agencies are planning to send humans back to the Moon within a few years.","تخطط وكالات الفضاء لإرسال البشر إلى القمر مجددا خلال سنوات."],["The goal this time is to build a permanent base as a step towards Mars.","الهدف هذه المرة بناء قاعدة دائمة كخطوة نحو المريخ."],["Critics argue that the money would be better spent solving problems on Earth.","يرى المنتقدون أن الأفضل إنفاق المال على حل مشكلات الأرض."],["Supporters reply that space research has produced many everyday technologies.","يرد المؤيدون بأن أبحاث الفضاء أنتجت تقنيات يومية كثيرة."]],[["What is the goal?",["A permanent Moon base","A visit only","A telescope"],0],["What do critics say?",["Money is better spent on Earth","It's too easy","It's boring"],0]]],
["A Family Recipe","وصفة عائلية","🥘",[["My grandmother never wrote down her recipes; she said you learn by watching.","لم تكتب جدتي وصفاتها قط وكانت تقول إنك تتعلم بالمشاهدة."],["Last summer, I spent a week in her kitchen taking notes and photos.","الصيف الماضي قضيت أسبوعا في مطبخها أدون وأصور."],["Now the whole family can enjoy her dishes even when she is gone.","الآن تستطيع العائلة كلها التمتع بأطباقها حتى بعد رحيلها."]],[["Did grandmother write recipes?",["No","Yes","Sometimes"],0],["What did he do in her kitchen?",["Took notes and photos","Cooked alone","Cleaned"],0]]],
["The Power of Habits","قوة العادات","🔁",[["Psychologists estimate that around forty per cent of our daily actions are habits rather than decisions.","يقدر علماء النفس أن نحو أربعين بالمئة من أفعالنا اليومية عادات لا قرارات."],["To build a new habit, it helps to attach it to an existing routine.","لبناء عادة جديدة يفيد ربطها بروتين قائم."],["Starting small is more effective than setting ambitious goals you cannot sustain.","البدء بخطوات صغيرة أنجع من أهداف طموحة لا تستمر."]],[["What percentage are habits?",["About 40%","About 4%","About 90%"],0],["What works better?",["Starting small","Big goals","Avoiding routine"],0]]],

["The Paradox of Choice","مفارقة الاختيار","🧩",[["Modern consumers are offered an unprecedented range of options, yet this abundance does not necessarily lead to greater satisfaction.","يُعرض على المستهلك الحديث تشكيلة غير مسبوقة من الخيارات لكن هذه الوفرة لا تعني بالضرورة رضا أكبر."],["Psychologists argue that too many alternatives can induce anxiety and regret, as people fear having made the wrong decision.","يرى علماء النفس أن كثرة البدائل قد تولد القلق والندم لخوف الناس من اتخاذ القرار الخاطئ."],["Paradoxically, those who settle for a \"good enough\" option often report feeling happier than those who strive for the perfect one.","والمفارقة أن من يكتفون بخيار «كاف» يشعرون غالبا بسعادة أكبر ممن يسعون إلى الأمثل."]],[["What can too many options cause?",["Anxiety and regret","Greater joy","Lower prices"],0],["Who often feels happier?",["Those who settle for good enough","Perfectionists","Shoppers"],0]]],
["Memory and Smell","الذاكرة والرائحة","👃",[["Few sensations evoke the past as vividly as a familiar scent.","قلّما تستحضر حاسة الماضي بوضوح كرائحة مألوفة."],["This is because the olfactory bulb is closely connected to the brain regions responsible for emotion and memory.","وذلك لأن البصلة الشمية مرتبطة ارتباطا وثيقا بمناطق الدماغ المسؤولة عن العاطفة والذاكرة."],["A whiff of bread baking may thus transport us instantly to a grandmother's kitchen decades ago.","فقد تنقلنا نفحة من خبز يُخبز فورا إلى مطبخ جدة قبل عقود."]],[["Why do smells evoke memories?",["Link with emotion and memory areas","Strong chemicals","They are loud"],0],["What may bread smell recall?",["A grandmother's kitchen","A school","A market"],0]]],
["Gentrification","التحسين الحضري","🏙️",[["When wealthier residents move into a historically modest district, property values soar and the character of the neighbourhood changes.","عندما ينتقل ميسورون إلى حي متواضع تاريخيا ترتفع قيم العقارات ويتغير طابع الحي."],["Long-standing inhabitants are frequently priced out, even though they contributed to the area's appeal.","غالبا ما يُرغم السكان القدامى على المغادرة بسبب الأسعار رغم أنهم ساهموا في جاذبية المنطقة."],["Urban planners are therefore exploring measures such as rent controls to preserve social diversity.","لذلك يدرس المخططون إجراءات مثل ضبط الإيجارات للحفاظ على التنوع الاجتماعي."]],[["What happens to property values?",["They soar","They fall","They stay"],0],["What measures are explored?",["Rent controls","Taxes on shops","Demolition"],0]]],
["The Ethics of Gene Editing","أخلاقيات تحرير الجينات","🧬",[["Advances in gene editing hold out the promise of eliminating inherited diseases.","تعد تطورات تحرير الجينات بالقضاء على الأمراض الوراثية."],["Nevertheless, critics warn that the same technology could be used to select traits such as height or intelligence.","غير أن المنتقدين يحذرون من أن التقنية نفسها قد تستعمل لانتقاء صفات كالطول والذكاء."],["The challenge for legislators is to draw a line between treating illness and engineering human beings.","التحدي أمام المشرعين رسم حد بين علاج المرض وهندسة البشر."]],[["What is the promise of gene editing?",["Eliminating inherited diseases","Longer days","Cheaper food"],0],["What is the legislators' challenge?",["Drawing a line","Funding","Teaching"],0]]],
["A Philosophy of Slow Living","فلسفة الحياة الهادئة","🐌",[["In an age obsessed with productivity, the slow-living movement advocates deliberate, unhurried choices.","في عصر مهووس بالإنتاجية تدعو حركة الحياة البطيئة إلى خيارات متأنية غير متعجلة."],["Its followers prioritise quality over quantity, whether in food, work or relationships.","يقدم أتباعها الجودة على الكم سواء في الطعام أو العمل أو العلاقات."],["Critics dismiss it as a luxury, yet many adherents insist that it is a matter of priorities rather than income.","يعتبره المنتقدون ترفا لكن كثيرا من أتباعه يصرون على أنه مسألة أولويات لا دخل."]],[["What does slow living prioritise?",["Quality over quantity","Speed","Savings"],0],["What do critics say?",["It is a luxury","It is dangerous","It is old"],0]]],
["Archaeology Under the Sea","علم الآثار تحت البحر","🏺",[["Beneath the Mediterranean lie thousands of shipwrecks that preserve a detailed record of ancient trade.","تحت المتوسط آلاف الحطام تحفظ سجلا مفصلا للتجارة القديمة."],["Because the cold, dark water slows decay, divers occasionally recover amphorae that still contain traces of oil or wine.","ولأن الماء البارد المظلم يبطئ التحلل يستخرج الغواصون أحيانا جرارا فيها آثار زيت أو نبيذ."],["However, looters pose a serious threat, and international cooperation is needed to protect these sites.","غير أن اللصوص يشكلون تهديدا خطيرا ويلزم تعاون دولي لحماية هذه المواقع."]],[["What do shipwrecks preserve?",["A record of trade","Treasure only","Fish"],0],["What threatens the sites?",["Looters","Storms","Tourists"],0]]],
["The Economics of Attention","اقتصاد الانتباه","📱",[["In the digital economy, human attention has become a scarce and valuable resource.","في الاقتصاد الرقمي أصبح الانتباه البشري مورد نادرا وقيما."],["Platforms are designed to keep users engaged for as long as possible, because advertising revenue depends on it.","صممت المنصات لإبقاء المستخدمين منشغلين أطول وقت لأن عائدات الإعلانات تعتمد على ذلك."],["Consequently, some ethicists call for design standards that respect users' time and well-being.","ولذلك يدعو بعض علماء الأخلاق إلى معايير تصميم تحترم وقت المستخدمين ورفاههم."]],[["What has become scarce?",["Human attention","Electricity","Data"],0],["What do ethicists call for?",["Design standards respecting users","More ads","Bans"],0]]],
["On Translation","في الترجمة","🔤",[["Translators often remark that no word has an exact equivalent in another language.","يلاحظ المترجمون أن لا كلمة تقابلها تماما كلمة في لغة أخرى."],["A phrase may carry cultural associations, humour or rhythm that vanish in transit.","قد تحمل العبارة دلالات ثقافية أو فكاهة أو إيقاعا تضيع في النقل."],["The art lies in recreating the effect on the reader, rather than merely substituting words.","يكمن الفن في إعادة خلق الأثر في القارئ لا في استبدال الكلمات فحسب."]],[["What may vanish in translation?",["Humour and rhythm","Grammar","Spelling"],0],["Where does the art lie?",["Recreating the effect","Word substitution","Speed"],0]]],
["The Return of Wolves","عودة الذئاب","🐺",[["When wolves were reintroduced to a national park, ecologists were astonished by the cascade of consequences.","عندما أعيدت الذئاب إلى متنزه وطني ذُهل علماء البيئة من سلسلة العواقب."],["The wolves reduced the deer population, which allowed vegetation to recover along the riverbanks.","قللت الذئاب عدد الغزلان فتعافت النباتات على ضفاف الأنهار."],["Even the course of the rivers changed, illustrating how interconnected ecosystems are.","حتى مجرى الأنهار تغير مبينا مدى ترابط الأنظمة البيئية."]],[["What did the wolves reduce?",["The deer population","Fish","Birds"],0],["What does this show?",["Ecosystems are interconnected","Wolves are weak","Rivers dry"],0]]],
["Imposter Syndrome","متلازمة المحتال","🎭",[["Many high achievers privately suspect that their success is the result of luck rather than ability.","يشك كثير من المتفوقين في سرهم أن نجاحهم نتيجة الحظ لا الكفاءة."],["Paradoxically, the more they accomplish, the stronger the feeling of being a fraud tends to become.","والمفارقة أنه كلما أنجزوا أكثر قوي الشعور بأنهم محتالون."],["Talking openly with colleagues about such doubts often reveals how common they are.","كثيرا ما يكشف الحديث الصريح مع الزملاء عن مدى شيوع هذه الشكوك."]],[["What do high achievers suspect?",["Their success is luck","They are lazy","They will fail"],0],["What helps?",["Talking openly","Silence","Working more"],0]]],
["The Age of Misinformation","عصر المعلومات المضللة","📰",[["False stories spread faster than accurate ones, partly because they appeal to strong emotions.","تنتشر القصص الكاذبة أسرع من الصحيحة جزئيا لأنها تخاطب عواطف قوية."],["Media literacy, the ability to evaluate sources critically, is therefore regarded as a vital civic skill.","لذلك تعتبر الثقافة الإعلامية القدرة على تقييم المصادر نقديا مهارة مدنية حيوية."],["A simple habit, pausing before sharing, can curb the spread considerably.","عادة بسيطة هي التوقف قبل المشاركة قد تحد من الانتشار كثيرا."]],[["Why do false stories spread?",["Strong emotions","Better writing","Cheap"],0],["What simple habit helps?",["Pausing before sharing","Sharing quickly","Deleting"],0]]],
["The Quiet Power of Introverts","القوة الهادئة للانطوائيين","🤫",[["Society often rewards extroversion, yet introverts bring valuable qualities such as deep focus and careful listening.","غالبا ما يكافئ المجتمع الانبساط لكن الانطوائيين يجلبون صفات قيمة كالتركيز العميق والإصغاء."],["Many remarkable innovations emerged from solitary reflection rather than from noisy brainstorming.","ظهرت ابتكارات مذهلة كثيرة من التأمل المنفرد لا من العصف الصاخب."],["Organisations that make room for both temperaments tend to be more creative.","المؤسسات التي تتسع للمزاجين تميل لأن تكون أكثر إبداعا."]],[["What do introverts bring?",["Deep focus and listening","Loudness","Speed"],0],["Which organisations are more creative?",["Those making room for both","Only extroverts","Only introverts"],0]]],
["Desertification","التصحر","🌵",[["Each year, vast areas of fertile land turn into desert due to overgrazing, deforestation and climate change.","كل عام تتحول مساحات شاسعة من الأرض الخصبة إلى صحراء بسبب الرعي الجائر وإزالة الغابات وتغير المناخ."],["The consequences extend beyond agriculture, as displaced communities often migrate in search of livelihoods.","تتجاوز العواقب الزراعة إذ تهاجر المجتمعات المهجرة بحثا عن الرزق."],["Projects such as the Green Dam in Algeria aimed to halt the advance of the desert through reforestation.","هدفت مشاريع مثل السد الأخضر في الجزائر إلى وقف زحف الصحراء بالتشجير."]],[["What causes desertification?",["Overgrazing, deforestation, climate","Rain","Tourism"],0],["What was the Green Dam for?",["Halting the desert","Making dams","Fishing"],0]]],
["The Value of Boredom","قيمة الملل","😐",[["In an era of constant stimulation, boredom has become something to be avoided at all costs.","في عصر التحفيز الدائم صار الملل شيئا يتجنب بأي ثمن."],["Yet psychologists suggest that idle moments allow the mind to wander, which can foster creativity.","لكن علماء النفس يرون أن لحظات الفراغ تسمح للعقل بالتجول مما قد ينمي الإبداع."],["Perhaps we should resist the urge to reach for our phones every time we have nothing to do.","ربما علينا مقاومة الرغبة في الإمساك بهواتفنا كلما لم يكن عندنا ما نفعله."]],[["What can idle moments foster?",["Creativity","Sleep","Stress"],0],["What should we resist?",["Reaching for phones","Resting","Reading"],0]]],
["A Lifelong Friendship","صداقة العمر","🤝",[["Our friendship began in a crowded lecture hall, when we both reached for the last available seat.","بدأت صداقتنا في مدرج مزدحم حين مددنا يدينا إلى المقعد الأخير."],["Over the following forty years, we have supported each other through illness, loss and joy.","على مدى الأربعين سنة التالية دعم كل منا الآخر في المرض والفقد والفرح."],["Although we live in different countries, a single phone call is enough to pick up where we left off.","ورغم أننا نعيش في بلدين مختلفين تكفي مكالمة واحدة لنكمل من حيث توقفنا."]],[["Where did they meet?",["A lecture hall","A café","A train"],0],["How long have they been friends?",["Forty years","Four years","Fourteen years"],0]]],
["The Language of Music","لغة الموسيقى","🎼",[["Music is often described as a universal language, since melodies can move listeners who do not share a word.","توصف الموسيقى غالبا بأنها لغة عالمية فاللحن يؤثر في مستمعين لا يجمعهم حرف."],["Nevertheless, ethnomusicologists caution that scales and rhythms carry culturally specific meanings.","ومع ذلك ينبه علماء الموسيقى العرقية إلى أن السلالم والإيقاعات تحمل معاني ثقافية خاصة."],["Perhaps it is more accurate to say that music is a bridge, rather than a single language.","لعل الأدق القول إن الموسيقى جسر لا لغة واحدة."]],[["Why is music called universal?",["Moves listeners without words","Everyone plays","Same scales"],0],["What do ethnomusicologists say?",["Meanings are culture-specific","Music is useless","All same"],0]]],
["Minimalism","البساطة","📦",[["Minimalism encourages people to own fewer possessions and focus on what truly adds value to their lives.","تشجع البساطة الناس على امتلاك أشياء أقل والتركيز على ما يضيف قيمة حقيقية لحياتهم."],["Its advocates claim that decluttering their homes helped them declutter their minds.","يزعم أنصارها أن ترتيب بيوتهم ساعدهم على ترتيب أذهانهم."],["Sceptics counter that it is easier to be minimalist when one can afford to replace things at will.","يرد المشككون بأن البساطة أيسر لمن يقدر على استبدال الأشياء متى شاء."]],[["What does minimalism encourage?",["Fewer possessions","More shopping","Travel"],0],["What do sceptics say?",["It's easier for the wealthy","It is dangerous","It is old"],0]]],
["Resilient Cities","مدن صامدة","🌆",[["As climate-related disasters multiply, urban planners are rethinking how cities should be built.","مع تضاعف الكوارث المناخية يعيد المخططون التفكير في كيفية بناء المدن."],["Green roofs, permeable pavements and restored wetlands can absorb floodwater and cool the air.","يمكن للأسطح الخضراء والأرصفة النفاذة والأراضي الرطبة المستعادة امتصاص مياه الفيضان وتبريد الهواء."],["Crucially, such measures are most effective when planned together with local communities.","والأهم أن هذه التدابير أنجع حين تخطط مع المجتمعات المحلية."]],[["What can green roofs do?",["Absorb water and cool air","Make noise","Block light"],0],["When are measures effective?",["Planned with communities","Done quickly","Done secretly"],0]]],
["The Return Journey","رحلة العودة","🧳",[["After thirty years abroad, Karim finally returned to the village where he was born.","بعد ثلاثين سنة في الغربة عاد كريم أخيرا إلى القرية التي ولد فيها."],["The streets seemed narrower, the houses smaller, yet the smell of the olive trees was exactly as he remembered.","بدت الشوارع أضيق والبيوت أصغر لكن رائحة الزيتون كانت كما يتذكرها."],["He realised that home is not merely a place but a collection of memories one carries.","أدرك أن الوطن ليس مكانا فحسب بل مجموعة ذكريات يحملها المرء."]],[["How long was Karim abroad?",["Thirty years","Three years","Ten years"],0],["What did he realise?",["Home is memories","Villages change","He should leave"],0]]],
["The Science of Habit Loops","علم حلقات العادة","🔄",[["Neurologists describe habits as loops consisting of a cue, a routine and a reward.","يصف علماء الأعصاب العادات كحلقات من إشارة وروتين ومكافأة."],["Breaking a habit is rarely a matter of willpower alone; it usually requires replacing the routine while keeping the cue and reward.","كسر العادة نادرا ما يكون بقوة الإرادة وحدها بل غالبا باستبدال الروتين مع الإبقاء على الإشارة والمكافأة."],["For instance, a person who snacks when stressed might substitute a short walk for the biscuit.","فمثلا من يتناول وجبة خفيفة عند التوتر قد يستبدل البسكويت بنزهة قصيرة."]],[["What are the three parts of a habit loop?",["Cue, routine, reward","Start, end, rest","Plan, act, stop"],0],["What do you replace to break a habit?",["The routine","The cue","The reward"],0]]],
["Heritage and Tourism","التراث والسياحة","🏛️",[["Tourism can bring much-needed income to historic sites, yet excessive footfall may erode the very monuments visitors come to admire.","يمكن للسياحة أن تجلب دخلا ضروريا للمواقع التاريخية لكن كثرة الزوار قد تتلف المعالم نفسها."],["Some authorities now limit daily numbers or charge higher fees during peak seasons.","بعض السلطات الآن تحدد الأعداد اليومية أو ترفع الرسوم في المواسم."],["The goal is to strike a balance between access and preservation.","الهدف تحقيق التوازن بين الإتاحة والحفظ."]],[["What may excessive footfall do?",["Erode monuments","Help buildings","Make noise only"],0],["What is the goal?",["Balance access and preservation","Close sites","Raise taxes"],0]]],
["The Writer's Block","عقدة الكاتب","✍️",[["Every writer, however accomplished, has stared at a blank page unable to find the first word.","كل كاتب مهما بلغ من مهارة حدق في صفحة بيضاء عاجزا عن إيجاد الكلمة الأولى."],["Some overcome the paralysis by writing badly on purpose, since a poor draft can always be improved.","يتغلب بعضهم على الشلل بالكتابة السيئة عمدا فالمسودة الضعيفة يمكن تحسينها دائما."],["As one author put it, you cannot edit a page that does not exist.","وكما قال أحد المؤلفين لا يمكنك تحرير صفحة غير موجودة."]],[["How do some overcome blocks?",["Write badly on purpose","Stop writing","Read"],0],["What can't you edit?",["A page that doesn't exist","A long page","A draft"],0]]]

["Au service client","خدمة الزبائن","🎧",[["Bonjour, j'ai reçu mon téléphone hier, mais l'écran est fissuré.","السلام استلمت هاتفي أمس لكن الشاشة متشققة."],["Je suis vraiment désolé. Avez-vous gardé l'emballage ?","آسف جدا. هل احتفظت بالعلبة؟"],["Oui, je l'ai encore. Puis-je obtenir un remplacement ?","نعم عندي. هل يمكنني الحصول على بديل؟"],["Bien sûr, nous allons vous envoyer un nouveau modèle sous quarante-huit heures.","طبعا سنرسل لك طرازا جديدا خلال ثماني وأربعين ساعة."]],[["Quel est le problème ?",["L'écran est fissuré","La batterie est faible","Il manque le chargeur"],0],["Sous quel délai sera envoyé le nouveau ?",["48 heures","Une semaine","Un mois"],0]]],

["Discussion entre collègues","نقاش بين زملاء","👥",[["Tu as vu le planning de la semaine prochaine ?","هل رأيت جدول الأسبوع القادم؟"],["Oui, j'ai une réunion avec le client lundi matin.","نعم عندي اجتماع مع الزبون الإثنين صباحا."],["Alors je prépare la présentation et toi, tu t'occupes des chiffres.","إذن أحضر العرض وأنت تهتم بالأرقام."],["D'accord, on se retrouve vendredi pour tout relire ensemble.","موافق نلتقي الجمعة لنراجع كل شيء معا."]],[["Quand est la réunion ?",["Lundi matin","Vendredi","Mardi soir"],0],["Qui s'occupe des chiffres ?",["Le deuxième collègue","Le client","Le directeur"],0]]],

["Message du directeur","كلمة المدير","🏫",[["Chers élèves, chers parents, bienvenue pour cette nouvelle année scolaire.","أعزائي التلاميذ والأولياء مرحبا بكم في السنة الدراسية الجديدة."],["Cette année, nous ouvrons un club de théâtre et un atelier d'informatique.","هذه السنة نفتح نادي مسرح وورشة إعلام آلي."],["Nous comptons aussi renforcer le soutien scolaire pour les élèves en difficulté.","كما ننوي تعزيز الدعم المدرسي للتلاميذ المتعثرين."],["Je vous souhaite à tous une année pleine de réussite.","أتمنى لكم جميعا سنة مليئة بالنجاح."]],[["Quels clubs s'ouvrent ?",["Théâtre et informatique","Football et musique","Dessin et cuisine"],0],["Qui sera mieux aidé ?",["Les élèves en difficulté","Les meilleurs","Les professeurs"],0]]],

["Un témoignage","شهادة","🗨️",[["J'ai commencé à apprendre le français il y a deux ans, sans vraiment y croire.","بدأت تعلم الفرنسية قبل سنتين دون أن أصدق ذلك فعلا."],["Je regardais des séries sous-titrées et je notais les expressions nouvelles.","كنت أشاهد مسلسلات مترجمة وأدون التعابير الجديدة."],["Peu à peu, j'ai osé parler avec des touristes dans la rue.","شيئا فشيئا تجرأت على الحديث مع سياح في الشارع."],["Aujourd'hui, je peux soutenir une conversation d'une heure sans difficulté.","اليوم أستطيع إجراء محادثة ساعة كاملة دون صعوبة."]],[["Comment apprenait-il ?",["Avec des séries sous-titrées","Avec un professeur","En voyageant"],0],["Combien de temps peut-il parler maintenant ?",["Une heure","Cinq minutes","Une journée"],0]]],
["Annonce du transport urbain","إعلان النقل الحضري","🚋",[["En raison de travaux, le tramway sera interrompu entre deux stations ce week-end.","بسبب أشغال سيتوقف الترامواي بين محطتين نهاية الأسبوع."],["Des bus de remplacement circuleront toutes les dix minutes.","ستسير حافلات بديلة كل عشر دقائق."],["Nous vous recommandons de prévoir un temps de trajet supplémentaire.","ننصحكم بتوقع وقت إضافي للرحلة."]],[["Pourquoi le tramway est-il interrompu ?",["À cause de travaux","À cause d'une grève","À cause d'un match"],0],["Quelle est la fréquence des bus ?",["Toutes les 10 minutes","Toutes les heures","Une fois par jour"],0]]],

["Débat sur le télétravail","نقاش حول العمل عن بعد","🎙️",[["Selon moi, le télétravail améliore l'équilibre entre vie professionnelle et vie privée.","في رأيي العمل عن بعد يحسن التوازن بين الحياة المهنية والخاصة."],["Je ne suis pas d'accord : on perd le contact humain et la créativité collective.","لا أوافق نفقد التواصل الإنساني والإبداع الجماعي."],["Peut-être, mais les gains de temps sont indéniables, surtout dans les grandes villes.","ربما لكن الوقت المربوح لا ينكر خصوصا في المدن الكبرى."],["Un compromis serait de télétravailler deux ou trois jours par semaine.","حل وسط أن نعمل عن بعد يومين أو ثلاثة أسبوعيا."]],[["Quel argument avance le premier intervenant ?",["Meilleur équilibre de vie","Moins de travail","Plus d'argent"],0],["Quel compromis est proposé ?",["Deux ou trois jours par semaine","Cinq jours","Un jour par mois"],0]]],
["Reportage sur un village","روبورتاج عن قرية","🏞️",[["Nous voici dans un village perché à plus de mille mètres d'altitude.","نحن الآن في قرية متربعة على ارتفاع أكثر من ألف متر."],["Ici, la plupart des habitants vivent encore de l'élevage et de la culture des oliviers.","هنا يعيش أغلب السكان من تربية المواشي وزراعة الزيتون."],["Les jeunes partent peu à peu vers la ville, faute d'emplois sur place.","يغادر الشباب شيئا فشيئا نحو المدينة لقلة فرص العمل."],["Une coopérative d'huile d'olive tente pourtant de retenir les familles.","تحاول تعاونية زيت زيتون مع ذلك إبقاء العائلات."]],[["De quoi vivent les habitants ?",["Élevage et oliviers","Pêche","Tourisme"],0],["Pourquoi les jeunes partent-ils ?",["Manque d'emplois","Ennui","Climat"],0]]],
["Interview d'une chercheuse","حوار مع باحثة","🔬",[["Docteure Belkacem, pouvez-vous nous expliquer l'objet de votre recherche ?","دكتورة بلقاسم هل يمكنك شرح موضوع بحثك؟"],["Nous étudions l'impact du sommeil sur la concentration des adolescents.","ندرس أثر النوم على تركيز المراهقين."],["Nos résultats montrent qu'une heure de sommeil en moins réduit nettement les performances scolaires.","تبين نتائجنا أن نقص ساعة نوم يخفض الأداء الدراسي بوضوح."],["Nous recommandons donc de repousser le début des cours le matin.","لذلك نوصي بتأخير بداية الدروس صباحا."]],[["Que étudie la chercheuse ?",["L'impact du sommeil","Le régime alimentaire","La lecture"],0],["Que recommande-t-elle ?",["Repousser le début des cours","Supprimer les devoirs","Plus de sport"],0]]],
["Présentation d'un livre","تقديم كتاب","📚",[["Ce roman raconte l'histoire d'une famille déchirée par la guerre et réunie des décennies plus tard.","تحكي هذه الرواية قصة عائلة مزقتها الحرب وجمعها الزمن بعد عقود."],["L'auteur alterne habilement les époques, ce qui rythme la lecture.","يتنقل المؤلف ببراعة بين العصور مما يمنح القراءة إيقاعا."],["Certains lecteurs regretteront une fin un peu trop optimiste.","سيأسف بعض القراء لنهاية متفائلة قليلا."],["Il n'en reste pas moins un livre bouleversant, que je recommande vivement.","ومع ذلك يبقى كتابا مؤثرا أوصي به بشدة."]],[["De quoi parle le roman ?",["Une famille séparée par la guerre","Un voyage","Une enquête"],0],["Quel défaut est mentionné ?",["Une fin trop optimiste","Un style lourd","Trop de personnages"],0]]],
["Annonce d'un événement","إعلان عن تظاهرة","🎭",[["Le festival du théâtre ouvrira ses portes le quinze mars au centre culturel.","سيفتح مهرجان المسرح أبوابه في الخامس عشر من مارس بالمركز الثقافي."],["Au programme : une vingtaine de pièces et plusieurs ateliers pour les jeunes.","في البرنامج حوالي عشرين مسرحية وعدة ورشات للشباب."],["L'entrée est gratuite sur présentation d'une inscription préalable en ligne.","الدخول مجاني بعد تسجيل مسبق عبر الإنترنت."]],[["Quand s'ouvre le festival ?",["Le 15 mars","Le 1er mars","Le 15 avril"],0],["Comment entre-t-on ?",["Avec inscription préalable","En payant","Sans rien"],0]]],
["Témoignage d'un expatrié","شهادة مغترب","✈️",[["Quand je suis arrivé à Montréal, j'ai été frappé par le froid, mais surtout par la solitude.","عندما وصلت مونتريال صدمني البرد لكن خاصة الوحدة."],["Il m'a fallu des mois pour me faire un cercle d'amis.","استغرقني الأمر أشهرا لتكوين دائرة أصدقاء."],["Aujourd'hui, je considère cette ville comme ma seconde patrie.","اليوم أعتبر هذه المدينة وطني الثاني."],["Cela dit, mon pays me manque chaque jour, surtout pendant les fêtes.","ومع ذلك يشتاق قلبي لبلدي كل يوم خصوصا في الأعياد."]],[["Qu'a-t-il ressenti à son arrivée ?",["De la solitude","De la joie","De l'ennui"],0],["Que lui manque-t-il ?",["Son pays","Son travail","Ses études"],0]]],
["Rapport médical","تقرير طبي","🩺",[["Les analyses révèlent une légère carence en fer, ce qui explique votre fatigue.","تكشف التحاليل عن نقص طفيف في الحديد وهو ما يفسر تعبك."],["Je vous prescris un complément alimentaire à prendre pendant trois mois.","أصف لك مكملا غذائيا لمدة ثلاثة أشهر."],["Consommez également davantage de légumes verts et de légumineuses.","تناول أيضا مزيدا من الخضر الورقية والبقوليات."],["Nous referons un bilan à la fin du traitement.","سنجري فحصا جديدا عند نهاية العلاج."]],[["Quelle est la cause de la fatigue ?",["Une carence en fer","Le stress","Un virus"],0],["Pendant combien de temps ?",["Trois mois","Une semaine","Un an"],0]]],
["Discours de remise de diplômes","كلمة حفل التخرج","🎓",[["Chers diplômés, ce jour marque la fin d'un chapitre et le début d'une aventure.","أعزائي الخريجين هذا اليوم يغلق فصلا ويفتح مغامرة."],["Vous avez surmonté des examens difficiles, mais les vrais défis commencent maintenant.","اجتزتم امتحانات صعبة لكن التحديات الحقيقية تبدأ الآن."],["N'ayez pas peur de l'échec : il est souvent le meilleur professeur.","لا تخافوا الفشل فهو غالبا أفضل أستاذ."],["Restez curieux, restez humbles, et surtout, restez fidèles à vos valeurs.","ابقوا فضوليين متواضعين وخصوصا أوفياء لقيمكم."]],[["Quelle attitude face à l'échec est conseillée ?",["Ne pas en avoir peur","L'éviter à tout prix","L'oublier"],0],["Que doivent rester les diplômés ?",["Curieux et fidèles à leurs valeurs","Prudents","Silencieux"],0]]],
["Panne de courant","انقطاع الكهرباء","🔌",[["Suite à un incident technique, plusieurs quartiers sont privés d'électricité depuis ce matin.","إثر عطب تقني حرمت عدة أحياء من الكهرباء منذ صباح اليوم."],["Les équipes interviennent sur place afin de rétablir le courant au plus vite.","تتدخل الفرق في عين المكان لإعادة التيار بأسرع ما يمكن."],["Le retour à la normale est prévu en début de soirée.","يتوقع العودة إلى الوضع العادي بداية المساء."],["Nous vous remercions de votre patience et vous invitons à limiter votre consommation.","نشكركم على صبركم وندعوكم إلى تقليص استهلاككم."]],[["Quand est prévu le retour du courant ?",["En début de soirée","Demain","Dans une semaine"],0],["Que demande-t-on aux habitants ?",["Limiter leur consommation","Sortir","Appeler"],0]]],
["Critique de film","نقد فيلم","🎬",[["Ce film, sorti la semaine dernière, nous plonge dans l'Alger des années soixante.","هذا الفيلم الذي صدر الأسبوع الماضي يغوص بنا في الجزائر الستينات."],["La reconstitution est soignée et les acteurs, particulièrement convaincants.","إعادة التشكيل متقنة والممثلون مقنعون خصوصا."],["En revanche, le scénario s'essouffle dans la dernière demi-heure.","غير أن السيناريو يفقد نفسه في آخر نصف ساعة."],["Malgré cela, c'est une œuvre à voir, ne serait-ce que pour son atmosphère.","ومع ذلك هو عمل يستحق المشاهدة ولو لأجواءه."]],[["Où se déroule le film ?",["Dans l'Alger des années 60","À Paris","Dans le désert"],0],["Quel reproche est fait ?",["Le scénario s'essouffle","Les acteurs sont mauvais","Il est trop court"],0]]],
["Séance du conseil municipal","جلسة المجلس البلدي","🏛️",[["La séance est ouverte. Le premier point à l'ordre du jour concerne la rénovation du marché couvert.","افتتحت الجلسة النقطة الأولى في جدول الأعمال ترميم السوق المغطى."],["Le coût estimé des travaux s'élève à vingt millions de dinars.","تبلغ الكلفة المقدرة للأشغال عشرين مليون دينار."],["Certains conseillers jugent ce montant excessif et demandent une étude complémentaire.","يعتبر بعض المستشارين هذا المبلغ مفرطا ويطلبون دراسة تكميلية."],["Le vote est reporté à la prochaine séance.","يؤجل التصويت إلى الجلسة المقبلة."]],[["Quel est le premier point ?",["La rénovation du marché","Le budget","Les écoles"],0],["Que décide-t-on pour le vote ?",["Le reporter","Le faire maintenant","L'annuler"],0]]],
["Conseils pour l'examen","نصائح للامتحان","📖",[["Le jour de l'examen, arrivez en avance et vérifiez votre matériel.","يوم الامتحان احضروا مبكرا وتأكدوا من أدواتكم."],["Lisez attentivement les consignes avant de commencer à écrire.","اقرؤوا التعليمات بتمعن قبل أن تبدؤوا الكتابة."],["Répartissez votre temps entre les différentes questions pour ne rien laisser de côté.","وزعوا وقتكم على الأسئلة حتى لا يبقى شيء."],["Gardez dix minutes à la fin pour relire votre copie.","احتفظوا بعشر دقائق في النهاية لإعادة قراءة ورقتكم."]],[["Que faut-il lire avant d'écrire ?",["Les consignes","Le programme","Les notes"],0],["Combien de temps garder pour la relecture ?",["Dix minutes","Une heure","Une minute"],0]]],
["Atelier d'écriture","ورشة كتابة","✍️",[["Pour bien écrire, il faut d'abord savoir ce que l'on veut dire.","لكي نكتب جيدا يجب أولا أن نعرف ماذا نريد قوله."],["Faites un plan simple avec une introduction, deux ou trois idées et une conclusion.","ضعوا خطة بسيطة من مقدمة وفكرتين أو ثلاث وخاتمة."],["Évitez les phrases trop longues qui perdent le lecteur.","تجنبوا الجمل الطويلة جدا التي تضيع القارئ."],["Enfin, relisez à voix haute : l'oreille détecte ce que l'œil ne voit pas.","أخيرا اقرؤوا بصوت عال فالأذن تكتشف ما لا تراه العين."]],[["Que faut-il faire d'abord ?",["Savoir ce qu'on veut dire","Chercher des mots","Commencer à écrire"],0],["Pourquoi relire à voix haute ?",["L'oreille détecte les erreurs","C'est plus rapide","C'est une tradition"],0]]],
["Reportage sur la rentrée","روبورتاج عن الدخول المدرسي","🏫",[["Ce matin, près de dix millions d'élèves ont repris le chemin de l'école.","هذا الصباح عاد قرابة عشرة ملايين تلميذ إلى المدارس."],["Les parents font face à une hausse du coût des fournitures scolaires.","يواجه الأولياء ارتفاعا في كلفة المستلزمات المدرسية."],["Des associations distribuent des cartables aux familles les plus modestes.","توزع جمعيات محافظ على العائلات الأكثر تواضعا."],["Le ministre a promis une amélioration des conditions d'accueil dans les classes surchargées.","وعد الوزير بتحسين ظروف الاستقبال في الأقسام المكتظة."]],[["Combien d'élèves reprennent l'école ?",["Près de dix millions","Mille","Un million"],0],["Que distribuent les associations ?",["Des cartables","Des repas","Des livres"],0]]],
["Conseil d'un expert en finances","نصيحة خبير مالي","💳",[["La règle d'or consiste à épargner une partie de son revenu dès qu'on le reçoit.","القاعدة الذهبية ادخار جزء من الدخل بمجرد تلقيه."],["Prévoyez un fonds d'urgence équivalant à trois mois de dépenses.","هيئوا صندوق طوارئ يعادل مصاريف ثلاثة أشهر."],["Évitez les crédits à la consommation sauf en cas de réelle nécessité.","تجنبوا قروض الاستهلاك إلا للضرورة."],["Enfin, suivez vos dépenses pour repérer les achats superflus.","أخيرا تتبعوا نفقاتكم لاكتشاف المشتريات الزائدة."]],[["À quoi équivaut le fonds d'urgence ?",["Trois mois de dépenses","Un an","Une semaine"],0],["Que faut-il suivre ?",["Ses dépenses","Les taux","Les actions"],0]]],
["Journal parlé d'un marathonien","يوميات عداء ماراثون","🏃‍♂️",[["Le jour du marathon, le départ a été donné à huit heures sous un soleil radieux.","يوم الماراثون أعطيت الانطلاقة في الثامنة تحت شمس ساطعة."],["Jusqu'au trentième kilomètre, tout s'est bien passé, puis la fatigue a surgi.","حتى الكيلومتر الثلاثين سار كل شيء جيدا ثم ظهر التعب."],["Les encouragements du public m'ont aidé à tenir jusqu'au bout.","ساعدني تشجيع الجمهور على الصمود حتى النهاية."],["J'ai franchi la ligne d'arrivée en pleurant de joie.","عبرت خط النهاية وأنا أبكي فرحا."]],[["À quel kilomètre la fatigue est-elle apparue ?",["Au trentième","Au dixième","Au premier"],0],["Qu'est-ce qui l'a aidé à finir ?",["Les encouragements du public","Une boisson","La musique"],0]]],
["Compte rendu de réunion","محضر اجتماع","🗂️",[["Lors de la réunion d'hier, l'équipe a validé le calendrier du projet.","في اجتماع أمس صادق الفريق على جدول المشروع."],["La phase de test débutera le dix du mois prochain et durera quatre semaines.","ستبدأ مرحلة الاختبار في العاشر من الشهر القادم وتدوم أربعة أسابيع."],["Un point d'avancement hebdomadaire sera organisé chaque lundi.","ستنظم نقطة متابعة أسبوعية كل إثنين."],["Chacun doit transmettre son rapport avant vendredi.","على كل فرد إرسال تقريره قبل الجمعة."]],[["Quand débute la phase de test ?",["Le 10 du mois prochain","Demain","Le 1er"],0],["À quelle fréquence est le point d'avancement ?",["Chaque lundi","Chaque jour","Chaque mois"],0]]],
["Émission sur l'environnement","برنامج عن البيئة","🌳",[["Dans cette émission, nous recevons un spécialiste du reboisement.","نستقبل في هذه الحصة مختصا في التشجير."],["Il explique que planter des arbres ne suffit pas, il faut choisir des essences adaptées au sol.","يشرح أن غرس الأشجار لا يكفي بل يجب اختيار أنواع ملائمة للتربة."],["Les forêts mixtes résistent mieux aux incendies et aux maladies.","الغابات المختلطة تقاوم أفضل الحرائق والأمراض."],["Il appelle les citoyens à participer aux campagnes de plantation organisées localement.","يدعو المواطنين إلى المشاركة في حملات الغرس المنظمة محليا."]],[["Que faut-il choisir pour planter ?",["Des essences adaptées au sol","Les arbres les plus grands","Des arbres fruitiers"],0],["Quels avantages ont les forêts mixtes ?",["Elles résistent mieux","Elles poussent plus vite","Elles coûtent moins"],0]]],
["Appel d'un client mécontent","مكالمة زبون غاضب","📞",[["Allô ? Je vous appelle pour la troisième fois au sujet de ma commande qui n'est toujours pas arrivée.","ألو؟ أتصل بكم للمرة الثالثة بشأن طلبي الذي لم يصل بعد."],["Je suis sincèrement désolé pour ce désagrément, monsieur. Je vérifie tout de suite.","أنا آسف حقا على هذا الإزعاج سيدي. سأتحقق حالا."],["Le colis a été bloqué à cause d'une erreur d'adresse.","تعطلت الطرد بسبب خطأ في العنوان."],["Nous le renvoyons aujourd'hui et nous vous offrons les frais de livraison.","سنعيد إرساله اليوم ونمنحكم تكاليف التوصيل مجانا."]],[["Combien de fois a-t-il appelé ?",["Trois","Une","Cinq"],0],["Quelle compensation lui offre-t-on ?",["Les frais de livraison","Un remboursement","Un cadeau"],0]]],
["Excursion scolaire","رحلة مدرسية","🚌",[["Demain, nous partons visiter les ruines romaines de Tipaza.","غدا ننطلق لزيارة الآثار الرومانية في تيبازة."],["Le car quittera l'école à sept heures précises, alors soyez à l'heure.","ستغادر الحافلة المدرسة في السابعة تماما فكونوا في الموعد."],["Apportez un pique-nique, de l'eau et un chapeau, car il fera chaud.","أحضروا غداء وماء وقبعة فالجو حار."],["Un guide nous expliquera l'histoire du site pendant deux heures.","سيشرح لنا مرشد تاريخ الموقع لمدة ساعتين."]],[["Où vont-ils ?",["À Tipaza","À Oran","À Constantine"],0],["Que faut-il apporter ?",["Pique-nique, eau et chapeau","Un ordinateur","Un maillot"],0]]],
["Nouvelle technologie","تقنية جديدة","📲",[["Une start-up locale vient de lancer une application qui traduit la parole en temps réel.","أطلقت شركة ناشئة محلية تطبيقا يترجم الكلام آنيا."],["Elle est particulièrement utile pour les voyageurs et les étudiants étrangers.","هو مفيد خصوصا للمسافرين والطلبة الأجانب."],["Les fondateurs affirment que la précision atteint quatre-vingt-quinze pour cent.","يؤكد المؤسسون أن الدقة تبلغ خمسة وتسعين بالمئة."],["Il reste à tester l'application sur des accents très variés.","يبقى اختبار التطبيق على لهجات متنوعة جدا."]],[["Que fait l'application ?",["Traduire la parole en temps réel","Écrire des textes","Réserver des billets"],0],["Quelle précision est annoncée ?",["95 %","50 %","100 %"],0]]],
["Réflexion sur le temps","تأمل في الوقت","⌛",[["On dit souvent qu'on manque de temps, alors qu'en réalité on manque de priorités.","يقال غالبا إننا نفتقر للوقت بينما في الحقيقة نفتقر للأولويات."],["Savoir dire non est une compétence qui s'apprend et qui libère de l'espace.","قول لا مهارة تكتسب وتفتح مساحة."],["Planifier sa journée la veille permet d'éviter l'éparpillement.","تخطيط اليوم في الليلة السابقة يجنب التشتت."],["Le véritable luxe, c'est de choisir comment employer ses heures.","الرفاهية الحقيقية هي اختيار كيف نقضي ساعاتنا."]],[["De quoi manque-t-on vraiment ?",["De priorités","De temps","D'argent"],0],["Que permet de planifier la veille ?",["Éviter l'éparpillement","Gagner de l'argent","Dormir"],0]]],
["Festival de musique","مهرجان موسيقي","🎶",[["Le festival de musique andalouse commence ce soir dans le théâtre en plein air.","يبدأ الليلة مهرجان الموسيقى الأندلسية في المسرح المفتوح."],["Des orchestres venus de plusieurs pays se produiront pendant cinq jours.","ستؤدي فرق قادمة من عدة بلدان خمسة أيام."],["Les billets sont en vente à l'entrée à partir de dix-huit heures.","التذاكر معروضة عند المدخل ابتداء من السادسة مساء."],["Les organisateurs attendent plus de dix mille spectateurs.","يتوقع المنظمون أكثر من عشرة آلاف متفرج."]],[["Combien de jours dure le festival ?",["Cinq","Deux","Dix"],0],["Quand vend-on les billets ?",["À partir de 18 h","Le matin","Seulement en ligne"],0]]]
