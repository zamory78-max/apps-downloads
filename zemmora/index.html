<title>زمورة تعلم اللغات — Zemmora Language Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2433;--mut:#6b7488;--pri:#2563eb;--pri2:#1e40af;--ok:#16a34a;--bad:#dc2626;--acc:#f59e0b;--line:#e3e8f0;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:light}
button{color:var(--ink);font-family:inherit}
input{color:var(--ink);background:#fff;font-family:inherit}
.opt.ok,.opt.no{color:var(--ink)}
html{-webkit-text-size-adjust:100%}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:#d9e0ee;color:var(--ink);overscroll-behavior-y:contain}
#shell{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(0,0,0,.15)}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 22px;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:22px;font-weight:800}
header p{margin:4px 0 0;opacity:.9;font-size:14px}
.stats{display:flex;gap:10px;margin-top:12px}
.pill{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
main{padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(30,40,80,.06);margin-bottom:14px}
h2{font-size:19px;margin:6px 0 12px}
.levels{display:grid;gap:12px}
.lv{display:flex;align-items:center;gap:14px;cursor:pointer;border:2px solid transparent;transition:.15s}
.lv:hover{border-color:var(--pri)}
.lv .ic{font-size:34px;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;flex:none}
.lv b{font-size:17px}.lv small{color:var(--mut);display:block}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);width:0;transition:.4s}
.back{background:none;border:0;color:var(--pri);font:600 15px Cairo;cursor:pointer;padding:4px 0;margin-bottom:6px}
.les{display:flex;align-items:center;gap:12px;cursor:pointer}
.les .ic{font-size:30px}
.les .done{margin-inline-start:auto;font-size:22px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:20;border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.08)}
nav button{background:none;border:0;font:600 11px Cairo;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 6px;flex:1}
nav button span{font-size:22px}nav button.on{color:var(--pri)}
.tabs{display:flex;gap:6px;background:#e9eef7;padding:5px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font:700 14px Cairo;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:11px 18px;font:700 15px Cairo;cursor:pointer}
.btn:hover{background:var(--pri2)}.btn.sec{background:#e8eefc;color:var(--pri)}.btn:disabled{opacity:.5;cursor:default}
.flash{perspective:900px;height:300px;cursor:pointer;margin-bottom:12px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center}
.face.f{background:linear-gradient(160deg,#fff,#eef3ff);border:2px solid var(--line)}
.face.b{background:linear-gradient(160deg,#eef6ff,#e6f9ee);border:2px solid #bfe3cf;transform:rotateY(180deg)}
.big{font-size:104px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.04)}}
.w{font-size:30px;font-weight:800}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.ar{color:var(--pri2);font-weight:700;font-size:22px}
.ex{color:var(--mut);font-size:15px}
.spk{background:#fff;border:2px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer}
.tip{background:#fff8e6;border:1px solid #fde4a1;border-radius:14px;padding:12px;font-size:15px;line-height:1.8}
/* video */
.stage{position:relative;height:380px;border-radius:var(--r);overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.stage .floaters{position:absolute;inset:0;pointer-events:none}
.stage .floaters span{position:absolute;font-size:44px;opacity:.28;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px) rotate(8deg)}}
.chars{position:absolute;top:34px;inset-inline:0;display:flex;justify-content:space-around;align-items:flex-end}
.ch{font-size:78px;transition:.3s;filter:grayscale(.6) brightness(.8);transform:scale(.9)}
.ch.on{filter:none;transform:scale(1.15) translateY(-6px)}
.ch small{display:block;font-size:13px;text-align:center;font-weight:700}
.sub{position:relative;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:12px 14px;min-height:112px;text-align:center}
.sub .e{font-size:20px;font-weight:700;direction:ltr}
.sub .a{font-size:16px;margin-top:4px;color:#ffe9a8}
.prog{height:5px;background:rgba(255,255,255,.3)}.prog i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
/* quiz */
.q{font-size:18px;font-weight:700;text-align:center;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font:700 17px Cairo;cursor:pointer}
.opt.ok{background:#dcfce7;border-color:var(--ok)}.opt.no{background:#fee2e2;border-color:var(--bad)}
/* chat */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:600 13px Cairo;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chat{flex:1;overflow:auto;background:#eef2f8;padding:12px;display:flex;flex-direction:column;gap:10px}.chat.hidear .msg .a{display:none}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.7;font-size:16px}
.msg.me{align-self:flex-start;background:var(--pri);color:#fff;border-end-start-radius:4px}
.msg.bot{align-self:flex-end;background:#fff;border-end-end-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.msg .e{font-weight:700;font-size:17px;direction:ltr;display:block;text-align:left}
.msg .a{color:var(--pri2);font-size:14px;display:block;margin-top:4px}
.msg .f{background:#fff4d6;border-radius:10px;padding:6px 9px;margin-top:6px;font-size:14px;display:block}
.inp{display:flex;gap:8px;margin-top:10px}
.inp input{flex:1;border:2px solid var(--line);border-radius:14px;padding:12px;font:16px Cairo;min-width:0}
.inp input:focus{outline:none;border-color:var(--pri)}
.mic{background:#fff;border:2px solid var(--line);border-radius:14px;width:48px;font-size:20px;cursor:pointer}.mic.rec{background:#fee2e2;border-color:var(--bad)}
.note{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.7}
.convo{display:flex;flex-direction:column;height:100dvh}
.ctop{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.ctop small{display:block;opacity:.85;font-size:12px}.ctop .chip{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}.ctop .chip.on{background:#fff;color:var(--pri)}
.cb2{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.mission{background:#fff8e6;border-bottom:1px solid #fde4a1;padding:8px 14px;font-size:14px;font-weight:600}.mission.won{background:#dcfce7;border-color:#86efac}
.sug{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;background:var(--bg);min-height:8px}.sug .chip{white-space:nowrap;flex:none;background:#fff}
.convo .inp{padding:8px 10px calc(10px + env(safe-area-inset-bottom));margin:0;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sc{cursor:pointer;margin:0;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}.sc:active{border-color:var(--pri)}.sc small{color:var(--mut);font-size:12px;line-height:1.5}
.chips{overflow-x:auto;flex-wrap:nowrap}.chip{flex:none}
body.inchat header,body.inchat nav{display:none}body.inchat #shell{padding-bottom:0}body.inchat main{padding:0}
.next{display:flex;align-items:center;gap:12px;cursor:pointer;background:linear-gradient(135deg,#fef3c7,#fde68a)}
.sn{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line);font-size:18px;line-height:1.9;direction:ltr;text-align:left;cursor:pointer;border-radius:10px}
.sn.hl{background:#fff3c4}.sn .tr{flex-basis:100%;direction:rtl;text-align:right;color:var(--pri2);font-size:15px;line-height:1.7}
.sb{background:#eef3ff;border:0;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;flex:none;margin-top:4px}
.spkr{flex-basis:100%;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:-8px;direction:ltr}
.wd.gl{border-bottom:2px dotted var(--acc);font-weight:600}
.hidetxt .txt{filter:blur(9px);user-select:none;pointer-events:none}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));width:min(92%,480px);background:#1d2433;color:#fff;border-radius:16px;padding:10px 14px;z-index:30;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.dctin{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:18px system-ui}.dctin:focus{outline:none;border-color:var(--pri)}
.sc.dim{opacity:.45}
.sug.w{flex-wrap:wrap;max-height:34vh;overflow-y:auto}.sug.w .chip{white-space:normal;text-align:left;direction:ltr;border-radius:14px;padding:8px 12px}
.hide{display:none!important}
.win{text-align:center;padding:20px}.win .big{font-size:80px}
.vid-links a{display:inline-block;margin:4px;padding:8px 12px;background:#fee2e2;color:#b91c1c;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="shell"><header>
  <h1>🎓 زمورة تعلم اللغات <span class="en" style="font-weight:600;font-size:15px">Zemmora</span></h1>
  <p>تعلّم الإنجليزية من المبتدئ إلى المتقدّم — بالدارجة الجزائرية 🇩🇿</p>
  <div class="stats"><div class="pill">⭐ <span id="xp">0</span> نقطة</div><div class="pill">✅ <span id="dn">0</span>/30 درس</div><div class="pill">🔥 <span id="st">0</span> يوم</div></div>
</header>
<main id="app"></main></div>
<nav>
  <button data-v="home" class="on"><span>📚</span>الدروس</button>
  <button data-v="read"><span>📖</span>قراءة</button>
  <button data-v="listen"><span>🎧</span>استماع</button>
  <button data-v="chat"><span>💬</span>محادثة</button>
  <button data-v="prog"><span>📈</span>تقدّمي</button>
</nav>

<script>
/* ---------- DATA ---------- */
const LEVELS=[
 {id:"A1",name:"مبتدئ",en:"Beginner",ic:"🌱",c:"#dcfce7"},
 {id:"A2",name:"أساسي",en:"Elementary",ic:"🌿",c:"#d1fae5"},
 {id:"B1",name:"متوسط",en:"Intermediate",ic:"🌳",c:"#dbeafe"},
 {id:"B2",name:"فوق المتوسط",en:"Upper-Intermediate",ic:"🚀",c:"#ede9fe"},
 {id:"C1",name:"متقدّم",en:"Advanced",ic:"👑",c:"#fef3c7"}
];
// words: [en, darija, emoji, example, exampleDarija]
const L=[
{id:1,lv:"A1",t:"التحيات",en:"Greetings",ic:"👋",g:["#4f46e5","#06b6d4"],chars:["🧑","👩"],names:["Amine","Sara"],
 w:[["Hello","السلام / أهلا","👋","Hello, my name is Amine.","أهلا، سميتي أمين."],
 ["Goodbye","بصحتك / سلام","🤚","Goodbye, see you tomorrow!","بصحتك، نشوفك غدوة!"],
 ["Please","عفاك","🙏","Water, please.","الما، عفاك."],
 ["Thank you","بارك الله فيك / شكرا","😊","Thank you very much!","شكرا بزاف!"],
 ["Sorry","سامحني","😔","Sorry, I'm late.","سامحني، تأخرت."],
 ["Friend","صاحبي","🤝","He is my friend.","هذا صاحبي."]],
 d:[[0,"Hello! How are you?","السلام! واش راك؟"],[1,"I'm fine, thank you. And you?","لاباس، شكرا. وإنتِ؟"],[0,"I'm good. What's your name?","مليح. واش سميتك؟"],[1,"My name is Sara. Nice to meet you!","سميتي سارة. تشرفنا!"]],
 tip:"«How are you?» = «واش راك؟» والجواب «I'm fine» = «لاباس». وحاول تقول «Nice to meet you» كي تعرف واحد جديد."},
{id:2,lv:"A1",t:"الأكل والمشروبات",en:"Food & Drinks",ic:"🍞",g:["#f59e0b","#ef4444"],chars:["🧑‍🍳","🧑"],names:["Waiter","Customer"],
 w:[["Water","الما","💧","I want water.","نحب الما."],
 ["Bread","الخبز","🍞","I eat bread every day.","ناكل الخبز كل نهار."],
 ["Coffee","القهوة","☕","One coffee, please.","قهوة وحدة، عفاك."],
 ["Milk","الحليب","🥛","The milk is cold.","الحليب بارد."],
 ["Apple","التفاحة","🍎","This apple is sweet.","هاذ التفاحة حلوة."],
 ["Hungry","جيعان","🍽️","I am hungry.","راني جيعان."]],
 d:[[0,"Hello! What would you like?","السلام! واش تحب؟"],[1,"I would like a coffee, please.","نحب قهوة، عفاك."],[0,"Anything else?","حاجة أخرى؟"],[1,"Yes, a bottle of water. How much is it?","إيه، قارورة ما. بشحال؟"]],
 tip:"في الدارجة «نحب» تعني «نريد» و«نحب» (أُحِبّ). في الإنجليزية: «I want» = نبغي/نحب الشيء، و«I like» = يعجبني. للتأدب قُل «I would like»."},
{id:3,lv:"A2",t:"التسوّق",en:"Shopping",ic:"🛍️",g:["#ec4899","#8b5cf6"],chars:["🧑","🧑‍💼"],names:["Customer","Seller"],
 w:[["Expensive","غالي","💰","This bag is expensive.","هاذ الصاك غالي."],
 ["Cheap","رخيص","🏷️","The shoes are cheap.","الصباط رخيص."],
 ["Discount","تخفيض","🔖","Can I get a discount?","نقدر نخذ تخفيض؟"],
 ["Size","المقاس","📏","What size are you?","واش مقاسك؟"],
 ["Bag","الصاك","👜","I need a new bag.","نحتاج صاك جديد."],
 ["Receipt","الفاكتورة / الوصل","🧾","Keep the receipt.","حافظ على الوصل."]],
 d:[[0,"How much is this jacket?","بشحال هاد الجاكيط؟"],[1,"It's four thousand dinars.","ب4000 دينار."],[0,"That's too expensive. Can you give me a discount?","غالي بزاف. تنقص لي شوية؟"],[1,"OK, three thousand five hundred for you.","مليح، 3500 ليك."]],
 tip:"«too + صفة» = «بزاف»: too expensive = غالي بزاف. و«Can you ...?» = «تقدر ...؟» لطلب مؤدب."},
{id:4,lv:"A2",t:"الاتجاهات",en:"Directions",ic:"🧭",g:["#0ea5e9","#22c55e"],chars:["🧑","👮"],names:["Tourist","Police officer"],
 w:[["Left","اليسار","⬅️","Turn left.","دور على اليسار."],
 ["Right","اليمين","➡️","Turn right.","دور على اليمين."],
 ["Straight","طول","⬆️","Go straight.","امشي طول."],
 ["Near","قريب","📍","The school is near.","المدرسة قريبة."],
 ["Far","بعيد","🏔️","It is far from here.","بعيدة من هنا."],
 ["Street","الشارع","🛣️","This street is long.","هاذ الشارع طويل."]],
 d:[[0,"Excuse me, where is the pharmacy?","سمحلي، وين كاين الصيدلية؟"],[1,"Go straight, then turn left.","امشي طول، وبعد دور على اليسار."],[0,"Is it far?","بعيدة؟"],[1,"No, it's near the mosque.","لا، قريبة من الجامع."]],
 tip:"«Excuse me» تستعملها قبل ما تسول واحد (سمحلي). و«Where is...?» = «وين...؟»."},
{id:5,lv:"B1",t:"السفر والمطار",en:"Travel & Airport",ic:"✈️",g:["#0369a1","#6366f1"],chars:["🧳","🧑‍✈️"],names:["Passenger","Agent"],
 w:[["Ticket","التذكرة","🎫","I bought a ticket online.","شريت التذكرة أونلاين."],
 ["Passport","جواز السفر","🛂","Don't forget your passport.","ما تنساش جواز السفر."],
 ["Luggage","الباغاج","🧳","My luggage is heavy.","الباغاج تاعي ثقيل."],
 ["Delayed","متأخر","⏰","The flight is delayed.","الطيارة متأخرة."],
 ["Reservation","الحجز","📅","I have a reservation.","عندي حجز."],
 ["Gate","بوابة الصعود","🚪","Go to gate twelve.","روح لبوابة 12."]],
 d:[[1,"Good morning. May I see your passport and ticket?","صباح الخير. نقدر نشوف جواز السفر والتذكرة؟"],[0,"Here you are. I have one suitcase to check in.","تفضل. عندي ڤاليزة وحدة نسجلها."],[1,"Your flight has been delayed by one hour.","طيارتك تأخرت ساعة."],[0,"That's fine. Which gate should I go to?","مشي مشكل. لأي بوابة نروح؟"]],
 tip:"«has been delayed» = المبني للمجهول + الحاضر التام: حاجة وقعات وأثرها باقي الآن. مثال: «The flight has been cancelled»."},
{id:6,lv:"B1",t:"العمل",en:"Work Life",ic:"💼",g:["#334155","#0ea5e9"],chars:["🧑‍💼","👩‍💼"],names:["Manager","Employee"],
 w:[["Meeting","اجتماع","👥","We have a meeting at ten.","عندنا اجتماع على 10."],
 ["Deadline","آخر أجل","⏳","The deadline is Friday.","آخر أجل نهار الجمعة."],
 ["Salary","الراتب","💵","My salary is good.","الراتب تاعي مليح."],
 ["Colleague","الزميل","🧑‍💼","My colleague helped me.","زميلي عاوني."],
 ["Boss","المدير / الباترون","👔","My boss is kind.","المدير تاعي طيب."],
 ["Appointment","موعد","📆","I have an appointment today.","عندي موعد اليوم."]],
 d:[[0,"Did you finish the report?","كملت التقرير؟"],[1,"Not yet. I'm going to send it tomorrow morning.","مازال. راني نبعثو غدوة الصباح."],[0,"The deadline is today, remember?","آخر أجل اليوم، ركزلي؟"],[1,"I'm sorry. I will send it within two hours.","سامحني. نبعثو في ظرف ساعتين."]],

const S={view:"home",lv:null,les:null,tab:"cards",card:0,xp:0,done:{},streak:0,last:"",stories:{},saved:[],dl:"A1",sid:null,mode:"read",drill:"dict"};
const tabOf=v=>({lessons:"home",lesson:"home",story:S.mode==="listen"?"listen":"read",drill:"listen"}[v]||v);
try{Object.assign(S,JSON.parse(localStorage.getItem("zemmora")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("zemmora",JSON.stringify({xp:S.xp,done:S.done,streak:S.streak,last:S.last,stories:S.stories,saved:S.saved,dl:S.dl}))}catch(e){}};
(function streak(){const t=new Date().toDateString();if(S.last!==t){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=t;save()}})();
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const E=s=>`<span class="en">${esc(s)}</span>`;
function head(){$("#xp").textContent=S.xp;$("#dn").textContent=Object.keys(S.done).length;$("#st").textContent=S.streak}
function addXP(n){S.xp+=n;save();head()}

/* ---------- SPEECH ---------- */
let voiceEN=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voiceEN=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
let _tid=0;const _tcb={};window.__ttsDone=id=>{if(_tcb[id])_tcb[id]()};
function say(text,{rate=.9,pitch=1}={}){
  return new Promise(res=>{
    const guess=Math.max(1200,text.length*75);
    if(window.AndroidTTS){const id="u"+(++_tid);let d=false;const fin=()=>{if(!d){d=true;delete _tcb[id];res()}};_tcb[id]=fin;setTimeout(fin,guess+8000);try{AndroidTTS.speak(text,rate,pitch,id)}catch(e){fin()}return}
    try{
      if(!window.speechSynthesis)throw 0;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate;u.pitch=pitch;if(voiceEN)u.voice=voiceEN;
      let done=false;const fin=()=>{if(!done){done=true;res()}};
      u.onend=fin;u.onerror=fin;setTimeout(fin,guess+4000);
      speechSynthesis.speak(u);
    }catch(e){setTimeout(res,guess)}
  });
}

function go(v,o={}){stopVideo();Object.assign(S,{view:v},o);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===tabOf(v)));render();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v,{lv:null,les:null}));
function render(){head();document.body.classList.toggle("inchat",S.view==="chat"&&C.active);({home,lessons,lesson,chat,prog,read,listen,story,drill})[S.view]()}

/* ---------- HOME ---------- */
function lvPct(id){const ls=L.filter(l=>l.lv===id);return Math.round(100*ls.filter(l=>S.done[l.id]).length/ls.length)}
function nextCard(){const n=L.find(l=>!S.done[l.id]);return n?`<div class="card next" id="nxl" data-i="${n.id}"><div style="font-size:38px">${n.ic}</div><div style="flex:1"><small style="color:#92400e">▶ تابع من حيث توقفت</small><div><b>${n.t}</b> <span class="ex">${E(n.en)} · ${n.lv}</span></div></div><div style="font-size:22px">◀</div></div>`:`<div class="card">🏆 أنهيت كل الدروس!</div>`}
function home(){
  app.innerHTML=`<div class="card"><h2>👋 مرحبا بيك!</h2><div style="line-height:1.9">اختار مستواك وابدأ. كل درس فيه: <b>بطاقات بالصور</b> 🖼️، <b>فيديو حواري متحرّك</b> 🎬، و<b>اختبار</b> 🎯. وفي تبويب <b>محادثة</b> 💬 تهدر مع مدرّس ذكي يفهم الدارجة ويصحّحلك.</div></div>
  ${nextCard()}<div class="grid2" style="margin-bottom:14px"><div class="card sc" id="hr"><div style="font-size:34px">📖</div><b>قصص للقراءة</b><small>قصص ومقالات بالكلمات المسطّرة</small></div><div class="card sc" id="hl"><div style="font-size:34px">🎧</div><b>تدريب الاستماع</b><small>إملاء وحوارات وقصص</small></div></div><h2>📚 المستويات</h2><div class="levels">${LEVELS.map(l=>`<div class="card lv" data-l="${l.id}"><div class="ic" style="background:${l.c}">${l.ic}</div><div style="flex:1"><b>${l.name} · ${E(l.id)}</b><small>${E(l.en)}</small><div class="bar"><i style="width:${lvPct(l.id)}%"></i></div></div></div>`).join("")}</div>`;
  app.querySelectorAll(".lv").forEach(e=>e.onclick=()=>go("lessons",{lv:e.dataset.l}));$("#hr").onclick=()=>go("read");$("#hl").onclick=()=>go("listen");const nx=$("#nxl");if(nx)nx.onclick=()=>go("lesson",{les:+nx.dataset.i,tab:"cards",card:0});
}
function lessons(){
  const lv=LEVELS.find(l=>l.id===S.lv);
  app.innerHTML=`<button class="back">→ رجوع</button><h2>${lv.ic} ${lv.name} ${E(lv.id)}</h2>${L.filter(l=>l.lv===lv.id).map(l=>`<div class="card les" data-i="${l.id}"><div class="ic">${l.ic}</div><div><b>${l.t}</b><div class="ex">${E(l.en)} · ${l.w.length} كلمات</div></div><div class="done">${S.done[l.id]?"✅":"◀"}</div></div>`).join("")}`;
  $(".back").onclick=()=>go("home");
  app.querySelectorAll(".les").forEach(e=>e.onclick=()=>go("lesson",{les:+e.dataset.i,tab:"cards",card:0}));
}

/* ---------- LESSON ---------- */
function lesson(){
  const l=L.find(x=>x.id===S.les);
  app.innerHTML=`<button class="back">→ رجوع</button><h2>${l.ic} ${l.t} <span class="ex">${E(l.en)}</span></h2>
  <div class="tabs">${[["cards","🖼️ بطاقات"],["video","🎬 فيديو"],["quiz","🎯 اختبار"]].map(([k,n])=>`<button data-t="${k}" class="${S.tab===k?"on":""}">${n}</button>`).join("")}</div><div id="body"></div>`;
  $(".back").onclick=()=>go("lessons");
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{stopVideo();S.tab=b.dataset.t;S.card=0;lesson()});
  ({cards:cardsTab,video:videoTab,quiz:quizTab})[S.tab](l);
}
function cardsTab(l){
  const w=l.w[S.card];
  $("#body").innerHTML=`<div class="flash" id="fl"><div class="in">
    <div class="face f"><div class="big">${w[2]}</div><div class="w">${E(w[0])}</div><div class="ex">اضغط لرؤية المعنى 👆</div></div>
    <div class="face b"><div class="ar">${esc(w[1])}</div><div class="w" style="font-size:24px">${E(w[0])}</div><div class="ex">${E(w[3])}</div><div class="ar" style="font-size:16px">${esc(w[4])}</div></div></div></div>
  <div class="row"><button class="btn sec" id="pv" ${S.card?"":"disabled"}>▶ السابق</button><button class="spk" id="sp">🔊</button><button class="spk" id="sx" title="الجملة">💬</button><button class="btn" id="nx">${S.card<l.w.length-1?"التالي ◀":"أنهيت ✔"}</button></div>

  <div class="card" style="margin-top:12px"><b>🎥 فيديوهات حقيقية للمزيد:</b><div class="vid-links">
   <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent("learn English "+l.en+" lesson")}">▶ ${esc(l.t)} على يوتيوب</a>
   <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent("تعلم الانجليزية "+l.t+" بالدارجة")}">▶ شرح بالعربية</a></div></div>`;
  $("#fl").onclick=()=>{$("#fl").classList.toggle("flip");if($("#fl").classList.contains("flip"))say(w[0])};
  $("#sp").onclick=()=>say(w[0],{rate:.75});$("#sx").onclick=()=>say(w[3]);
  $("#pv").onclick=()=>{S.card--;cardsTab(l)};
  $("#nx").onclick=()=>{if(S.card<l.w.length-1){S.card++;cardsTab(l);addXP(2)}else{addXP(10);S.tab="video";lesson()}};

/* ---- animated video ---- */
let vtoken=0;
function stopVideo(){vtoken++;try{speechSynthesis.cancel()}catch(e){}try{if(window.AndroidTTS)AndroidTTS.stop()}catch(e){}}
function videoTab(l){
  const flo=l.w.map((w,i)=>`<span style="left:${(i*17+6)%90}%;top:${(i*23+8)%50}%;animation-delay:${i*.7}s">${w[2]}</span>`).join("");
  $("#body").innerHTML=`<div class="stage" style="background:linear-gradient(160deg,${l.g[0]},${l.g[1]})">
    <div class="floaters">${flo}</div>
    <div class="chars">${l.chars.map((c,i)=>`<div class="ch" id="ch${i}">${c}<small>${esc(l.names[i])}</small></div>`).join("")}</div>
    <div class="sub"><div class="e" id="se">▶ اضغط تشغيل لمشاهدة الحوار</div><div class="a" id="sa"></div></div><div class="prog"><i id="pg"></i></div></div>
  <div class="ctl"><button class="btn" id="pl">▶ تشغيل</button><button class="btn sec" id="sl">🐢 بطيء</button><button class="btn sec" id="nx2">إلى الاختبار 🎯</button></div>
  <div class="note">🎬 حوار متحرّك بصوت إنجليزي مع الترجمة بالدارجة. يعمل الصوت حسب متصفحك.</div>`;
  let slow=false;
  $("#sl").onclick=()=>{slow=!slow;$("#sl").textContent=slow?"🐇 عادي":"🐢 بطيء"};
  $("#nx2").onclick=()=>{S.tab="quiz";lesson()};
  $("#pl").onclick=async()=>{
    stopVideo();const my=vtoken;$("#pl").textContent="🔁 إعادة";
    for(let i=0;i<l.d.length;i++){
      if(my!==vtoken)return;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function quizTab(l){
  const all=L.flatMap(x=>x.w);
  const qs=shuffle(l.w).flatMap((w,i)=>{
    const t=i%3;
    const pool=(k,n)=>shuffle(all.filter(x=>x[k]!==w[k])).slice(0,n).map(x=>x[k]);
    if(t===0)return[{p:`<div class="big" style="font-size:90px">${w[2]}</div><div class="q">ماذا تعني هذه الصورة بالإنجليزية؟</div>`,a:w[0],o:shuffle([w[0],...pool(0,3)]),en:true}];
    if(t===1)return[{p:`<div class="q">ما معنى ${E(w[0])} بالدارجة؟</div>`,a:w[1],o:shuffle([w[1],...pool(1,3)]),en:false}];
    return[{p:`<div class="q">🔊 استمع واختر الكلمة الصحيحة</div><div class="row"><button class="spk" id="ql">🔊</button></div>`,a:w[0],o:shuffle([w[0],...pool(0,3)]),en:true,say:w[0]}];
  });
  let i=0,score=0;
  const show=()=>{
    if(i>=qs.length){const ok=score>=qs.length*0.6;if(ok){S.done[l.id]=1;addXP(score*5+20)}save();head();
      $("#body").innerHTML=`<div class="card win"><div class="big">${ok?"🏆":"💪"}</div><h2>${score} / ${qs.length}</h2><div>${ok?"ممتاز! أنهيت الدرس وربحت نقاط ⭐":"قريب! راجع البطاقات وجرّب من جديد"}</div><div class="row" style="margin-top:14px"><button class="btn sec" id="rt">🔁 أعد</button><button class="btn" id="bk">القائمة</button></div></div>`;
      $("#rt").onclick=()=>quizTab(l);$("#bk").onclick=()=>go("lessons");return}
    const q=qs[i];
    $("#body").innerHTML=`<div class="card"><div class="ex" style="text-align:center">السؤال ${i+1} / ${qs.length}</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>${q.p}<div class="opts">${q.o.map(o=>`<button class="opt">${q.en?E(o):esc(o)}</button>`).join("")}</div></div>`;
    if(q.say){say(q.say);$("#ql").onclick=()=>say(q.say,{rate:.7})}
    app.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>{
      const good=q.o[k]===q.a;sfx(good);if(good)score++;
      app.querySelectorAll(".opt").forEach((x,m)=>{x.disabled=true;if(q.o[m]===q.a)x.classList.add("ok")});
      if(!good)b.classList.add("no");
      setTimeout(()=>{i++;show()},good?700:1400);
    });
  };
  show();
}

async function gemini(hist,maxTok,onText){
  const a=AI.get(),model=a.model||"gemini-flash-latest";
  const h=hist.length>14?[hist[0],...hist.slice(-12)]:hist;
  const contents=h.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
  const url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":streamGenerateContent?alt=sse";
  async function go(think){
    const gc={temperature:.8,maxOutputTokens:maxTok||700};if(think)gc.thinkingConfig={thinkingBudget:0};
    const ac=new AbortController();let tm=setTimeout(()=>ac.abort(),25000);
    let r;
    try{r=await fetch(url,{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json","x-goog-api-key":a.key},body:JSON.stringify({contents,generationConfig:gc})})}
    catch(e){clearTimeout(tm);throw{code:"net"}}
    if(!r.ok){clearTimeout(tm);let m="";try{m=(await r.json()).error.message}catch(e){}throw{code:r.status===429?"quota":(r.status===400||r.status===403)?"key":r.status===404?"model":"http",msg:m,st:r.status}}
    let txt="";
    const feed=l=>{l=l.trim();if(l.indexOf("data:")!==0)return;try{const j=JSON.parse(l.slice(5));const ps=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;if(ps){txt+=ps.map(x=>x.text||"").join("");if(onText)onText(txt)}}catch(e){}};
    try{
      if(r.body&&r.body.getReader){const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
        for(;;){const{done,value}=await rd.read();if(done)break;tm&&clearTimeout(tm);tm=setTimeout(()=>ac.abort(),25000);buf+=dec.decode(value,{stream:true});const ls=buf.split("\n");buf=ls.pop();ls.forEach(feed)}
        feed(buf)}
      else{(await r.text()).split("\n").forEach(feed)}
    }catch(e){if(!txt){clearTimeout(tm);throw{code:"net"}}}
    clearTimeout(tm);
    if(!txt)throw{code:"empty"};return txt;
  }
  try{return await go(true)}
  catch(e){if(e.st===400&&/think/i.test(e.msg||""))return await go(false);throw e}
}

function addBotP(en,ar){const d=document.createElement("div");d.className="msg bot";d.innerHTML=botHTML({en,ar,fix:"",sug:[]})+`<br><button class="spk" style="width:36px;height:36px;font-size:15px;margin-top:6px">🔊</button>`;d.querySelector(".spk").onclick=()=>say(en,{rate:.85});$("#cb").appendChild(d);$("#cb").scrollTop=1e9;return d}
function startScript(){
  C.started=true;C.script=CS[C.sc][tierOf()];C.turn=0;C.score=0;C.reveal=false;C.busy=false;C.done=false;
  $("#cb").innerHTML="";const m=$("#ms");if(m){m.classList.remove("won");m.textContent="🎯 المهمة: "+sc()[3]}
  const hint=["المستوى الأساسي: اختر الرد الصحيح أو اكتبه بنفسك.","المستوى المتوسط: ردود أطول وأكثر تهذيبا، اختر الأنسب أو اكتبه.","المستوى المتقدم: اكتب ردك بنفسك بأسلوب راقٍ، وزر 💡 يُظهر الخيارات عند الحاجة."][tierOf()];
  const i=document.createElement("div");i.className="msg bot";i.innerHTML=`<span class="a" style="font-size:14px">ℹ️ ${hint}</span>`;$("#cb").appendChild(i);
  botTurn();
}
function botTurn(){const t=C.script[C.turn];addBotP(t[0],t[1]);say(t[0],{rate:.85});C.reveal=false;showOpts()}
function showOpts(){
  const sg=$("#sg");if(!sg)return;const t=C.script[C.turn];sg.classList.add("w");
  if(tierOf()===2&&!C.reveal){sg.innerHTML=`<button class="chip">💡 أظهر الخيارات</button>`;sg.firstChild.onclick=()=>{C.reveal=true;showOpts()};return}
  C.opts=shuffle(t[2].map(o=>o[0]));
  sg.innerHTML=C.opts.map(o=>`<button class="chip">${E(o)}</button>`).join("");
  sg.querySelectorAll(".chip").forEach((b,i)=>b.onclick=()=>scriptReply(C.opts[i]));
}
async function scriptReply(text){
  if(C.busy||!C.script)return;text=(text||"").trim();if(!text)return;C.busy=true;
  const t=C.script[C.turn],best=t[2].find(o=>o[1]===2)[0];
  addMsg("user",text);const inp=$("#ci");if(inp)inp.value="";const sg=$("#sg");if(sg)sg.innerHTML="";
  let s;const ex=t[2].find(o=>o[0]===text);
  if(ex)s=ex[1];else{const b=norm(best),a=norm(text);const pct=a.length?lcsMarks(a,b).filter(Boolean).length/b.length:0;s=pct>=.8?2:pct>=.5?1:0}
  C.score+=s;sfx(s===2);
  const fb=s===2?"✅ ممتاز!":s===1?"👍 مقبول، لكن الأفضل أن تقول:":"❌ الأفضل أن تقول:";
  const f=document.createElement("div");f.className="msg bot";
  f.innerHTML=`<span class="a" style="font-size:15px;color:#111">${fb}</span>`+(s<2?`<span class="e">${esc(best)}</span>`:"")+`<span class="f">💡 ${esc(t[3])}</span>`;
  $("#cb").appendChild(f);$("#cb").scrollTop=1e9;
  await say(s===2?text:best,{rate:.85});
  C.turn++;
  if(C.turn>=C.script.length){finishScript()}else{await new Promise(r=>setTimeout(r,400));botTurn()}
  C.busy=false;
}
function finishScript(){
  const total=C.script.length*2,pct=C.score/total,stars=pct>=.8?"⭐⭐⭐":pct>=.5?"⭐⭐":"⭐";
  const d=document.createElement("div");d.className="msg bot";
  d.innerHTML=`<span class="a" style="font-size:16px;color:#111">🏁 انتهى الحوار! نتيجتك ${C.score}/${total} ${stars}</span><br><button class="btn sec" id="rp" style="margin-top:8px">🔁 أعد الحوار</button>`;
  $("#cb").appendChild(d);$("#cb").scrollTop=1e9;const sg=$("#sg");if(sg)sg.innerHTML="";
  $("#rp").onclick=()=>startScript();
  addXP(C.score);
  if(pct>=.6&&!C.done){C.done=true;addXP(15);const m=$("#ms");if(m){m.textContent="🎉 أحسنت! أنجزت المهمة (+15 نقطة)";m.classList.add("won")}}
}

 q:[["How often does a language disappear?",["Every day","Every two weeks","Every year"],1],["Which language is given as a revival example?",["Latin","Welsh","Hebrew"],1],["What remains uncertain?",["Whether Welsh will vanish","Whether revivals can scale globally","Whether linguists exist"],1]]},
{id:"s15",lv:"C1",t:"A Case for Slowness",ar:"في مدح البطء",ic:"🐢",
 s:[["In an age obsessed with speed, deliberately slowing down has become almost a radical act.","في عصر مهووس بالسرعة، التباطؤ عمدا صار شبه فعل ثوري."],["Proponents of the 'slow movement' contend that rushing erodes both quality and well-being.","أنصار حركة البطء يرون أن الاستعجال يضعف الجودة والعافية."],["A growing body of research indicates that deep concentration requires uninterrupted stretches of time.","مجموعة متنامية من الأبحاث تشير أن التركيز العميق يتطلب فترات متواصلة."],["Yet critics point out that few people can afford to disconnect, particularly those in precarious jobs.","لكن النقاد يشيرون أن قلة من الناس يقدرو ينقطعو، خاصة أصحاب الوظائف الهشة."],["Perhaps the truth lies somewhere in between: efficiency without frenzy.","ربما الحقيقة في الوسط: كفاءة بدون هوس."],["The challenge, as ever, is to apply that principle consistently.","التحدي، كالعادة، هو تطبيق هذا المبدأ باستمرار."]],
 g:{obsessed:"مهووس",proponents:"أنصار",erodes:"يضعف",precarious:"هشّ",frenzy:"هوس",consistently:"باستمرار"},
 q:[["What do proponents of the slow movement claim?",["Rushing erodes quality and well-being","Speed is always good","Work is useless"],0],["What do critics point out?",["Few can afford to disconnect","Everyone is slow","The research is wrong"],0],["What compromise is suggested?",["Efficiency without frenzy","Total silence","More meetings"],0]]},

{id:"a1",lv:"B2",t:"Why We Sleep",ar:"لماذا ننام",ic:"😴",
 s:[["Sleep is often treated as a luxury, yet scientists increasingly regard it as a biological necessity.","يُعامَل النوم كترف، بينما العلماء يعتبرونه ضرورة بيولوجية."],["During deep sleep, the brain consolidates memories and clears toxic waste accumulated during the day.","في النوم العميق، الدماغ يثبّت الذكريات وينظّف السموم المتراكمة في النهار."],["Adults need between seven and nine hours a night, though individual requirements vary.","البالغون يحتاجو بين 7 و9 ساعات في الليل، رغم اختلاف الاحتياجات."],["Chronic sleep deprivation has been linked to obesity, heart disease and depression.","الحرمان المزمن من النوم مرتبط بالسمنة وأمراض القلب والاكتئاب."],["Surprisingly, even a single sleepless night can impair concentration as much as alcohol.","والمدهش أن ليلة واحدة بلا نوم تُضعف التركيز مثل الكحول."],["Smartphones are a major culprit because their blue light suppresses the hormone that induces sleep.","الهواتف سبب رئيسي لأن ضوءها الأزرق يثبّط هرمون النوم."],["Experts therefore advise switching off screens an hour before bedtime.","لذلك ينصح الخبراء بإطفاء الشاشات قبل النوم بساعة."],["Keeping a regular schedule, even at weekends, also helps the body clock stay stable.","الحفاظ على جدول منتظم، حتى في العطلة، يساعد الساعة البيولوجية على الاستقرار."],["In short, prioritising sleep is one of the simplest investments we can make in our health.","باختصار، إعطاء النوم الأولوية من أبسط الاستثمارات في صحتنا."]],
 g:{consolidates:"يثبّت",chronic:"مزمن",deprivation:"حرمان",impair:"يُضعف",culprit:"المتسبب",prioritising:"إعطاء الأولوية"},
 q:[["How much sleep do adults generally need?",["Four to five hours","Seven to nine hours","Ten to twelve hours"],1],["What does deep sleep do for the brain?",["Raises blood pressure","Burns fat","Consolidates memories and clears waste"],2],["Why are smartphones a culprit?",["They are noisy","Blue light suppresses the sleep hormone","They are heavy"],1],["What do experts advise?",["Drink coffee at night","Sleep during the day","Switch off screens an hour before bed"],2]]},
{id:"a2",lv:"B2",t:"The Rise of Electric Cars",ar:"صعود السيارات الكهربائية",ic:"🚗",
 s:[["Not long ago, electric cars were regarded as a niche product for enthusiasts.","ما بعيد، السيارات الكهربائية كانت منتجا هامشيا لعشاقها."],["Today, falling battery prices and stricter emission rules are driving a rapid change.","اليوم، انخفاض أسعار البطاريات وتشديد قواعد الانبعاثات يدفعان لتغيير سريع."],["Several countries have announced that they will ban the sale of new petrol cars within two decades.","عدة دول أعلنت أنها ستمنع بيع سيارات البنزين الجديدة خلال عقدين."],["Proponents emphasise that electric vehicles produce no exhaust fumes and are cheaper to run.","المؤيدون يؤكدون أنها لا تنتج عوادم وأن تشغيلها أرخص."],["However, critics highlight the environmental cost of mining lithium and the shortage of charging stations.","بصح النقاد يبرزون التكلفة البيئية لتعدين الليثيوم ونقص محطات الشحن."],["Moreover, the electricity itself may come from polluting power plants, which undermines the benefits.","علاوة على ذلك، الكهرباء قد تأتي من محطات ملوِّثة، وهذا يقوّض الفوائد."],["Even so, studies show that over their lifetime, electric cars generally emit far less carbon.","ومع ذلك، الدراسات تبيّن أنها على مدى عمرها تُصدر كربونا أقل بكثير."],["The decisive factor will be how quickly grids switch to renewable sources.","العامل الحاسم هو سرعة تحوّل الشبكات إلى مصادر متجددة."],["If that happens, the transition could prove to be a turning point for the climate.","إذا حدث ذلك، قد يكون الانتقال نقطة تحوّل للمناخ."]],
 g:{niche:"هامشي",emission:"انبعاث",proponents:"المؤيدون",undermines:"يقوّض",decisive:"حاسم",grids:"الشبكات"},
 q:[["What is driving the change?",["Cheaper petrol","Falling battery prices and stricter rules","Fewer roads"],1],["What is one criticism of electric cars?",["They look odd","They are too fast","Lithium mining harms the environment"],2],["What do studies say about lifetime emissions?",["Electric cars emit far less carbon","They emit more","There is no difference"],0],["What is the decisive factor?",["Tyre prices","Car colours","How quickly grids switch to renewables"],2]]},
{id:"a3",lv:"B2",t:"Cities of the Future",ar:"مدن المستقبل",ic:"🏙️",
 s:[["By 2050, nearly seventy per cent of the world's population is expected to live in cities.","بحلول 2050، يُتوقع أن يعيش قرابة 70% من سكان العالم في المدن."],["This unprecedented urbanisation puts enormous pressure on housing, transport and public services.","هذا التحضّر غير المسبوق يضغط على السكن والنقل والخدمات العامة."],["Planners are therefore experimenting with 'smart city' technologies that monitor traffic and energy use in real time.","لذلك المخططون يجرّبون تقنيات المدينة الذكية التي ترصد المرور والطاقة آنيا."],["Some cities have introduced congestion charges to discourage cars from entering the centre.","بعض المدن فرضت رسوم ازدحام لمنع السيارات من دخول المركز."],["Others are creating green rooftops and parks to reduce heat and improve air quality.","وأخرى تنشئ أسطحا خضراء وحدائق لخفض الحرارة وتحسين جودة الهواء."],["Nevertheless, critics warn that data-driven cities may compromise residents' privacy.","ومع ذلك، يحذّر النقاد من أن المدن المعتمدة على البيانات قد تمسّ بخصوصية السكان."],["There is also the risk that affordable housing will remain out of reach for ordinary families.","وهناك خطر أن يبقى السكن بأسعار معقولة بعيد المنال عن العائلات العادية."],["Ultimately, a successful city is not defined by its technology alone, but by how inclusive it is.","في النهاية، المدينة الناجحة لا تُعرَّف بتقنيتها فقط بل بمدى شمولها."],["Citizens must therefore have a voice in shaping the places where they live.","لذلك يجب أن يكون للمواطنين صوت في تشكيل أماكن عيشهم."]],
 g:{unprecedented:"غير مسبوق",urbanisation:"التحضّر",congestion:"ازدحام",compromise:"يمسّ / يضرّ",affordable:"بأسعار معقولة",inclusive:"شامل"},
 q:[["What share of people will live in cities by 2050?",["About thirty per cent","About fifty per cent","About seventy per cent"],2],["What do congestion charges do?",["Build parks","Lower rents","Discourage cars from entering the centre"],2],["What privacy concern is raised?",["Cameras are broken","Data-driven cities may compromise privacy","Cities are too quiet"],1],["What defines a successful city?",["Technology alone","How inclusive it is","Its size"],1]]},
{id:"a4",lv:"C1",t:"The Ethics of Gene Editing",ar:"أخلاقيات التعديل الجيني",ic:"🧬",
 s:[["The advent of CRISPR has placed the power to rewrite DNA within the reach of ordinary laboratories.","ظهور كريسبر وضع قدرة إعادة كتابة الحمض النووي في متناول المخابر العادية."],["Proponents envisage a future in which hereditary diseases such as cystic fibrosis are eradicated before birth.","المؤيدون يتصورون مستقبلا تُستأصل فيه الأمراض الوراثية قبل الولادة."],["Yet the same technology could, in principle, be used to select traits like height or intelligence.","غير أن نفس التقنية يمكن مبدئيا استعمالها لاختيار صفات كالطول والذكاء."],["Ethicists caution that this could entrench inequality, since only the wealthy might afford such enhancements.","علماء الأخلاق يحذّرون من أن هذا قد يرسّخ اللامساواة، لأن الأثرياء فقط قد يتحمّلون التحسينات."],["Moreover, alterations to the germline are inheritable, which means that mistakes would be passed on to future generations.","علاوة على ذلك، تعديلات الخلايا الجنسية وراثية، أي أن الأخطاء تنتقل للأجيال القادمة."],["In 2018, the announcement that gene-edited babies had been born prompted worldwide condemnation.","في 2018، إعلان ولادة أطفال معدّلين وراثيا أثار إدانة عالمية."],["Consequently, many scientists now call for a moratorium on heritable editing until robust safeguards exist.","وبالتالي، يدعو علماء كثر إلى وقف مؤقت للتعديل الوراثي حتى توجد ضمانات قوية."],["Whether regulation can keep pace with innovation remains a matter of intense debate.","هل يمكن للتنظيم مواكبة الابتكار يبقى موضع جدل شديد."],["What is certain is that society, not scientists alone, must decide how far to go.","الأكيد أن المجتمع، وليس العلماء وحدهم، هو من يقرّر إلى أي مدى نذهب."]],
 g:{advent:"ظهور",hereditary:"وراثي",eradicated:"مُستأصَل",entrench:"يرسّخ",moratorium:"وقف مؤقت",safeguards:"ضمانات"},
 q:[["What do proponents hope for?",["To make people taller only","To eradicate hereditary diseases","To end all research"],1],["Why do ethicists worry?",["It is too cheap","It is too slow","It could entrench inequality"],2],["Why are germline edits especially risky?",["They are painless","Mistakes pass to future generations","They are temporary"],1],["What do many scientists now call for?",["Unlimited use","Immediate commercialisation","A moratorium on heritable editing"],2]]},
{id:"a5",lv:"C1",t:"Globalisation: Winners and Losers",ar:"العولمة: رابحون وخاسرون",ic:"🌐",
 s:[["Globalisation has lifted hundreds of millions out of poverty, particularly in East Asia.","العولمة انتشلت مئات الملايين من الفقر، خاصة في شرق آسيا."],["Consumers in wealthy countries have benefited from cheaper goods and a wider variety of products.","المستهلكون في الدول الغنية استفادوا من سلع أرخص وتنوّع أوسع."],["However, the gains have been distributed unevenly, both between and within countries.","غير أن المكاسب وُزّعت بشكل غير متساوٍ بين الدول وداخلها."],["In many industrial regions, factory closures have left communities with chronic unemployment and a sense of abandonment.","في مناطق صناعية كثيرة، غلق المصانع ترك مجتمعات بالبطالة المزمنة وشعور بالإهمال."],["This resentment has fuelled the rise of populist movements promising to restore protection.","هذا الاستياء غذّى صعود حركات شعبوية تعد بإعادة الحماية."],["Economists counter that tariffs often raise prices and invite retaliation, harming the very workers they aim to protect.","الاقتصاديون يردّون بأن الرسوم الجمركية ترفع الأسعار وتستجلب الرد بالمثل، فتضر بالعمال أنفسهم."],["A more constructive approach, they argue, would combine open trade with generous retraining and social support.","نهج أكثر بناءً، يقولون، يجمع التجارة المفتوحة مع إعادة تأهيل وإسناد اجتماعي سخي."],["The pandemic exposed the fragility of long supply chains, prompting firms to diversify their sources.","الجائحة كشفت هشاشة سلاسل الإمداد الطويلة، فدفعت الشركات لتنويع مصادرها."],["Globalisation is thus not ending, but evolving into something more resilient and, perhaps, more equitable.","العولمة إذن لا تنتهي بل تتطور إلى شيء أكثر صمودا وربما أكثر إنصافا."]],
 g:{unevenly:"بشكل غير متساوٍ",abandonment:"إهمال",resentment:"استياء",tariffs:"رسوم جمركية",fragility:"هشاشة",resilient:"صامد"},
 q:[["Who benefited from globalisation?",["Only the rich","Nobody","Hundreds of millions left poverty and consumers got cheaper goods"],2],["What happened in many industrial regions?",["New factories opened","Factory closures caused unemployment","Wages tripled"],1],["What do economists say about tariffs?",["They always help workers","They are free","They often raise prices and invite retaliation"],2],["What did the pandemic reveal?",["Cheap shipping","Unlimited stocks","The fragility of long supply chains"],2]]},
{id:"a6",lv:"C1",t:"The Science of Habit",ar:"علم العادة",ic:"🔁",
 s:[["Roughly forty per cent of our daily actions are performed not by conscious decision but by habit.","حوالي 40% من أفعالنا اليومية تتم بالعادة لا بقرار واعٍ."],["Researchers describe a three-step loop: a cue triggers a routine, which delivers a reward.","الباحثون يصفون حلقة من ثلاث خطوات: إشارة تحفّز روتينا يمنح مكافأة."],["Over time, the brain automates the sequence, freeing mental energy for other tasks.","مع الوقت، الدماغ يؤتمت التسلسل، محرّرا طاقة ذهنية لمهام أخرى."],["This efficiency, however, is a double-edged sword, since harmful habits become just as entrenched.","هذه الكفاءة سيف ذو حدّين، لأن العادات الضارة تترسّخ بالقدر نفسه."],["Contrary to popular belief, there is no magic number of days after which a habit forms.","خلافا للاعتقاد الشائع، لا يوجد رقم سحري من الأيام لتكوين العادة."],["One study found that the process ranged from eighteen to two hundred and fifty-four days.","دراسة وجدت أن المدة تراوحت بين 18 و254 يوما."],["Rather than relying on willpower, experts recommend redesigning one's environment to make good behaviour effortless.","بدل الاعتماد على قوة الإرادة، ينصح الخبراء بإعادة تصميم البيئة لجعل السلوك الجيد بلا جهد."],["Linking a new habit to an existing one, such as stretching after brushing teeth, markedly improves success.","ربط عادة جديدة بعادة قائمة، كالتمطّط بعد تنظيف الأسنان، يحسّن النجاح بشكل ملحوظ."],["Small, consistent steps, in other words, outperform heroic but short-lived efforts.","الخطوات الصغيرة المنتظمة، بعبارة أخرى، تتفوّق على الجهود البطولية قصيرة العمر."]],
 g:{cue:"إشارة",automates:"يؤتمت",entrenched:"راسخ",willpower:"قوة الإرادة",effortless:"بلا جهد",outperform:"يتفوّق على"},
 q:[["What are the parts of the habit loop?",["Wish, plan, fail","Cue, routine, reward","Rest, work, sleep"],1],["How long does a habit take to form?",["Exactly twenty-one days","One week","It varies widely"],2],["Why is automation a 'double-edged sword'?",["It uses more energy","Harmful habits also become entrenched","It is illegal"],1],["What do experts recommend?",["Rely on willpower","Avoid routines","Redesign your environment"],2]]},

{id:"d9",lv:"C1",t:"Radio Interview: AI & Jobs",ar:"حوار إذاعي: الذكاء الاصطناعي والوظائف",ic:"🎙️",d:["Host","Expert"],

{id:"s22",lv:"B2",t:"The Rise of Online Shopping",ar:"صعود التسوق الإلكتروني",ic:"🛒",
 s:[["Over the past decade, online shopping has transformed the way we buy almost everything.","خلال العقد الماضي، التسوق الإلكتروني غيّر طريقة شرائنا لكل شيء تقريبا."],["Consumers can now compare prices in seconds and have products delivered to their doorstep.","المستهلكون يقدرو الآن يقارنو الأسعار في ثواني ويوصلولهم المنتجات لباب الدار."],["This convenience, however, has come at a cost for small local shops.","هذه الراحة، مع ذلك، كان لها ثمن على المحلات الصغيرة."],["Many of them struggle to compete with giant platforms that offer lower prices.","كثير منها يكافح للمنافسة مع منصات عملاقة بأسعار أقل."],["Furthermore, the packaging and delivery involved generate a considerable amount of waste.","علاوة على ذلك، التغليف والتوصيل ينتجان كمية كبيرة من النفايات."],["Some governments are therefore encouraging customers to choose slower, greener delivery options.","لذلك بعض الحكومات تشجّع الزبائن على خيارات توصيل أبطأ وأخضر."],["In the end, wise consumers weigh up both convenience and consequences before clicking 'buy'.","في النهاية، المستهلك الحكيم يوازن بين الراحة والعواقب قبل الضغط على شراء."]],
 g:{transformed:"غيّر",doorstep:"عتبة الباب",convenience:"الراحة",compete:"ينافس",packaging:"التغليف",consequences:"العواقب"},

{id:"s23",lv:"B2",t:"A Lesson in Failure",ar:"درس في الفشل",ic:"💡",
 s:[["When Amira failed her driving test for the third time, she nearly gave up.","كي أميرة رسبت في امتحان السياقة للمرة الثالثة، كادت تستسلم."],["Her instructor, however, told her something she has never forgotten.","المدرب، مع ذلك، قال لها شيئا ما نستوش."],["'Failure is only feedback,' he said, 'and feedback is how experts are made.'","قال: الفشل مجرد ملاحظات، والملاحظات هي كيف يُصنع الخبراء."],["Encouraged, she analysed her mistakes and practised the difficult manoeuvres daily.","متشجعة، حللت أخطاءها وتدربت على المناورات الصعبة يوميا."],["Two months later, she passed with only one minor error.","بعد شهرين، نجحت بخطأ بسيط واحد فقط."],["She now believes that persistence matters more than natural talent.","هي تؤمن الآن أن المثابرة أهم من الموهبة الفطرية."],["Whenever she meets discouraged learners, she shares her story.","كل ما تلقى متعلمين محبطين، تشارك قصتها."]],
 g:{instructor:"المدرّب",feedback:"ملاحظات",analysed:"حلّلت",manoeuvres:"مناورات",persistence:"المثابرة",discouraged:"محبَط"},
 q:[["How many times did Amira fail the test?",["Once","Twice","Three times"],2],["What did the instructor say?",["Failure is only feedback","Give up","Try another test"],0],["What does she believe now?",["Persistence matters more than talent","Talent is everything","Luck decides"],0]]},
{id:"s24",lv:"C1",t:"The Attention Economy",ar:"اقتصاد الانتباه",ic:"📲",
 s:[["In the digital age, human attention has become the scarcest and most valuable commodity.","في العصر الرقمي، صار الانتباه البشري أندر سلعة وأثمنها."],["Platforms compete fiercely to capture it, deploying algorithms refined to exploit our psychological vulnerabilities.","المنصات تتنافس بشراسة لالتقاطه، بخوارزميات مصقولة لاستغلال نقاط ضعفنا النفسية."],["Notifications, infinite scrolling and autoplay are engineered to keep us engaged far beyond our intentions.","الإشعارات والتمرير اللانهائي والتشغيل التلقائي مصممة لتبقينا منشغلين أكثر من نيتنا."],["The consequence, critics argue, is a fragmented mind, ill-suited to deep reading or sustained reflection.","النتيجة، يقول النقاد، عقل مشتت لا يصلح للقراءة العميقة أو التأمل المستمر."],["Defenders counter that technology merely amplifies pre-existing human tendencies rather than creating them.","المدافعون يردون أن التقنية تضخّم الميول القائمة ولا تخلقها."],["Whatever the truth, a growing movement advocates 'digital minimalism', urging people to reclaim their attention deliberately.","أيا كانت الحقيقة، حركة متنامية تدعو إلى «الحد الأدنى الرقمي»، وتحث الناس على استعادة انتباههم عمدا."],["Ultimately, the question is not whether we use technology, but who is in control.","في النهاية، السؤال ليس هل نستعمل التقنية، بل من يتحكم."]],
 g:{scarcest:"الأندر",algorithms:"خوارزميات",vulnerabilities:"نقاط الضعف",fragmented:"مشتت",amplifies:"تضخّم",minimalism:"الحد الأدنى"},
 q:[["Why is attention valuable?",["It is the scarcest commodity","It is free","It is useless"],0],["What do defenders claim?",["Technology amplifies existing tendencies","Technology is evil","Nothing matters"],0],["What is the key question?",["Who is in control","How fast is Wi-Fi","Which app is best"],0]]},
{id:"s25",lv:"C1",t:"Mother Tongue and Identity",ar:"اللغة الأم والهوية",ic:"🌍",
 s:[["For millions of people, language is far more than a tool for communication; it is the vessel of identity.","لملايين الناس، اللغة أكثر بكثير من أداة تواصل؛ هي وعاء الهوية."],["Immigrants often describe an unsettling tension between assimilating into a new society and preserving their ancestral tongue.","المهاجرون يصفون غالبا توترا مقلقا بين الاندماج في مجتمع جديد والحفاظ على لغة الأجداد."],["Research indicates that children who grow up bilingual enjoy cognitive advantages, such as enhanced flexibility in problem-solving.","الأبحاث تشير أن الأطفال ثنائيي اللغة لهم مزايا معرفية مثل مرونة أكبر في حل المشكلات."],["Nevertheless, they may encounter prejudice if their accent or vocabulary deviates from the dominant norm.","ومع ذلك قد يواجهون تحيزا إذا انحرفت لهجتهم أو مفرداتهم عن المعيار السائد."],["Dialects, long dismissed as corrupted forms of standard languages, are now recognised by linguists as rich and legitimate systems.","اللهجات التي طالما اعتُبرت صيغا فاسدة من الفصحى صارت اليوم يعترف بها اللغويون كأنظمة غنية ومشروعة."],["Consequently, many educators advocate celebrating linguistic diversity rather than suppressing it.","وبالتالي يدعو كثير من المربين للاحتفاء بالتنوع اللغوي بدل قمعه."],["To lose a language, then, is to lose a unique way of seeing the world.","إذن، فقدان لغة هو فقدان طريقة فريدة لرؤية العالم."]],
 g:{vessel:"وعاء",assimilating:"الاندماج",bilingual:"ثنائي اللغة",prejudice:"التحيز",dialects:"اللهجات",suppressing:"قمع"},

let SPEED=.9; const SPD=[[.7,"🐢 0.7×"],[.9,"⏱ 0.9×"],[1.05,"🐇 1.05×"]];
function gloss(st,w){const k=w.toLowerCase();for(const x of [k,k.replace(/s$/,""),k.replace(/es$/,""),k.replace(/ed$/,""),k.replace(/d$/,""),k.replace(/ing$/,""),k.replace(/ly$/,"")])if(st.g[x])return[x,st.g[x]];return null}
function words(t,st){return esc(t).replace(/[A-Za-z][A-Za-z'-]*/g,w=>{const g=gloss(st,w);return g?`<span class="wd gl" data-k="${g[0]}">${w}</span>`:w})}

function storyList(mode){
  const done=id=>S.stories[id]&&S.stories[id][mode==="listen"?"l":"r"];
  return LEVELS.map(l=>{const ss=ST.filter(s=>s.lv===l.id&&(mode==="listen"||!s.d));return `<h2>${l.ic} ${l.name} ${E(l.id)}</h2>`+ss.map(s=>`<div class="card les story-i" data-id="${s.id}"><div class="ic">${s.ic}</div><div><b>${E(s.t)}</b><div class="ex">${s.ar} · ${s.s.length} جمل${s.d?" · 💬 حوار":s.s.length>=9?" · 📰 مقال":""}</div></div><div class="done">${done(s.id)?"✅":mode==="listen"?"🎧":"📖"}</div></div>`).join("")}).join("");
}
function bindStories(mode){app.querySelectorAll(".story-i").forEach(e=>e.onclick=()=>go("story",{sid:e.dataset.id,mode}))}
function read(){
  app.innerHTML=`<div class="card"><h2>📖 قصص للقراءة</h2><div style="line-height:1.9">${ST.filter(s=>!s.d).length} قصة ومقالا مرتبة حسب المستوى. اضغط على <b>الكلمات المسطّرة</b> لمعناها وحفظها في دفترك، وعلى الجملة لترجمتها بالدارجة، ثم أجب عن أسئلة الفهم.</div></div>`+storyList("read");
  bindStories("read");
}
function listen(){
  app.innerHTML=`<div class="card"><h2>🎧 تدريب الاستماع</h2><div style="line-height:1.9">استمع بدون نص ثم أجب عن الأسئلة. اختر مستوى التمارين:</div><div class="chips" id="dl" style="margin-top:8px">${LEVELS.map(l=>`<button class="chip ${S.dl===l.id?"on":""}" data-v="${l.id}">${l.ic} ${l.id}</button>`).join("")}</div></div>
  <div class="grid2" style="margin-bottom:14px"><div class="card sc" id="d1"><div style="font-size:34px">✍️</div><b>إملاء</b><small>اسمع الجملة واكتبها</small></div><div class="card sc" id="d2"><div style="font-size:34px">🎯</div><b>اسمع واختر</b><small>اختر الترجمة الصحيحة</small></div></div>
  <h2>🎙️ حوارات وقصص ومقالات مسموعة</h2>`+storyList("listen");
  $("#dl").onclick=e=>{if(e.target.dataset.v){S.dl=e.target.dataset.v;save();listen()}};
  $("#d1").onclick=()=>go("drill",{drill:"dict"});$("#d2").onclick=()=>go("drill",{drill:"pick"});
  bindStories("listen");
}
function story(){
  const st=ST.find(x=>x.id===S.sid),ls=S.mode==="listen";const pitch=i=>st.d?(st.s[i][2]?1.3:.8):1;
  app.innerHTML=`<button class="back">→ رجوع</button>
  <div class="card" style="text-align:center"><div class="big" style="font-size:72px">${st.ic}</div><h2 style="margin:4px 0">${E(st.t)}</h2><div class="ex">${st.ar} · ${E(st.lv)}</div></div>
  <div class="ctl" style="margin:0 0 10px"><button class="btn" id="pa">▶ استمع للقصة</button><button class="btn sec" id="sp2">${SPD.find(x=>x[0]===SPEED)[1]}</button>${ls?'<button class="btn sec" id="rv">👁 أظهر النص</button>':'<button class="btn sec" id="ta">🇩🇿 كل الترجمة</button>'}</div>
  <div class="card ${ls?"hidetxt":""}" id="stx">${st.s.map((s,i)=>`<div class="sn" data-i="${i}">${st.d?`<div class="spkr">${st.s[i][2]?"🔵":"🟠"} ${esc(st.d[st.s[i][2]])}</div>`:""}<button class="sb" data-i="${i}">🔊</button><span class="txt">${words(s[0],st)}</span><div class="tr hide">${esc(s[1])}</div></div>`).join("")}</div>
  <div class="note" id="hn">${ls?"🎧 النص مخفي. استمع مرتين على الأقل ثم أجب عن الأسئلة.":"💡 اضغط على الكلمة المسطّرة لمعناها، وعلى الجملة لترجمتها."}</div>
  <h2 style="margin-top:14px">🎯 أسئلة الفهم</h2><div id="qz"></div><div class="pop hide" id="pop"></div>`;
  $(".back").onclick=()=>go(ls?"listen":"read");
  const sn=[...app.querySelectorAll(".sn")];
  $("#sp2").onclick=()=>{const i=(SPD.findIndex(x=>x[0]===SPEED)+1)%SPD.length;SPEED=SPD[i][0];$("#sp2").textContent=SPD[i][1]};
  $("#pa").onclick=async()=>{stopVideo();const my=vtoken;$("#pa").textContent="🔁 أعد الاستماع";
    for(let i=0;i<st.s.length;i++){if(my!==vtoken)return;sn.forEach((e,k)=>e.classList.toggle("hl",k===i));await say(st.s[i][0],{rate:SPEED,pitch:pitch(i)});if(my!==vtoken)return;await new Promise(r=>setTimeout(r,350))}
    sn.forEach(e=>e.classList.remove("hl"));heard=true};
  let heard=false;
  if(ls)$("#rv").onclick=()=>{$("#stx").classList.remove("hidetxt");$("#rv").remove()};
  else $("#ta").onclick=()=>sn.forEach(e=>e.querySelector(".tr").classList.toggle("hide"));
  $("#stx").onclick=e=>{
    const sb=e.target.closest(".sb");if(sb){stopVideo();say(st.s[+sb.dataset.i][0],{rate:SPEED,pitch:pitch(+sb.dataset.i)});return}
    const wd=e.target.closest(".gl");
    if(wd){const k=wd.dataset.k,ar=st.g[k],p=$("#pop");p.innerHTML=`<div style="flex:1"><b class="en">${esc(k)}</b> — ${esc(ar)}</div><button class="spk" id="pw">🔊</button><button class="btn" id="ps">＋ احفظ</button>`;p.classList.remove("hide");
      $("#pw").onclick=()=>say(k,{rate:.7});
      $("#ps").onclick=()=>{if(!S.saved.some(x=>x[0]===k)){S.saved.push([k,ar]);save();addXP(1)}$("#ps").textContent="✓ محفوظة"};return}
    $("#pop").classList.add("hide");
    if(ls&&$("#stx").classList.contains("hidetxt"))return;
    const s=e.target.closest(".sn");if(s)s.querySelector(".tr").classList.toggle("hide");
  };
  // quiz
  let ans=0,sc=0;
  $("#qz").innerHTML=st.q.map((q,i)=>`<div class="card" data-q="${i}"><div class="q" style="text-align:start">${i+1}. ${E(q[0])}</div>${shuffle(q[1].map((o,k)=>k)).map(k=>`<button class="opt" data-k="${k}" style="display:block;width:100%;margin-top:8px;direction:ltr">${esc(q[1][k])}</button>`).join("")}</div>`).join("")+`<div id="res"></div>`;
  $("#qz").querySelectorAll("[data-q]").forEach(c=>{const qi=+c.dataset.q;c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(c.dataset.d)return;c.dataset.d=1;ans++;const ok=+b.dataset.k===st.q[qi][2];sfx(ok);if(ok)sc++;
    c.querySelectorAll(".opt").forEach(x=>{if(+x.dataset.k===st.q[qi][2])x.classList.add("ok")});if(!ok)b.classList.add("no");
    if(ans===st.q.length){const pass=sc>=Math.ceil(st.q.length*.6);if(pass){S.stories[st.id]=S.stories[st.id]||{};const first=!S.stories[st.id][ls?"l":"r"];S.stories[st.id][ls?"l":"r"]=1;if(first)addXP(25)}save();
      $("#res").innerHTML=`<div class="card win"><div class="big">${pass?"🏆":"💪"}</div><h2>${sc} / ${st.q.length}</h2><div>${pass?"أحسنت! +25 نقطة":"حاول مرة أخرى بعد إعادة الاستماع"}</div>${ls?'<div class="note">يمكنك الآن إظهار النص ومراجعته.</div>':""}</div>`;
      if(ls)$("#stx").classList.remove("hidetxt");$("#res").scrollIntoView({behavior:"smooth"})}
  })});
}

/* ---- drills ---- */
function drillPool(){const i=LEVELS.findIndex(l=>l.id===S.dl);return L.filter(l=>{const k=LEVELS.findIndex(x=>x.id===l.lv);return k===i||k===i-1}).flatMap(l=>[...l.d.map(x=>[x[1],x[2]]),...l.w.map(w=>[w[3],w[4]])]).filter((x,k,a)=>a.findIndex(y=>y[0]===x[0])===k)}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean)}
function lcsMarks(a,b){const n=a.length,m=b.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);const mk=Array(m).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){mk[j]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return mk}
function drill(){
  const P=shuffle(drillPool()).slice(0,8),dict=S.drill==="dict";let i=0,sc=0,sp=.85;
  const wrap=h=>{app.innerHTML=`<button class="back">→ رجوع</button><h2>${dict?"✍️ إملاء":"🎯 اسمع واختر"} · ${E(S.dl)}</h2>`+h;$(".back").onclick=()=>{stopVideo();go("listen")}};
  const nxt=()=>{
    if(i>=P.length){const ok=sc>=P.length*.6;if(ok)addXP(sc*3+15);wrap(`<div class="card win"><div class="big">${ok?"🏆":"💪"}</div><h2>${sc} / ${P.length}</h2><div>${ok?"أحسنت! سمعك يتحسن 🎧":"كرّر التمرين وستتحسن"}</div><div class="row" style="margin-top:12px"><button class="btn" id="again">🔁 تمرين جديد</button></div></div>`);$("#again").onclick=()=>drill();return}
    const [en,ar]=P[i];
    const head=`<div class="card"><div class="ex" style="text-align:center">${i+1} / ${P.length}</div><div class="bar"><i style="width:${i/P.length*100}%"></i></div><div class="row" style="margin:14px 0"><button class="spk" id="pl" style="width:70px;height:70px;font-size:30px">🔊</button><button class="btn sec" id="sl">${sp<.8?"🐢 بطيء":"⏱ عادي"}</button></div>`;
    const play=()=>say(en,{rate:sp});
    if(dict){
      wrap(head+`<input id="ty" class="dctin" dir="ltr" placeholder="Type what you hear…" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row" style="margin-top:10px"><button class="btn sec" id="ht">💡 تلميح</button><button class="btn" id="ck">تحقق ✔</button></div><div id="fb" style="margin-top:10px;text-align:center"></div></div>`);
      $("#pl").onclick=play;$("#sl").onclick=()=>{sp=sp<.8?.95:.65;$("#sl").textContent=sp<.8?"🐢 بطيء":"⏱ عادي"};
      $("#ht").onclick=()=>{$("#fb").innerHTML=`<div class="ar" style="font-size:17px">${esc(ar)}</div>`};
      let checked=false;
      $("#ck").onclick=()=>{
        if(checked){i++;nxt();return}checked=true;
        const t=norm($("#ty").value),b=norm(en),mk=lcsMarks(t,b),pct=mk.filter(Boolean).length/b.length;if(pct>=.8)sc++;
        $("#fb").innerHTML=`<div class="en" style="font-size:19px;line-height:2">${b.map((w,k)=>`<span style="color:${mk[k]?"#16a34a":"#dc2626"};font-weight:700">${esc(w)}</span>`).join(" ")}</div><div class="ar" style="font-size:16px">${esc(ar)}</div><div>${pct>=.8?"✅ ممتاز":"❌ راجع الكلمات الحمراء"} (${Math.round(pct*100)}%)</div>`;
        $("#ck").textContent=i<P.length-1?"التالي ◀":"النتيجة";
      };
      setTimeout(play,300);
    }else{
      const opts=shuffle([ar,...shuffle(drillPool().filter(x=>x[1]!==ar)).slice(0,2).map(x=>x[1])]);
      wrap(head+`<div id="op">${opts.map(o=>`<button class="opt" style="display:block;width:100%;margin-top:8px">${esc(o)}</button>`).join("")}</div></div>`);
      $("#pl").onclick=play;$("#sl").onclick=()=>{sp=sp<.8?.95:.65;$("#sl").textContent=sp<.8?"🐢 بطيء":"⏱ عادي"};
      app.querySelectorAll("#op .opt").forEach(b=>b.onclick=()=>{const good=b.textContent===ar;sfx(good);if(good)sc++;app.querySelectorAll("#op .opt").forEach(x=>{x.disabled=true;if(x.textContent===ar)x.classList.add("ok")});if(!good)b.classList.add("no");$("#fb")&&0;setTimeout(()=>{i++;nxt()},good?800:1700)});
      setTimeout(play,300);
    }
  };
  nxt();
}

/* ---------- PROGRESS ---------- */
function prog(){
  const n=Object.keys(S.done).length;
  const badge=n>=10?"👑 أستاذ":n>=7?"🚀 متقدّم":n>=4?"🌳 متوسط":n>=1?"🌱 مبتدئ نشيط":"🥚 بداية جديدة";
  app.innerHTML=`<div class="card" style="text-align:center"><div class="big" style="font-size:70px">${badge.split(" ")[0]}</div><h2>${badge.split(" ").slice(1).join(" ")}</h2><div>⭐ ${S.xp} نقطة · 🔥 ${S.streak} يوم متتالي</div></div>
  <h2>التقدّم حسب المستوى</h2>${LEVELS.map(l=>`<div class="card"><b>${l.ic} ${l.name} ${E(l.id)}</b> <span class="ex">${lvPct(l.id)}%</span><div class="bar"><i style="width:${lvPct(l.id)}%"></i></div></div>`).join("")}
  <h2>📒 دفتر كلماتي (${S.saved.length})</h2><div class="card" id="nb">${S.saved.length?S.saved.map((w,i)=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)"><span><b class="en">${esc(w[0])}</b> — ${esc(w[1])}</span><span><button class="spk" data-s="${i}" style="width:36px;height:36px;font-size:15px">🔊</button><button class="spk" data-d="${i}" style="width:36px;height:36px;font-size:15px">🗑️</button></span></div>`).join(""):"<div class=\"ex\">اضغط على الكلمات المسطّرة في القصص لحفظها هنا.</div>"}</div><div class="card"><div>📖 قصص مقروءة: <b>${Object.values(S.stories).filter(x=>x.r).length}</b> · 🎧 قصص مسموعة: <b>${Object.values(S.stories).filter(x=>x.l).length}</b></div></div><div class="card"><button class="btn sec" id="rs">🗑️ مسح التقدّم</button></div>`;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>say(S.saved[+b.dataset.s][0],{rate:.7}));app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.saved.splice(+b.dataset.d,1);save();prog()});
  $("#rs").onclick=()=>{S.xp=0;S.done={};S.stories={};S.saved=[];save();prog();head()};
}
render();

let _ip=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();_ip=e;const st=document.querySelector(".stats");if(st&&!document.getElementById("inst")){const b=document.createElement("button");b.id="inst";b.className="pill";b.style.cssText="border:0;color:#fff;cursor:pointer;font-family:inherit";b.textContent="📲 ثبّت";b.onclick=async()=>{_ip.prompt();try{await _ip.userChoice}catch(x){}b.remove()};st.appendChild(b)}});
try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(e){}
