["Entretien avec un sociologue","حوار مع عالم اجتماع","🎙️",[["Professeur, comment expliquez-vous la montée de l'individualisme dans nos sociétés ?","أستاذ كيف تفسرون صعود النزعة الفردية في مجتمعاتنا؟"],["Plusieurs facteurs convergent : l'urbanisation, la mobilité professionnelle et l'affaiblissement des institutions traditionnelles.","تتقاطع عوامل: التمدن والتنقل المهني وضعف المؤسسات التقليدية."],["Mais il serait réducteur d'y voir un repli égoïste : on observe aussi de nouvelles formes de solidarité.","لكن سيكون اختزالا رؤيتها انكفاء أنانيا فنلاحظ أيضا أشكالا جديدة من التضامن."],["Ces liens sont désormais choisis plutôt qu'hérités.","هذه الروابط صارت مختارة لا موروثة."]],[["Quels facteurs sont cités ?",["Urbanisation et mobilité professionnelle","La guerre","Le climat"],0],["Comment sont devenus les liens ?",["Choisis plutôt qu'hérités","Plus faibles","Disparus"],0]]],
["Conférence sur la neuroplasticité","محاضرة حول اللدونة العصبية","🧠",[["On a longtemps cru que le cerveau adulte était figé, incapable de se remodeler.","ظن زمنا طويلا أن دماغ الراشد جامد غير قابل للتشكل."],["Les recherches récentes démontrent au contraire qu'il se réorganise tout au long de la vie en fonction des expériences.","تبين الأبحاث الحديثة عكس ذلك فهو يعيد تنظيم نفسه مدى الحياة تبعا للتجارب."],["Apprendre une langue ou un instrument crée de nouvelles connexions entre les neurones.","تعلم لغة أو آلة يخلق وصلات جديدة بين العصبونات."],["Cela ouvre des perspectives prometteuses en matière de rééducation après un accident.","يفتح هذا آفاقا واعدة في إعادة التأهيل بعد حادث."]],[["Que croyait-on autrefois ?",["Que le cerveau adulte était figé","Qu'il grandit toujours","Qu'il dort"],0],["Quelle perspective cela ouvre-t-il ?",["La rééducation après un accident","Un nouveau régime","Un vaccin"],0]]],
["Table ronde sur l'éducation","مائدة مستديرة حول التعليم","🏫",[["Nos programmes privilégient encore la mémorisation au détriment de l'esprit critique.","ما زالت برامجنا تفضل الحفظ على حساب الحس النقدي."],["Je nuancerais : sans bases solides, il est difficile de réfléchir sur quoi que ce soit.","أنا أنقد: بدون أسس متينة يصعب التفكير في أي شيء."],["L'essentiel est de trouver un équilibre entre acquisition de connaissances et capacité à les mobiliser.","الأساس إيجاد توازن بين اكتساب المعارف وقدرة توظيفها."],["Cela suppose aussi de mieux former les enseignants à des pédagogies actives.","يفترض ذلك أيضا تكوينا أفضل للأساتذة في بيداغوجيات نشطة."]],[["Que reproche le premier intervenant ?",["La mémorisation excessive","Le manque d'écoles","Les devoirs"],0],["Que faut-il aussi améliorer ?",["La formation des enseignants","Les salles","Les horaires"],0]]],
["Chronique littéraire","فقرة أدبية","✒️",[["Dans ce premier roman, l'auteure déploie une prose d'une rare sobriété.","في هذه الرواية الأولى تبسط الكاتبة نثرا نادر التقشف."],["L'intrigue, située dans un quartier populaire de Marseille, interroge la notion d'appartenance.","تتناول الحبكة المدارة في حي شعبي بمارسيليا مفهوم الانتماء."],["Certains passages souffrent d'une certaine longueur, mais l'ensemble est porté par une voix singulière.","بعض المقاطع تعاني من إطالة لكن العمل كله يحمله صوت متفرد."],["Une révélation de la rentrée littéraire, assurément.","اكتشاف في الموسم الأدبي بلا شك."]],[["Où se déroule l'intrigue ?",["À Marseille","À Alger","À Paris"],0],["Comment est le style ?",["D'une rare sobriété","Très orné","Familier"],0]]],
["Reportage scientifique","تقرير علمي","🔭",[["Une équipe internationale vient de détecter une planète située dans la zone habitable d'une étoile proche.","اكتشف فريق دولي كوكبا يقع في المنطقة الصالحة للسكن حول نجم قريب."],["Rien n'indique pour l'instant qu'elle abrite la vie, mais elle pourrait contenir de l'eau liquide.","لا شيء يدل حاليا على وجود حياة لكنه قد يحوي ماء سائلا."],["Les chercheurs espèrent analyser son atmosphère grâce à la prochaine génération de télescopes.","يأمل الباحثون تحليل غلافه الجوي بفضل الجيل المقبل من المقاريب."],["Ils appellent néanmoins à la prudence face aux annonces trop enthousiastes.","لكنهم يدعون إلى الحذر إزاء الإعلانات المفرطة الحماس."]],[["Où est située la planète ?",["Dans la zone habitable","Très loin du Soleil","Dans un trou noir"],0],["Que demandent les chercheurs ?",["De la prudence","Plus d'argent","Un nom"],0]]],
["Débat sur la laïcité","نقاش حول العلمانية","⚖️",[["Pour moi, la neutralité de l'espace public garantit la liberté de conscience de chacun.","بالنسبة لي حياد الفضاء العمومي يضمن حرية ضمير كل فرد."],["Je crains que cette neutralité ne se transforme parfois en exclusion de certaines pratiques.","أخشى أن يتحول هذا الحياد أحيانا إلى إقصاء لبعض الممارسات."],["Le véritable enjeu est de concilier égalité de traitement et respect des différences.","الرهان الحقيقي هو التوفيق بين المساواة في المعاملة واحترام الاختلاف."],["Un dialogue serein plutôt qu'un affrontement stérile serait déjà un progrès.","حوار هادئ بدل مواجهة عقيمة سيكون تقدما بحد ذاته."]],[["Que garantit la neutralité selon le premier ?",["La liberté de conscience","Le silence","Le progrès"],0],["Que préfère-t-on au final ?",["Un dialogue serein","Un affrontement","Un vote"],0]]],
["Allocution d'un chef d'entreprise","كلمة رجل أعمال","🏢",[["Chers collaborateurs, l'année écoulée a mis à l'épreuve notre capacité d'adaptation.","أعزائي المتعاونين اختبرت السنة الماضية قدرتنا على التكيف."],["Malgré un contexte économique difficile, nous avons préservé tous les emplois.","رغم سياق اقتصادي صعب حافظنا على كل الوظائف."],["Notre priorité demeure d'investir dans la formation et dans des pratiques plus responsables.","تظل أولويتنا الاستثمار في التكوين وفي ممارسات أكثر مسؤولية."],["Je vous remercie sincèrement pour votre engagement sans faille.","أشكركم بصدق على التزامكم الثابت."]],[["Qu'a préservé l'entreprise ?",["Tous les emplois","Les bénéfices","Les prix"],0],["Quelle est la priorité ?",["La formation et les pratiques responsables","L'expansion","Les dividendes"],0]]],
["Analyse géopolitique","تحليل جيوسياسي","🗺️",[["La compétition pour les ressources hydriques devient un facteur majeur de tensions régionales.","أصبحت المنافسة على الموارد المائية عاملا رئيسيا في التوترات الإقليمية."],["Plusieurs fleuves traversent plusieurs États, rendant leur gestion particulièrement délicate.","تعبر عدة أنهار عدة دول مما يجعل تدبيرها حساسا بشكل خاص."],["Des accords de coopération existent, mais leur application dépend de la volonté politique des parties.","توجد اتفاقيات تعاون لكن تطبيقها يتوقف على الإرادة السياسية للأطراف."],["Sans règles partagées, le risque de conflit ne peut qu'augmenter.","بدون قواعد مشتركة لا يمكن إلا أن يزداد خطر النزاع."]],[["Quel enjeu devient majeur ?",["L'eau","Le pétrole","Le commerce"],0],["De quoi dépend l'application des accords ?",["De la volonté politique","Du climat","Du coût"],0]]],
["Conseils de rédaction","نصائح تحرير","🖋️",[["Un bon texte argumentatif commence par une thèse clairement formulée.","يبدأ النص الحجاجي الجيد بأطروحة مصاغة بوضوح."],["Chaque paragraphe doit développer une idée unique, appuyée par un exemple précis.","يجب أن تطور كل فقرة فكرة واحدة مدعومة بمثال دقيق."],["Les connecteurs logiques assurent la cohérence entre les parties du raisonnement.","تضمن أدوات الربط المنطقية الانسجام بين أجزاء الاستدلال."],["Terminez en ouvrant la réflexion plutôt qu'en répétant ce qui a déjà été dit.","اختموا بفتح التفكير بدل تكرار ما قيل."]],[["Par quoi commence un bon texte ?",["Une thèse claire","Une citation","Une question"],0],["Comment terminer ?",["En ouvrant la réflexion","En répétant","En s'excusant"],0]]],
["Émission sur la psychologie","برنامج عن علم النفس","🛋️",[["Notre invitée étudie les mécanismes de la procrastination depuis plus de dix ans.","ضيفتنا تدرس آليات التسويف منذ أكثر من عشر سنوات."],["Selon elle, il ne s'agit pas de paresse, mais d'une difficulté à gérer des émotions négatives liées à la tâche.","حسبها الأمر ليس كسلا بل صعوبة في تدبير مشاعر سلبية مرتبطة بالمهمة."],["Fractionner l'objectif en petites étapes permet de réduire l'angoisse du commencement.","تجزئة الهدف إلى خطوات صغيرة تقلل قلق البداية."],["Elle invite aussi à se pardonner ses retards pour éviter le cercle vicieux de la culpabilité.","وتدعو أيضا إلى مسامحة النفس على التأخر لتفادي حلقة الذنب المفرغة."]],[["Selon la chercheuse, qu'est-ce que la procrastination ?",["Une difficulté à gérer des émotions","De la paresse","Un manque de temps"],0],["Que conseille-t-elle ?",["Fractionner l'objectif","Travailler la nuit","S'isoler"],0]]],
["Actualité économique","الأخبار الاقتصادية","📉",[["Les marchés financiers ont connu une journée particulièrement volatile, sur fond d'incertitudes géopolitiques.","شهدت الأسواق المالية يوما متقلبا بشكل خاص في ظل عدم يقين جيوسياسي."],["Le prix du baril a bondi de quatre pour cent, entraînant dans son sillage les valeurs énergétiques.","قفز سعر البرميل بأربعة بالمئة جارا وراءه أسهم الطاقة."],["Les analystes jugent prématuré de parler d'une nouvelle crise.","يعتبر المحللون الحديث عن أزمة جديدة سابقا لأوانه."],["Ils recommandent aux épargnants de ne pas céder à la panique.","وينصحون المدخرين بعدم الاستسلام للذعر."]],[["Comment était le marché ?",["Volatile","Calme","Fermé"],0],["Que recommandent les analystes ?",["Ne pas paniquer","Vendre","Acheter"],0]]],
["Présentation d'une exposition","تقديم معرض","🖼️",[["Cette exposition retrace l'évolution de la photographie documentaire du milieu du siècle dernier à nos jours.","يتتبع هذا المعرض تطور التصوير الوثائقي من منتصف القرن الماضي إلى اليوم."],["Le parcours est organisé de façon thématique plutôt que chronologique, ce qui invite à des rapprochements inattendus.","نظم المسار موضوعاتيا لا زمنيا مما يدعو إلى مقارنات غير متوقعة."],["Des cartels détaillés replacent chaque cliché dans son contexte historique.","تضع بطاقات مفصلة كل صورة في سياقها التاريخي."],["L'exposition est à voir jusqu'à la fin du mois.","المعرض متاح حتى نهاية الشهر."]],[["Comment est organisé le parcours ?",["Par thèmes","Par dates","Au hasard"],0],["Jusqu'à quand est-elle visible ?",["Jusqu'à la fin du mois","Jusqu'à demain","Jusqu'à l'an prochain"],0]]],
["Séminaire sur le management","ندوة حول التسيير","👔",[["Un bon manager ne se contente pas de distribuer des tâches, il crée les conditions de l'engagement.","المسير الجيد لا يكتفي بتوزيع المهام بل يخلق شروط الانخراط."],["La reconnaissance du travail accompli est, selon les études, un levier de motivation plus puissant que le salaire.","الاعتراف بالعمل المنجز بحسب الدراسات رافعة تحفيز أقوى من الأجر."],["Il convient aussi d'accepter l'erreur comme une étape normale de l'apprentissage.","ينبغي أيضا قبول الخطأ كمرحلة طبيعية من التعلم."],["Une équipe qui ose parler librement innove davantage.","فريق يجرؤ على الكلام بحرية يبتكر أكثر."]],[["Qu'est-ce qui motive plus que le salaire ?",["La reconnaissance","Les vacances","Les horaires"],0],["Comment faut-il considérer l'erreur ?",["Comme une étape normale","Comme une faute grave","Comme un échec"],0]]],
["Discours sur la paix","خطاب عن السلام","🕊️",[["La paix ne se réduit pas à l'absence de guerre, elle suppose justice, dialogue et reconnaissance mutuelle.","السلام لا يختزل في غياب الحرب بل يفترض العدالة والحوار والاعتراف المتبادل."],["Les conflits les plus durables naissent souvent de blessures de mémoire jamais apaisées.","أطول النزاعات تنشأ غالبا من جراح ذاكرة لم تهدأ."],["C'est pourquoi l'éducation joue un rôle décisif dans la prévention des violences.","لذلك يلعب التعليم دورا حاسما في الوقاية من العنف."],["Construire la paix est un travail patient, quotidien et collectif.","بناء السلام عمل صبور يومي وجماعي."]],[["Que suppose la paix ?",["Justice et dialogue","La force","Le silence"],0],["Quel rôle joue l'éducation ?",["Prévenir les violences","Former des soldats","Aucun"],0]]],
["Podcast sur l'entrepreneuriat","بودكاست عن المقاولاتية","🚀",[["Dans cet épisode, une fondatrice raconte comment elle a financé sa première entreprise sans investisseurs.","في هذه الحلقة تحكي مؤسسة كيف مولت شركتها الأولى دون مستثمرين."],["Elle a commencé en vendant ses services à quelques clients, puis a réinvesti chaque bénéfice.","بدأت ببيع خدماتها لبعض الزبائن ثم أعادت استثمار كل ربح."],["Selon elle, la contrainte budgétaire l'a forcée à rester créative et à écouter ses clients.","حسبها أجبرتها قيود الميزانية على البقاء مبدعة والإصغاء لزبائنها."],["Elle conseille aux débutants de tester leur idée avant d'engager de lourds investissements.","تنصح المبتدئين باختبار فكرتهم قبل الدخول في استثمارات ثقيلة."]],[["Comment a-t-elle financé son entreprise ?",["Sans investisseurs","Avec une banque","Avec un héritage"],0],["Que conseille-t-elle ?",["Tester l'idée avant d'investir","S'endetter","Attendre"],0]]],
["Avis d'un médecin","رأي طبيب","💉",[["La vaccination reste l'un des moyens les plus efficaces de prévenir les maladies infectieuses.","يبقى التلقيح من أنجع وسائل الوقاية من الأمراض المعدية."],["Les effets secondaires graves sont extrêmement rares comparés aux risques de la maladie elle-même.","الآثار الجانبية الخطيرة نادرة جدا مقارنة بمخاطر المرض نفسه."],["Il est normal de poser des questions, et le rôle du soignant est d'y répondre avec transparence.","من الطبيعي طرح الأسئلة ودور المعالج الإجابة بشفافية."],["La confiance se construit par l'écoute et non par l'injonction.","تبنى الثقة بالإصغاء لا بالأمر."]],[["Comment sont les effets secondaires graves ?",["Extrêmement rares","Fréquents","Inconnus"],0],["Comment se construit la confiance ?",["Par l'écoute","Par l'obligation","Par la peur"],0]]],
["Documentaire sur les océans","وثائقي عن المحيطات","🌊",[["Les océans absorbent près d'un tiers du dioxyde de carbone émis par les activités humaines.","تمتص المحيطات قرابة ثلث ثاني أكسيد الكربون الذي تنتجه الأنشطة البشرية."],["Cette absorption provoque cependant une acidification qui menace coraux et mollusques.","لكن هذا الامتصاص يسبب تحمضا يهدد المرجان والرخويات."],["Les scientifiques surveillent aussi la montée du niveau de la mer, qui affecte déjà plusieurs îles.","يراقب العلماء أيضا ارتفاع مستوى البحر الذي يمس عدة جزر."],["Protéger les océans, c'est protéger l'avenir de notre propre espèce.","حماية المحيطات هي حماية لمستقبل جنسنا نفسه."]],[["Quelle part du CO2 absorbent les océans ?",["Près d'un tiers","La moitié","Un dixième"],0],["Que menace l'acidification ?",["Coraux et mollusques","Les poissons seulement","Les ports"],0]]],
["Conférence sur la cybersécurité","محاضرة عن الأمن السيبراني","🔐",[["La majorité des cyberattaques exploitent non pas des failles techniques, mais la crédulité des utilisateurs.","أغلب الهجمات الإلكترونية لا تستغل ثغرات تقنية بل سذاجة المستخدمين."],["L'hameçonnage reste la méthode la plus répandue : un courriel convaincant suffit à piéger un employé distrait.","يظل التصيد الأوسع انتشارا: رسالة مقنعة تكفي لإيقاع موظف شارد."],["La sensibilisation régulière des équipes est donc aussi cruciale que les outils de protection.","لذلك فالتوعية المنتظمة للفرق مهمة كأدوات الحماية."],["Enfin, activez l'authentification à deux facteurs partout où cela est possible.","وأخيرا فعلوا المصادقة الثنائية حيثما أمكن."]],[["Quelle est la méthode d'attaque la plus répandue ?",["L'hameçonnage","Le piratage matériel","Le virus USB"],0],["Que recommande-t-on d'activer ?",["L'authentification à deux facteurs","Le wifi","Un VPN"],0]]],
["Billet d'humeur","مقال رأي","💭",[["On nous répète que le bonheur se trouve dans l'accumulation de réussites, mais l'expérience contredit ce discours.","يقال لنا إن السعادة في تراكم النجاحات لكن التجربة تناقض هذا الخطاب."],["Les moments dont on se souvient avec le plus de tendresse sont souvent des instants simples, partagés avec ceux qu'on aime.","اللحظات التي نذكرها بأكبر حنان غالبا لحظات بسيطة نتقاسمها مع من نحب."],["Cela ne signifie pas qu'il faut renoncer à toute ambition, mais qu'il faut en redéfinir la mesure.","لا يعني ذلك التخلي عن كل طموح بل إعادة تحديد مقياسه."],["Peut-être le vrai succès est-il de savoir s'arrêter pour savourer ce que l'on a déjà.","ربما النجاح الحقيقي أن نعرف كيف نتوقف لنتذوق ما نملكه."]],[["Où se trouve le bonheur selon le discours dominant ?",["Dans les réussites","Dans l'argent","Dans le repos"],0],["Que faut-il redéfinir ?",["La mesure de l'ambition","Le travail","La famille"],0]]],
["Compte rendu d'une mission humanitaire","تقرير مهمة إنسانية","⛑️",[["Notre équipe est restée trois semaines dans une région isolée dépourvue d'infrastructures sanitaires.","بقي فريقنا ثلاثة أسابيع في منطقة معزولة تفتقد للبنى الصحية."],["Nous avons soigné plus de huit cents patients et formé une dizaine d'agents de santé locaux.","عالجنا أكثر من ثمانمائة مريض وكوّنا عشرة أعوان صحة محليين."],["Les difficultés logistiques ont été nombreuses, notamment l'acheminement des médicaments.","كانت الصعوبات اللوجستية كثيرة خصوصا إيصال الأدوية."],["Notre priorité est désormais d'assurer la continuité des soins après notre départ.","أولويتنا الآن ضمان استمرارية العلاج بعد مغادرتنا."]],[["Combien de temps est restée l'équipe ?",["Trois semaines","Trois jours","Trois mois"],0],["Quelle est la priorité désormais ?",["La continuité des soins","Le retour","Les dons"],0]]],

["Réflexion sur la liberté","تأمل في الحرية","🕊️",[["La liberté n'est pas seulement l'absence de contraintes extérieures, elle suppose aussi une autonomie intérieure.","الحرية ليست غياب القيود الخارجية فقط بل تفترض استقلالا داخليا."],["Celui qui obéit à ses impulsions ou aux opinions dominantes est-il vraiment libre ?","هل من يطيع اندفاعاته أو الآراء السائدة حر فعلا؟"],["Les philosophes estiment que la liberté s'exerce dans la capacité à examiner ses propres choix.","يرى الفلاسفة أن الحرية تمارس في القدرة على فحص اختياراتنا."],["Elle implique alors une responsabilité envers les autres, car ma liberté s'arrête là où commence la leur.","وتستتبع بذلك مسؤولية تجاه الآخرين فحريتي تنتهي حيث تبدأ حريتهم."]],[["Que suppose la liberté en plus ?",["Une autonomie intérieure","Plus d'argent","Moins de lois"],0],["Où s'arrête ma liberté ?",["Là où commence celle des autres","Jamais","Aux frontières"],0]]],

["Faire du shopping","التسوق","👕",[["Hier, je suis allé faire du shopping avec ma sœur.","أمس ذهبت للتسوق مع أختي."],["Je voulais une nouvelle veste parce qu'il commence à faire froid.","أردت سترة جديدة لأن الجو يبرد."],["J'en ai trouvé une noire pour quatre mille dinars.","وجدت واحدة سوداء بأربعة آلاف دينار."],["C'était plus cher que prévu.","كانت أغلى مما توقعت."]],[["Pourquoi voulait-il une veste ?",["Il commence à faire froid","C'est un cadeau","Elle était bon marché"],0],["Combien a-t-elle coûté ?",["3000","4000","5000"],1]]],
["L'histoire de mon grand-père","قصة جدي","👴",[["Quand mon grand-père était jeune, il habitait dans un petit village.","عندما كان جدي شابا كان يسكن في قرية صغيرة."],["Il marchait cinq kilomètres pour aller à l'école.","كان يمشي خمسة كيلومترات للمدرسة."],["Il n'y avait pas d'électricité chez lui.","لم تكن عنده كهرباء."],["Maintenant, il nous raconte ces histoires tous les soirs.","الآن يحكي لنا هذه القصص كل مساء."]],[["Combien de kilomètres marchait-il ?",["Cinq","Dix","Un"],0],["Quand raconte-t-il ses histoires ?",["Tous les soirs","Tous les matins","Jamais"],0]]],

["La bibliothèque","المكتبة","📚",[["Notre ville a une nouvelle bibliothèque.","مدينتنا فيها مكتبة جديدة."],["Elle est ouverte de neuf heures à dix-huit heures sauf le vendredi.","مفتوحة من التاسعة إلى السادسة عدا الجمعة."],["On peut emprunter trois livres pendant deux semaines.","يمكن استعارة ثلاثة كتب لأسبوعين."],["Les enfants ont une salle de lecture spéciale.","للأطفال قاعة قراءة خاصة."]],[["Combien de livres peut-on emprunter ?",["Deux","Trois","Cinq"],1],["Quel jour est-elle fermée ?",["Vendredi","Dimanche","Lundi"],0]]],
["Un week-end pluvieux","عطلة ممطرة","🌧️",[["Il a plu tout le week-end, alors nous sommes restés à la maison.","أمطرت طوال العطلة فبقينا في البيت."],["Mon frère et moi, nous avons joué à des jeux de société.","لعبت أنا وأخي ألعاب الطاولة."],["Maman a préparé du chocolat chaud et des biscuits.","حضرت أمي شوكولاتة ساخنة وبسكويت."],["C'était une belle journée, même sans soleil.","كان يوما جميلا حتى بدون شمس."]],[["Pourquoi sont-ils restés à la maison ?",["Il a plu","Ils étaient malades","Ils étaient fatigués"],0],["Que a préparé maman ?",["Du chocolat chaud et des biscuits","Une pizza","Une soupe"],0]]],
["Apprendre à nager","تعلم السباحة","🏊",[["L'année dernière, je ne savais pas nager.","السنة الماضية لم أكن أعرف السباحة."],["J'ai pris des cours à la piscine tous les samedis.","أخذت دروسا في المسبح كل سبت."],["Au début, j'avais peur de l'eau profonde.","في البداية خفت من الماء العميق."],["Maintenant, je peux nager cinquante mètres.","الآن أستطيع السباحة خمسين مترا."]],[["Quand prenait-il des cours ?",["Tous les samedis","Tous les lundis","Tous les jours"],0],["Combien de mètres nage-t-il maintenant ?",["50","100","10"],0]]],

["Une randonnée en montagne","نزهة في الجبال","⛰️",[["Le week-end dernier, nous avons fait une randonnée en montagne.","نهاية الأسبوع الماضي قمنا بنزهة في الجبل."],["Le chemin était raide, mais la vue était magnifique.","كان الطريق شديد الانحدار لكن المنظر رائع."],["Nous avons mangé des sandwichs au sommet.","أكلنا سندويتشات في القمة."],["Nous sommes rentrés très fatigués.","عدنا متعبين جدا."]],[["Comment était le chemin ?",["Raide","Plat","Court"],0],["Où ont-ils mangé ?",["Au sommet","À la maison","Dans un café"],0]]],
["Préparer l'Aïd","التحضير للعيد","🌙",[["Hier, c'était le dernier jour du ramadan.","أمس كان آخر يوم من رمضان."],["Ma sœur et moi, nous avons nettoyé la maison et aidé maman à préparer les gâteaux.","نظفنا أنا وأختي البيت وساعدنا أمي في تحضير الحلويات."],["Papa a acheté des vêtements neufs pour nous tous.","اشترى أبي ملابس جديدة لنا جميعا."],["Maman était si heureuse qu'elle a souri toute la soirée.","كانت أمي سعيدة جدا حتى ابتسمت طوال المساء."]],[["Qu'était-ce hier ?",["Le dernier jour du ramadan","Un anniversaire","Un jour d'école"],0],["Qu'a acheté papa ?",["Des vêtements neufs","Un gâteau","Des fleurs"],0]]],

["Un nouveau départ","بداية جديدة","🌱",[["Après dix ans dans la même entreprise, Nadia a décidé de changer de métier.","بعد عشر سنوات في الشركة نفسها قررت نادية تغيير مهنتها."],["Elle a suivi une formation en informatique le soir, tout en travaillant la journée.","تابعت تكوينا في الإعلام الآلي مساء بينما تعمل نهارا."],["Ce n'était pas facile, mais elle ne s'est jamais découragée.","لم يكن الأمر سهلا لكنها لم تيأس أبدا."],["Aujourd'hui, elle développe des applications et se dit enfin épanouie.","اليوم تطور تطبيقات وتقول إنها أخيرا مرتاحة."]],[["Pourquoi Nadia a-t-elle suivi une formation ?",["Pour changer de métier","Pour voyager","Pour gagner un concours"],0],["Quand suivait-elle la formation ?",["Le soir","Le matin","Le week-end seulement"],0]]],
["Le marché du ramadan","سوق رمضان","🌙",[["Pendant le ramadan, la place centrale se transforme en grand marché du soir.","في رمضان تتحول الساحة المركزية إلى سوق مسائي كبير."],["Les commerçants y vendent des dattes, des gâteaux au miel et des épices.","يبيع التجار تمورا وحلويات بالعسل وتوابل."],["Malgré la fatigue du jeûne, des milliers de visiteurs se pressent entre les étals avant l'iftar.","رغم تعب الصيام يتزاحم آلاف الزوار بين الأكشاك قبل الإفطار."],["L'ambiance chaleureuse rappelle l'esprit de partage de ce mois.","الأجواء الدافئة تذكر بروح التشارك في هذا الشهر."]],[["Que vendent les commerçants ?",["Des dattes et des gâteaux au miel","Des voitures","Des téléphones"],0],["Quand les visiteurs se pressent-ils ?",["Avant l'iftar","Après minuit","Le matin"],0]]],
["Le télétravail","العمل عن بعد","🏠",[["Depuis quelques années, de plus en plus de salariés travaillent depuis chez eux.","منذ سنوات صار موظفون أكثر يعملون من بيوتهم."],["Ils gagnent du temps et évitent les embouteillages.","يربحون الوقت ويتفادون الازدحام."],["En revanche, certains se sentent isolés et ont du mal à séparer vie privée et travail.","في المقابل يشعر بعضهم بالعزلة ويصعب عليهم الفصل بين الحياة الخاصة والعمل."],["Beaucoup d'entreprises proposent donc un système mixte.","لذلك تقترح شركات كثيرة نظاما مختلطا."]],[["Quel avantage cite le texte ?",["Gagner du temps","Gagner plus d'argent","Voyager"],0],["Quelle solution proposent les entreprises ?",["Un système mixte","Plus de congés","Un salaire fixe"],0]]],
["Sauver les abeilles","إنقاذ النحل","🐝",[["Les abeilles jouent un rôle essentiel dans la pollinisation des cultures.","للنحل دور أساسي في تلقيح المحاصيل."],["Or leur nombre diminue à cause des pesticides et du changement climatique.","غير أن عددها يتناقص بسبب المبيدات وتغير المناخ."],["Des citoyens installent des ruches sur les toits des villes pour les protéger.","يضع مواطنون خلايا على أسطح المدن لحمايتها."],["Planter des fleurs sur son balcon est aussi un geste utile.","غرس الزهور في الشرفة تصرف مفيد أيضا."]],[["Pourquoi les abeilles sont-elles importantes ?",["Elles pollinisent les cultures","Elles font du miel seulement","Elles nettoient l'air"],0],["Quelle cause de leur déclin est citée ?",["Les pesticides","Les oiseaux","La pluie"],0]]],
["Mon premier emploi","أول عمل لي","💼",[["À dix-huit ans, j'ai travaillé comme serveur dans un café pendant l'été.","في الثامنة عشرة اشتغلت نادلا في مقهى خلال الصيف."],["Au début, je confondais les commandes et les clients s'impatientaient.","في البداية كنت أخلط الطلبات فيتضايق الزبائن."],["Mon patron m'a expliqué calmement comment m'organiser.","شرح لي صاحب المقهى بهدوء كيف أنظم نفسي."],["J'ai appris la patience, et surtout l'importance du sourire.","تعلمت الصبر وخصوصا أهمية الابتسامة."]],[["Quel était son premier emploi ?",["Serveur","Vendeur","Chauffeur"],0],["Qu'a-t-il appris ?",["La patience et le sourire","La cuisine","La comptabilité"],0]]],
["Voyage en train","رحلة بالقطار","🚂",[["Je préfère voyager en train plutôt qu'en avion.","أفضل السفر بالقطار على الطائرة."],["On peut admirer les paysages et lire tranquillement.","يمكن التمتع بالمناظر والقراءة بهدوء."],["De plus, c'est moins polluant et souvent plus simple.","كما أنه أقل تلويثا وغالبا أبسط."],["Le seul inconvénient, c'est que le trajet est parfois plus long.","العيب الوحيد أن الرحلة أحيانا أطول."]],[["Que préfère l'auteur ?",["Le train","L'avion","La voiture"],0],["Quel est l'inconvénient ?",["Le trajet plus long","Le prix","Le bruit"],0]]],
["Le recyclage au quotidien","إعادة التدوير يوميا","♻️",[["Dans mon quartier, on trie les déchets en quatre catégories.","في حيّنا نفرز النفايات إلى أربعة أصناف."],["Au début, c'était compliqué, mais on s'y habitue vite.","في البداية كان معقدا لكن نتعود بسرعة."],["Les enfants adorent expliquer aux adultes dans quelle poubelle jeter chaque objet.","يحب الأطفال أن يشرحوا للكبار في أي حاوية يرمون كل شيء."],["Résultat : le volume de déchets a diminué de vingt pour cent.","النتيجة: انخفض حجم النفايات بعشرين بالمئة."]],[["En combien de catégories trie-t-on ?",["Quatre","Deux","Six"],0],["De combien les déchets ont-ils diminué ?",["20 %","50 %","5 %"],0]]],

["La vieille maison","البيت القديم","🏚️",[["Au bout de la rue se trouve une maison abandonnée depuis vingt ans.","في آخر الشارع بيت مهجور منذ عشرين سنة."],["Les enfants du quartier disent qu'elle est hantée.","يقول أطفال الحي إنه مسكون."],["En réalité, un vieux monsieur y a vécu seul avant de partir à la ville.","في الحقيقة عاش فيه رجل مسن وحده قبل أن يرحل إلى المدينة."],["La mairie envisage maintenant d'en faire une bibliothèque.","تفكر البلدية الآن في تحويله إلى مكتبة."]],[["Depuis quand la maison est-elle abandonnée ?",["Vingt ans","Cinq ans","Un an"],0],["Que veut en faire la mairie ?",["Une bibliothèque","Un hôtel","Un parking"],0]]],
["L'importance du sommeil","أهمية النوم","😴",[["Les spécialistes recommandent de dormir entre sept et neuf heures par nuit.","ينصح المختصون بالنوم بين سبع وتسع ساعات في الليلة."],["Le manque de sommeil réduit la concentration et affaiblit la mémoire.","قلة النوم تضعف التركيز والذاكرة."],["Éteindre les écrans une heure avant le coucher aide à mieux s'endormir.","إطفاء الشاشات قبل النوم بساعة يساعد على النوم الأفضل."],["Un horaire régulier est également très utile.","كما أن موعدا منتظما مفيد جدا."]],[["Combien d'heures faut-il dormir ?",["7 à 9","4 à 5","10 à 12"],0],["Que conseille-t-on avant le coucher ?",["Éteindre les écrans","Boire du café","Faire du sport"],0]]],
["Un repas d'Aïd","غداء العيد","🍲",[["Le premier jour de l'Aïd, toute la famille s'est réunie chez ma grand-mère.","في أول أيام العيد اجتمعت العائلة كلها عند جدتي."],["Nous avons mangé son plat traditionnel, qui cuit pendant cinq heures.","أكلنا طبقها التقليدي الذي يطبخ خمس ساعات."],["Elle a souri et dit que l'Aïd est un moment pour remercier les siens.","ابتسمت وقالت إن العيد وقت لنشكر فيه أحبابنا."],["Ce jour-là, tout le monde a ri et partagé de bons souvenirs.","في ذلك اليوم ضحك الجميع وتقاسموا ذكريات جميلة."]],[["Où la famille s'est-elle réunie ?",["Chez la grand-mère","Au restaurant","À l'école"],0],["Combien de temps cuit le plat ?",["Cinq heures","Une heure","Dix minutes"],0]]],
["Un séjour à l'étranger","إقامة بالخارج","🛬",[["L'année dernière, ma cousine a passé six mois au Canada pour ses études.","السنة الماضية قضت ابنة عمي ستة أشهر في كندا للدراسة."],["Elle a dû s'habituer au climat très froid et à une cuisine différente.","اضطرت للتعود على المناخ البارد جدا وعلى مطبخ مختلف."],["Au début, elle avait le mal du pays, puis elle s'est fait de bons amis.","في البداية اشتاقت للوطن ثم كونت أصدقاء طيبين."],["Elle dit que cette expérience l'a rendue plus indépendante.","تقول إن هذه التجربة جعلتها أكثر استقلالية."]],[["Combien de temps est-elle restée ?",["Six mois","Un an","Deux semaines"],0],["Qu'a-t-elle gagné de cette expérience ?",["Plus d'indépendance","Un diplôme","De l'argent"],0]]],
["Les réseaux sociaux","شبكات التواصل","📱",[["Les réseaux sociaux permettent de rester en contact avec des amis éloignés.","تتيح الشبكات الاجتماعية البقاء على اتصال بالأصدقاء البعيدين."],["Cependant, ils peuvent aussi devenir une source de stress et de comparaison.","غير أنها قد تصبح مصدر توتر ومقارنة."],["Certains experts conseillent de limiter son temps d'écran à une heure par jour.","ينصح بعض الخبراء بتحديد وقت الشاشة بساعة يوميا."],["L'essentiel est d'en garder le contrôle.","الأهم أن نحتفظ بالتحكم فيها."]],[["Quel est un avantage cité ?",["Rester en contact","Gagner de l'argent","Apprendre"],0],["Quelle limite est conseillée ?",["Une heure par jour","Cinq heures","Aucune"],0]]],
["Le tourisme durable","السياحة المستدامة","🌍",[["Le tourisme durable cherche à protéger l'environnement et les populations locales.","تسعى السياحة المستدامة إلى حماية البيئة والسكان المحليين."],["Les voyageurs choisissent des hébergements écologiques et consomment des produits du terroir.","يختار المسافرون إقامات إيكولوجية ويستهلكون منتجات المنطقة."],["Ils évitent aussi de laisser des déchets dans la nature.","ويتجنبون ترك النفايات في الطبيعة."],["Ainsi, les régions touristiques gardent leur beauté pour les générations futures.","وهكذا تحافظ المناطق السياحية على جمالها للأجيال القادمة."]],[["Que protège le tourisme durable ?",["L'environnement et les habitants","Les hôtels","Les avions"],0],["Que consomment les voyageurs ?",["Des produits locaux","Des produits importés","Du fast-food"],0]]],
["Un concert inoubliable","حفل لا يُنسى","🎤",[["Samedi dernier, j'ai assisté au concert de mon chanteur préféré.","السبت الماضي حضرت حفل مغنيي المفضل."],["La salle était pleine et l'ambiance électrique dès les premières notes.","كانت القاعة ممتلئة والأجواء مشحونة منذ النغمات الأولى."],["Il a chanté ses plus grands succès pendant plus de deux heures.","غنى أكبر نجاحاته أكثر من ساعتين."],["En sortant, j'avais encore les chansons dans la tête et le sourire aux lèvres.","عند الخروج بقيت الأغاني في رأسي والابتسامة على شفتي."]],[["Combien de temps a duré le concert ?",["Plus de deux heures","Une heure","Trente minutes"],0],["Comment était l'ambiance ?",["Électrique","Calme","Triste"],0]]],
["Le potager de grand-mère","حديقة الخضر لجدتي","🥕",[["Ma grand-mère cultive des légumes derrière sa maison depuis cinquante ans.","تزرع جدتي الخضر خلف بيتها منذ خمسين سنة."],["Elle connaît chaque saison et sait exactement quand semer les tomates.","تعرف كل فصل وتعلم متى تزرع الطماطم بالضبط."],["Pour elle, rien n'a meilleur goût que ce qu'on a fait pousser soi-même.","بالنسبة لها لا شيء أطيب مما زرعناه بأنفسنا."],["Cet été, elle m'a appris à planter des courgettes.","هذا الصيف علمتني زرع الكوسة."]],[["Depuis quand cultive-t-elle des légumes ?",["50 ans","5 ans","20 ans"],0],["Que lui a-t-elle appris ?",["Planter des courgettes","Cuisiner","Coudre"],0]]],
["Le métier de pompier","مهنة رجل الإطفاء","🚒",[["Les pompiers interviennent non seulement pour les incendies, mais aussi pour les accidents.","لا يتدخل رجال الإطفاء في الحرائق فقط بل في الحوادث أيضا."],["Leur formation est longue et exige une excellente condition physique.","تكوينهم طويل ويتطلب لياقة بدنية ممتازة."],["Ils travaillent par équipes et doivent rester calmes sous la pression.","يعملون في فرق ويجب أن يبقوا هادئين تحت الضغط."],["Beaucoup disent que sauver une vie vaut tous les efforts.","يقول كثيرون إن إنقاذ حياة يستحق كل الجهد."]],[["Dans quels cas interviennent-ils ?",["Incendies et accidents","Seulement incendies","Seulement inondations"],0],["Que doivent-ils rester ?",["Calmes","Rapides","Silencieux"],0]]],
["Une rencontre inattendue","لقاء غير متوقع","🤝",[["En faisant la queue à la poste, j'ai reconnu un ancien camarade de lycée.","وأنا واقف في الطابور في البريد تعرفت على زميل قديم من الثانوية."],["Nous ne nous étions pas vus depuis quinze ans.","لم نلتق منذ خمس عشرة سنة."],["Il est devenu professeur et vit maintenant dans une autre ville.","صار أستاذا ويعيش الآن في مدينة أخرى."],["Nous avons échangé nos numéros et promis de nous revoir bientôt.","تبادلنا الأرقام ووعدنا بأن نلتقي قريبا."]],[["Où l'a-t-il rencontré ?",["À la poste","Au lycée","Au café"],0],["Que fait-il aujourd'hui ?",["Il est professeur","Il est médecin","Il est chauffeur"],0]]],
["Économiser de l'énergie","توفير الطاقة","💡",[["Pour réduire sa facture d'électricité, on peut adopter de petits gestes.","لخفض فاتورة الكهرباء يمكن اعتماد تصرفات بسيطة."],["Éteindre les lumières en quittant une pièce permet déjà d'économiser.","إطفاء الأضواء عند مغادرة الغرفة يوفر بالفعل."],["Il vaut mieux aussi débrancher les appareils qui ne servent pas.","الأفضل أيضا فصل الأجهزة غير المستعملة."],["Ces habitudes aident le portefeuille comme la planète.","هذه العادات تفيد الجيب والكوكب."]],[["Quel geste simple est cité ?",["Éteindre les lumières","Acheter des lampes","Ouvrir les fenêtres"],0],["Qui profite de ces habitudes ?",["Le portefeuille et la planète","Seulement l'État","Personne"],0]]],
["Le premier jour d'école","أول يوم دراسي","🎒",[["Le jour de la rentrée, ma petite sœur avait le ventre noué.","في يوم الدخول المدرسي كانت أختي الصغيرة متوترة."],["Elle craignait de ne pas se faire d'amis.","كانت تخشى ألا تكوّن صداقات."],["Dans la cour, une fille lui a proposé de jouer à la corde à sauter.","في الساحة اقترحت عليها فتاة اللعب بحبل القفز."],["Le soir, elle racontait sa journée sans s'arrêter.","في المساء حكت يومها دون توقف."]],[["Quelle était sa crainte ?",["Ne pas avoir d'amis","Être en retard","Perdre son cartable"],0],["Que lui a proposé la fille ?",["Jouer à la corde à sauter","Partager un goûter","Un livre"],0]]],
["L'artisanat traditionnel","الصناعة التقليدية","🏺",[["Dans notre région, les potiers fabriquent des vases selon des techniques transmises depuis des siècles.","في منطقتنا يصنع الخزافون أواني بتقنيات متوارثة منذ قرون."],["Chaque motif a une signification précise liée à l'histoire locale.","لكل زخرفة معنى محدد مرتبط بتاريخ المنطقة."],["Aujourd'hui, de jeunes artisans mélangent tradition et design moderne.","اليوم يمزج حرفيون شباب بين التقليد والتصميم الحديث."],["Leurs pièces séduisent même les touristes étrangers.","وتستهوي قطعهم حتى السياح الأجانب."]],[["Comment les techniques sont-elles transmises ?",["De génération en génération","Par internet","Dans des écoles"],0],["Qui achète ces pièces ?",["Aussi des touristes","Seulement les locaux","Personne"],0]]],
["Un bon voisin","جار طيب","🏡",[["Quand mon voisin a su que ma mère était à l'hôpital, il a proposé de s'occuper de notre jardin.","لما علم جاري أن أمي في المستشفى عرض أن يعتني بحديقتنا."],["Chaque jour, il arrosait les plantes et nourrissait le chat.","كل يوم كان يسقي النباتات ويطعم القط."],["Il a refusé tout remerciement et a simplement dit que c'était normal.","رفض كل شكر وقال ببساطة إن هذا طبيعي."],["Dans la vie, ce sont ces petits gestes qui comptent le plus.","في الحياة هذه التصرفات الصغيرة هي الأهم."]],[["Pourquoi le voisin a-t-il aidé ?",["La mère était à l'hôpital","Il voulait de l'argent","Il s'ennuyait"],0],["Qu'a-t-il dit des remerciements ?",["Il les a refusés","Il les a acceptés","Il les a exigés"],0]]]
];

["L'essor des énergies renouvelables","صعود الطاقات المتجددة","☀️",[["Depuis une décennie, les panneaux solaires et les éoliennes se multiplient à un rythme sans précédent.","منذ عقد تتكاثر الألواح الشمسية والتوربينات الهوائية بوتيرة غير مسبوقة."],["Leur coût a considérablement baissé, ce qui les rend compétitifs face aux énergies fossiles.","انخفضت تكلفتها كثيرا فأصبحت منافسة للطاقات الأحفورية."],["Néanmoins, le stockage de l'électricité reste un défi majeur pour garantir un approvisionnement stable.","ومع ذلك يبقى تخزين الكهرباء تحديا كبيرا لضمان إمداد مستقر."],["Les chercheurs misent sur de nouvelles batteries et sur l'hydrogène pour résoudre ce problème.","يراهن الباحثون على بطاريات جديدة وعلى الهيدروجين لحل هذه المشكلة."]],[["Pourquoi ces énergies sont-elles compétitives ?",["Leur coût a baissé","Elles sont plus anciennes","Elles sont subventionnées partout"],0],["Quel défi subsiste ?",["Le stockage","La production","Le transport"],0]]],
["La mémoire et l'apprentissage","الذاكرة والتعلم","🧠",[["Contrairement à une idée reçue, la mémoire ne fonctionne pas comme un enregistreur fidèle.","خلافا لفكرة شائعة لا تعمل الذاكرة كمسجل أمين."],["Chaque fois qu'on se rappelle un souvenir, le cerveau le reconstruit légèrement.","كلما استذكرنا ذكرى أعاد الدماغ بناءها قليلا."],["Les révisions espacées dans le temps s'avèrent bien plus efficaces que le bachotage de dernière minute.","تبين أن المراجعات المتباعدة أنجع بكثير من الحشو في اللحظة الأخيرة."],["Dormir après avoir étudié contribue aussi à fixer les connaissances.","النوم بعد الدراسة يساهم أيضا في تثبيت المعارف."]],[["Comment fonctionne la mémoire selon le texte ?",["Elle reconstruit les souvenirs","Elle les enregistre fidèlement","Elle les efface"],0],["Quelle méthode est la plus efficace ?",["Les révisions espacées","Le bachotage","La lecture rapide"],0]]],
["Le dilemme de l'urbanisation","معضلة التمدن","🏙️",[["D'ici 2050, près de sept personnes sur dix vivront en ville.","بحلول 2050 سيعيش قرابة سبعة من كل عشرة أشخاص في المدن."],["Cette concentration offre des opportunités économiques, mais elle aggrave la pollution et le coût du logement.","يوفر هذا التركز فرصا اقتصادية لكنه يفاقم التلوث وتكلفة السكن."],["Plusieurs métropoles expérimentent désormais des quartiers piétons et des toits végétalisés.","تجرب عدة حواضر اليوم أحياء للمشاة وأسطحا مخضرة."],["Reste à savoir si ces initiatives suffiront à rendre les villes réellement durables.","يبقى أن نعرف هل تكفي هذه المبادرات لجعل المدن مستدامة فعلا."]],[["Quelle proportion vivra en ville en 2050 ?",["Environ sept sur dix","La moitié","Un sur dix"],0],["Quels effets négatifs sont cités ?",["Pollution et coût du logement","Chômage","Insécurité"],0]]],
["L'intelligence artificielle au travail","الذكاء الاصطناعي في العمل","🤖",[["L'intelligence artificielle transforme déjà de nombreux métiers, de la comptabilité à la médecine.","يغير الذكاء الاصطناعي مهنا كثيرة من المحاسبة إلى الطب."],["Certaines tâches répétitives disparaîtront, tandis que de nouvelles fonctions verront le jour.","ستختفي بعض المهام المتكررة وستظهر وظائف جديدة."],["Les spécialistes soulignent donc l'importance de la formation continue.","لذلك يؤكد المختصون أهمية التكوين المستمر."],["L'enjeu n'est pas de lutter contre la machine, mais d'apprendre à collaborer avec elle.","ليس الرهان مقاومة الآلة بل تعلم التعاون معها."]],[["Que deviendront les tâches répétitives ?",["Certaines disparaîtront","Elles augmenteront","Elles resteront identiques"],0],["Que soulignent les spécialistes ?",["La formation continue","La retraite","Le salaire"],0]]],
["Le patrimoine culinaire","التراث الطهوي","🍲",[["La cuisine d'un pays reflète son histoire, ses échanges commerciaux et son climat.","يعكس مطبخ البلد تاريخه وتبادلاته التجارية ومناخه."],["Un plat apparemment simple peut cacher des siècles de migrations et d'influences croisées.","قد يخفي طبق بسيط ظاهريا قرونا من الهجرات والتأثيرات المتبادلة."],["Aujourd'hui, des associations s'efforcent de recueillir les recettes des anciens avant qu'elles ne tombent dans l'oubli.","تسعى جمعيات اليوم إلى جمع وصفات الكبار قبل أن تنسى."],["Transmettre un plat, c'est aussi transmettre une mémoire collective.","نقل طبق هو أيضا نقل لذاكرة جماعية."]],[["Que reflète la cuisine d'un pays ?",["Son histoire et son climat","Sa politique","Sa langue"],0],["Que font les associations ?",["Elles recueillent les recettes","Elles ouvrent des restaurants","Elles vendent des livres"],0]]],
["Les défis de l'eau","تحديات الماء","💧",[["L'eau douce représente une infime fraction de l'eau présente sur Terre.","يمثل الماء العذب جزءا ضئيلا من مياه الأرض."],["La croissance démographique et l'agriculture intensive accentuent la pression sur cette ressource.","النمو السكاني والفلاحة المكثفة يزيدان الضغط على هذا المورد."],["Le dessalement de l'eau de mer progresse, mais il consomme beaucoup d'énergie.","يتقدم تحلية مياه البحر لكنه يستهلك طاقة كبيرة."],["Chacun peut contribuer en évitant le gaspillage au quotidien.","يمكن لكل فرد المساهمة بتجنب التبذير يوميا."]],[["Que représente l'eau douce ?",["Une infime fraction","La majorité","La moitié"],0],["Quel inconvénient du dessalement est cité ?",["Il consomme beaucoup d'énergie","Il est interdit","Il pollue l'air"],0]]],
["Le rôle des médias","دور الإعلام","📺",[["À l'ère numérique, l'information circule à une vitesse vertigineuse.","في العصر الرقمي تنتشر المعلومة بسرعة مذهلة."],["Cette rapidité favorise malheureusement la propagation de fausses nouvelles.","تساعد هذه السرعة للأسف على انتشار الأخبار الزائفة."],["Il devient donc indispensable de vérifier les sources avant de partager un contenu.","لذلك يصبح من الضروري التحقق من المصادر قبل مشاركة محتوى."],["L'esprit critique est la meilleure protection contre la désinformation.","الحس النقدي أفضل حماية من التضليل."]],[["Quel risque cause la rapidité de l'information ?",["La propagation de fausses nouvelles","Le manque de contenu","Le coût"],0],["Quelle est la meilleure protection ?",["L'esprit critique","Un antivirus","Ne plus lire"],0]]],
["Un entrepreneur déterminé","مقاول عنيد","🚀",[["Après trois échecs successifs, Karim a failli renoncer à son rêve de créer sa propre entreprise.","بعد ثلاث إخفاقات متتالية كاد كريم يتخلى عن حلم إنشاء شركته."],["Il a pourtant analysé ses erreurs et ajusté sa stratégie.","لكنه حلل أخطاءه وعدل استراتيجيته."],["Son quatrième projet, une application de livraison locale, a rapidement séduit les habitants.","مشروعه الرابع تطبيق توصيل محلي جذب السكان بسرعة."],["Il affirme aujourd'hui que chaque échec lui a appris quelque chose d'essentiel.","يؤكد اليوم أن كل فشل علمه شيئا أساسيا."]],[["Combien d'échecs a-t-il connus avant de réussir ?",["Trois","Un","Cinq"],0],["Qu'a-t-il fait après ses échecs ?",["Il a analysé ses erreurs","Il a abandonné","Il a déménagé"],0]]],
["La biodiversité menacée","التنوع البيولوجي المهدد","🦋",[["Les scientifiques estiment qu'un million d'espèces sont aujourd'hui menacées d'extinction.","يقدر العلماء أن مليون نوع مهدد اليوم بالانقراض."],["La destruction des habitats et la pollution figurent parmi les principales causes.","يعد تدمير الموائل والتلوث من أهم الأسباب."],["Or chaque espèce joue un rôle dans un équilibre fragile dont dépend aussi l'humanité.","وكل نوع له دور في توازن هش تعتمد عليه الإنسانية أيضا."],["Créer des réserves naturelles constitue une réponse, mais elle demeure insuffisante à elle seule.","إنشاء محميات طبيعية رد لكنه غير كاف وحده."]],[["Combien d'espèces sont menacées ?",["Un million","Mille","Dix mille"],0],["La création de réserves suffit-elle ?",["Non","Oui","On ne sait pas"],0]]],
["Le microcrédit","القروض الصغيرة","💰",[["Le microcrédit consiste à prêter de petites sommes à des personnes exclues du système bancaire classique.","يقوم القرض الصغير على إقراض مبالغ صغيرة لأشخاص مستبعدين من النظام البنكي التقليدي."],["Grâce à ces prêts, de nombreuses femmes ont pu lancer un petit commerce.","بفضل هذه القروض استطاعت نساء كثيرات إطلاق تجارة صغيرة."],["Toutefois, les taux d'intérêt parfois élevés suscitent des critiques.","غير أن نسب الفائدة المرتفعة أحيانا تثير انتقادات."],["Le dispositif reste un outil précieux, à condition d'être encadré.","يظل الجهاز أداة ثمينة بشرط أن يكون مؤطرا."]],[["À qui s'adresse le microcrédit ?",["Aux exclus du système bancaire","Aux grandes entreprises","Aux étudiants"],0],["Quelle critique est formulée ?",["Des taux d'intérêt parfois élevés","Un manque de clients","Sa lenteur"],0]]],
["Le patrimoine architectural","التراث المعماري","🕌",[["Les vieilles médinas témoignent d'un urbanisme adapté au climat et à la vie communautaire.","تشهد المدن العتيقة على عمران يلائم المناخ والحياة الجماعية."],["Leurs ruelles étroites procurent de l'ombre et de la fraîcheur en été.","تمنح أزقتها الضيقة الظل والبرودة صيفا."],["Malheureusement, le manque d'entretien menace nombre de ces édifices.","للأسف يهدد غياب الصيانة كثيرا من هذه المباني."],["Des programmes de restauration cherchent à concilier préservation et usages contemporains.","تسعى برامج الترميم إلى التوفيق بين الحفظ والاستعمالات المعاصرة."]],[["À quoi sert l'étroitesse des ruelles ?",["À procurer de l'ombre","À défendre la ville","À ralentir les voitures"],0],["Quel danger menace les édifices ?",["Le manque d'entretien","Le tourisme","Les inondations"],0]]],
["Le défi de la mobilité","تحدي التنقل","🚲",[["Face à l'engorgement des routes, plusieurs villes encouragent le vélo et les transports en commun.","أمام ازدحام الطرق تشجع مدن عدة الدراجات والنقل الجماعي."],["Des pistes cyclables sécurisées ont vu le jour et le nombre de cyclistes a doublé en cinq ans.","ظهرت مسارات دراجات آمنة وتضاعف عدد راكبيها في خمس سنوات."],["Les commerçants craignaient une baisse de leurs ventes, mais l'effet s'est révélé plutôt positif.","خشي التجار انخفاض مبيعاتهم لكن الأثر كان إيجابيا في الغالب."],["Il reste cependant à convaincre les automobilistes les plus attachés à leur voiture.","يبقى إقناع أكثر السائقين تعلقا بسياراتهم."]],[["Qu'est-il arrivé au nombre de cyclistes ?",["Il a doublé","Il a baissé","Il est stable"],0],["Quel a été l'effet sur les commerçants ?",["Plutôt positif","Très négatif","Nul"],0]]],
["L'éducation à l'ère numérique","التعليم في العصر الرقمي","💻",[["Les outils numériques permettent d'accéder à des cours du monde entier depuis un simple téléphone.","تتيح الأدوات الرقمية الوصول إلى دروس العالم من هاتف بسيط."],["Cependant, l'autonomie qu'ils exigent n'est pas à la portée de tous les apprenants.","غير أن الاستقلالية التي تتطلبها ليست في متناول كل المتعلمين."],["Les enseignants jouent alors un rôle d'accompagnateur plutôt que de simple transmetteur.","يلعب المعلمون حينها دور المرافق لا ناقل المعرفة فحسب."],["L'enjeu est de combiner la souplesse du numérique et la chaleur du lien humain.","الرهان هو الجمع بين مرونة الرقمنة ودفء العلاقة الإنسانية."]],[["Que permettent les outils numériques ?",["Accéder à des cours du monde entier","Supprimer les examens","Remplacer les parents"],0],["Quel rôle prennent les enseignants ?",["Accompagnateur","Surveillant","Administrateur"],0]]],
["La publicité et nos choix","الإشهار واختياراتنا","🛍️",[["Chaque jour, nous sommes exposés à des centaines de messages publicitaires, souvent sans nous en rendre compte.","كل يوم نتعرض لمئات الرسائل الإشهارية غالبا دون أن ننتبه."],["Ces messages jouent sur nos émotions plus que sur notre raison.","تلعب هذه الرسائل على عواطفنا أكثر من عقلنا."],["Prendre le temps de se demander si l'on a réellement besoin d'un produit permet d'éviter bien des achats impulsifs.","أخذ الوقت لنسأل أنفسنا إن كنا نحتاج المنتج فعلا يجنبنا كثيرا من المشتريات الاندفاعية."],["Une consommation plus réfléchie profite à la fois au budget et à l'environnement.","استهلاك أكثر تفكيرا يفيد الميزانية والبيئة معا."]],[["Sur quoi la publicité joue-t-elle ?",["Sur les émotions","Sur la logique","Sur la science"],0],["Comment éviter les achats impulsifs ?",["En se demandant si on en a besoin","En comparant les prix","En achetant moins cher"],0]]],
["La solidarité en temps de crise","التضامن وقت الأزمات","🤲",[["Lors des inondations de l'an dernier, des centaines de volontaires se sont mobilisés spontanément.","في فيضانات السنة الماضية تطوع مئات الأشخاص تلقائيا."],["Ils ont distribué des repas, hébergé des familles et aidé à nettoyer les maisons touchées.","وزعوا وجبات وآووا عائلات وساعدوا في تنظيف البيوت المتضررة."],["Beaucoup ont affirmé avoir reçu bien plus qu'ils n'avaient donné.","أكد كثيرون أنهم تلقوا أكثر مما قدموا."],["Ces élans montrent que la société sait se rassembler quand l'essentiel est en jeu.","تبين هذه الهبات أن المجتمع يعرف كيف يتحد حين يكون الأساس على المحك."]],[["Qui s'est mobilisé ?",["Des centaines de volontaires","L'armée","Des touristes"],0],["Qu'ont affirmé beaucoup de volontaires ?",["Avoir reçu plus qu'ils n'ont donné","Être fatigués","Avoir été payés"],0]]],
["Les langues en danger","اللغات المهددة","🗣️",[["Selon l'UNESCO, une langue disparaît en moyenne toutes les deux semaines.","حسب اليونسكو تختفي لغة في المتوسط كل أسبوعين."],["Avec elle s'éteignent des savoirs, des récits et une manière unique de voir le monde.","ومعها تنطفئ معارف وحكايات وطريقة فريدة لرؤية العالم."],["Des projets de documentation numérique tentent d'enregistrer les derniers locuteurs.","تحاول مشاريع توثيق رقمي تسجيل آخر المتحدثين."],["Cependant, sans transmission aux enfants, ces efforts risquent de rester symboliques.","لكن بدون نقل للأطفال قد تبقى هذه الجهود رمزية."]],[["À quelle fréquence disparaît une langue ?",["Toutes les deux semaines","Tous les ans","Tous les jours"],0],["Qu'est-il indispensable pour sauver une langue ?",["La transmission aux enfants","Des dictionnaires","Des lois"],0]]],
["Une ville intelligente","مدينة ذكية","🌆",[["Dans cette ville, des capteurs mesurent en temps réel la circulation et la qualité de l'air.","في هذه المدينة تقيس مستشعرات حركة السير وجودة الهواء آنيا."],["Les feux s'adaptent automatiquement afin de fluidifier le trafic aux heures de pointe.","تتكيف الإشارات تلقائيا لتسهيل الحركة في أوقات الذروة."],["Certains habitants s'inquiètent toutefois de la collecte massive de leurs données personnelles.","لكن بعض السكان يقلقون من الجمع الواسع لبياناتهم الشخصية."],["La municipalité promet de garantir la transparence et la protection de la vie privée.","تعد البلدية بضمان الشفافية وحماية الحياة الخاصة."]],[["Que mesurent les capteurs ?",["La circulation et l'air","La température seulement","Le bruit"],0],["De quoi s'inquiètent certains habitants ?",["De la collecte de leurs données","Du prix","Du bruit"],0]]],
["Le bénévolat associatif","العمل الجمعوي التطوعي","🤝",[["Le bénévolat permet d'acquérir des compétences que l'école n'enseigne pas toujours.","يتيح التطوع اكتساب مهارات لا تدرسها المدرسة دائما."],["Organiser un événement, gérer un budget ou animer une équipe sont autant d'expériences précieuses.","تنظيم حدث أو تسيير ميزانية أو قيادة فريق كلها تجارب ثمينة."],["Les recruteurs y voient d'ailleurs un signe d'engagement et de maturité.","ويرى فيه المشغلون علامة التزام ونضج."],["Au-delà du CV, c'est surtout une façon de se sentir utile.","وفوق السيرة الذاتية هو طريقة للشعور بالفائدة."]],[["Que permet le bénévolat ?",["Acquérir des compétences","Gagner de l'argent","Voyager"],0],["Comment les recruteurs le perçoivent-ils ?",["Comme un signe d'engagement","Comme une perte de temps","Comme un hobby"],0]]],
["Vivre avec le stress","العيش مع التوتر","😰",[["Un peu de stress peut stimuler la performance, mais un stress prolongé épuise l'organisme.","قليل من التوتر قد ينشط الأداء أما التوتر المطول فيرهق الجسم."],["Parmi les remèdes efficaces figurent l'exercice physique, la respiration profonde et un sommeil suffisant.","من الحلول الفعالة الرياضة والتنفس العميق ونوم كاف."],["Il est aussi essentiel de ne pas rester seul avec ses difficultés.","من الضروري أيضا ألا نبقى وحدنا مع صعوباتنا."],["Parler à un proche ou à un professionnel constitue souvent un premier pas décisif.","الحديث إلى مقرب أو مختص غالبا خطوة أولى حاسمة."]],[["Quand le stress est-il utile ?",["En petite quantité","Toujours","Jamais"],0],["Quel premier pas est conseillé ?",["En parler à quelqu'un","Dormir moins","Travailler plus"],0]]],
["Le commerce équitable","التجارة العادلة","⚖️",[["Le commerce équitable vise à garantir aux producteurs un prix juste pour leur travail.","تهدف التجارة العادلة إلى ضمان ثمن منصف للمنتجين مقابل عملهم."],["Il exclut le travail des enfants et impose des normes environnementales.","تمنع تشغيل الأطفال وتفرض معايير بيئية."],["Les produits labellisés coûtent un peu plus cher, mais le surcoût revient directement aux coopératives.","المنتجات الموسومة أغلى قليلا لكن الفارق يعود مباشرة إلى التعاونيات."],["Les consommateurs détiennent ainsi un réel pouvoir par leurs achats.","وهكذا يملك المستهلكون قوة حقيقية عبر مشترياتهم."]],[["Que garantit le commerce équitable ?",["Un prix juste aux producteurs","Des prix bas","La rapidité"],0],["Où va le surcoût ?",["Aux coopératives","Aux supermarchés","À l'État"],0]]],
["Le sport comme école de vie","الرياضة مدرسة للحياة","🏆",[["Pratiquer un sport collectif apprend à gérer la victoire comme la défaite.","ممارسة رياضة جماعية تعلم تدبير الفوز كما الهزيمة."],["Les jeunes y développent le respect des règles et l'esprit d'équipe.","ينمي فيها الشباب احترام القواعد وروح الفريق."],["Les entraîneurs jouent un rôle éducatif souvent aussi important que celui des enseignants.","يلعب المدربون دورا تربويا أهميته غالبا كأهمية المعلمين."],["C'est pourquoi les clubs de quartier méritent davantage de soutien.","لهذا تستحق نوادي الأحياء دعما أكبر."]],[["Que apprend-on dans un sport collectif ?",["Gérer victoire et défaite","Gagner toujours","Éviter la compétition"],0],["Que mérite un soutien accru ?",["Les clubs de quartier","Les stades","Les chaînes de télévision"],0]]],
["L'art de la conversation","فن الحديث","💬",[["Savoir converser ne se limite pas à bien parler : il faut aussi savoir écouter.","معرفة الحديث لا تقتصر على حسن الكلام بل تتطلب حسن الإصغاء."],["Poser des questions ouvertes montre à l'autre qu'on s'intéresse sincèrement à lui.","طرح أسئلة مفتوحة يبين للآخر أننا مهتمون به بصدق."],["Couper la parole, en revanche, donne l'impression de ne pas respecter son interlocuteur.","أما مقاطعة الكلام فتعطي انطباعا بعدم احترام المحاور."],["Les meilleurs conteurs sont souvent ceux qui laissent aux autres la place de s'exprimer.","أفضل الحكائين غالبا من يتركون للآخرين مجال التعبير."]],[["Que faut-il savoir en plus de parler ?",["Écouter","Chanter","Écrire"],0],["Qu'est-ce qui donne une impression de manque de respect ?",["Couper la parole","Poser des questions","Sourire"],0]]],
["La pêche artisanale","الصيد التقليدي","🎣",[["Sur la côte, les pêcheurs artisanaux partent en mer avant l'aube dans de petites barques.","على الساحل يخرج الصيادون التقليديون إلى البحر قبل الفجر في قوارب صغيرة."],["Leurs techniques ménagent les stocks de poissons, contrairement à la pêche industrielle.","تقنياتهم تحافظ على مخزون السمك خلافا للصيد الصناعي."],["Pourtant, la hausse du prix du carburant fragilise leur activité.","لكن ارتفاع ثمن الوقود يضعف نشاطهم."],["Des coopératives se créent pour vendre directement aux consommateurs et mieux défendre leurs revenus.","تنشأ تعاونيات للبيع المباشر للمستهلكين والدفاع عن مداخيلهم."]],[["Quand partent-ils en mer ?",["Avant l'aube","À midi","Le soir"],0],["Que fragilise leur activité ?",["Le prix du carburant","La météo","Le manque de clients"],0]]]
];

["Le paradoxe du choix","مفارقة الاختيار","🛒",[["Dans les sociétés d'abondance, la multiplication des options est généralement perçue comme un progrès.","في مجتمعات الوفرة يعتبر تكاثر الخيارات عادة تقدما."],["Or plusieurs études suggèrent qu'un excès de choix peut engendrer anxiété et insatisfaction.","غير أن دراسات عدة تشير إلى أن كثرة الخيارات قد تولد القلق وعدم الرضا."],["Face à des dizaines de références, le consommateur craint de ne pas avoir fait le meilleur achat.","أمام عشرات المنتجات يخشى المستهلك ألا يكون قد اختار الأفضل."],["Limiter volontairement ses options apparaît dès lors comme une stratégie de sérénité.","يبدو الحد الطوعي من الخيارات إذن استراتيجية للطمأنينة."]],[["Que peut engendrer un excès de choix ?",["De l'anxiété","De la joie","De l'économie"],0],["Quelle stratégie est suggérée ?",["Limiter ses options","Comparer davantage","Acheter plus"],0]]],
["Le déclin de l'attention","تراجع الانتباه","📵",[["L'économie de l'attention repose sur une logique simple : retenir l'utilisateur le plus longtemps possible.","يقوم اقتصاد الانتباه على منطق بسيط: إبقاء المستخدم أطول مدة ممكنة."],["Les notifications, le défilement infini et la lecture automatique y concourent sciemment.","تساهم فيه عمدا الإشعارات والتمرير اللانهائي والتشغيل التلقائي."],["Il en résulte une fragmentation de la concentration, au détriment de la lecture approfondie.","ينتج عن ذلك تشتت التركيز على حساب القراءة المتعمقة."],["Certains plaident donc pour un véritable droit à la déconnexion.","لذلك يدافع بعضهم عن حق حقيقي في الانقطاع الرقمي."]],[["Sur quoi repose l'économie de l'attention ?",["Retenir l'utilisateur","Vendre des appareils","Réduire les prix"],0],["Quelle conséquence est citée ?",["Une fragmentation de la concentration","Plus de lecture","Plus de sommeil"],0]]],
["Mémoire collective et oubli","الذاكرة الجماعية والنسيان","🏺",[["Une société se construit autant par ce qu'elle choisit de commémorer que par ce qu'elle choisit d'oublier.","يبنى مجتمع بما يختار تخليده بقدر ما يبنى بما يختار نسيانه."],["Les historiens rappellent que la mémoire officielle tend à gommer les aspérités les plus dérangeantes.","يذكر المؤرخون أن الذاكرة الرسمية تميل إلى طمس أكثر الجوانب إزعاجا."],["Il appartient aux citoyens de confronter ces récits aux archives et aux témoignages.","على المواطنين مقارنة هذه الروايات بالأرشيف والشهادات."],["Ce travail critique est la condition d'une mémoire apaisée plutôt que d'une mémoire instrumentalisée.","هذا العمل النقدي شرط لذاكرة مهدّأة لا ذاكرة موظفة."]],[["Que tend à faire la mémoire officielle ?",["Gommer les aspects dérangeants","Tout conserver","Tout inventer"],0],["Que doivent faire les citoyens ?",["Confronter les récits aux archives","Les accepter","Les ignorer"],0]]],
["L'éthique de l'intelligence artificielle","أخلاقيات الذكاء الاصطناعي","⚙️",[["Les algorithmes prennent désormais des décisions qui affectent l'accès au crédit, à l'emploi ou aux soins.","تتخذ الخوارزميات اليوم قرارات تؤثر في الولوج للقرض والشغل والعلاج."],["Or ils reproduisent parfois les biais contenus dans les données avec lesquelles ils ont été entraînés.","غير أنها تعيد أحيانا إنتاج التحيزات الموجودة في البيانات التي تدربت عليها."],["La transparence des critères et la possibilité de contester une décision automatisée deviennent donc primordiales.","تصبح شفافية المعايير وإمكانية الطعن في قرار آلي أمرا أساسيا."],["Reste à déterminer qui doit répondre des erreurs : le concepteur, l'entreprise ou l'utilisateur.","يبقى تحديد من يتحمل مسؤولية الأخطاء: المصمم أم الشركة أم المستخدم."]],[["Quel risque présentent les algorithmes ?",["Reproduire des biais","Être trop lents","Coûter cher"],0],["Quelle question reste ouverte ?",["Qui est responsable des erreurs","Quel est le coût","Quelle langue utiliser"],0]]],
["Le travail à l'ère de l'automatisation","العمل في عصر الأتمتة","🏭",[["L'automatisation redéfinit la frontière entre les tâches confiées aux machines et celles réservées aux humains.","تعيد الأتمتة تعريف الحدود بين المهام الموكلة للآلات والمخصصة للبشر."],["Les emplois routiniers sont les plus exposés, tandis que ceux requérant empathie et créativité résistent mieux.","الوظائف الروتينية الأكثر عرضة بينما تصمد أكثر تلك التي تتطلب تعاطفا وإبداعا."],["Ce constat invite à repenser les systèmes de formation tout au long de la vie.","يدعو هذا الاستنتاج إلى إعادة التفكير في أنظمة التكوين مدى الحياة."],["Sans accompagnement, le risque est d'accroître les inégalités entre les travailleurs qualifiés et les autres.","وبدون مواكبة يخشى تعميق الفوارق بين العمال المؤهلين وغيرهم."]],[["Quels emplois résistent mieux ?",["Ceux qui demandent empathie et créativité","Les emplois routiniers","Les emplois de bureau"],0],["Quel risque sans accompagnement ?",["Plus d'inégalités","Moins de salaires","Moins d'emplois"],0]]],
["Le langage et la pensée","اللغة والفكر","🗨️",[["Depuis longtemps, les linguistes se demandent si la langue façonne notre manière de penser.","منذ زمن طويل يتساءل اللسانيون هل تشكل اللغة طريقة تفكيرنا."],["Certaines expériences montrent que le vocabulaire des couleurs influence la rapidité avec laquelle on les distingue.","تبين تجارب أن مفردات الألوان تؤثر في سرعة التمييز بينها."],["Toutefois, il serait excessif de conclure que nos pensées sont enfermées dans les mots que nous possédons.","غير أنه من المبالغة الاستنتاج بأن أفكارنا محبوسة في الكلمات التي نملكها."],["La relation entre langage et cognition semble plutôt relever d'une influence réciproque et nuancée.","تبدو العلاقة بين اللغة والإدراك تأثيرا متبادلا ومتدرجا."]],[["Que montrent certaines expériences ?",["Le vocabulaire influence la perception des couleurs","La langue ne compte pas","Les couleurs n'existent pas"],0],["Quelle conclusion est jugée excessive ?",["Les pensées sont enfermées dans les mots","Le langage influence","La langue évolue"],0]]],
["Le défi de la transition énergétique","تحدي الانتقال الطاقي","🔋",[["Abandonner les énergies fossiles ne relève pas seulement d'un choix technique mais d'un bouleversement économique et social.","التخلي عن الطاقات الأحفورية ليس خيارا تقنيا فقط بل تحول اقتصادي واجتماعي."],["Les régions dépendantes du charbon ou du pétrole redoutent une perte massive d'emplois.","تخشى المناطق المعتمدة على الفحم أو النفط خسارة هائلة للوظائف."],["Une transition juste suppose donc des programmes de reconversion et des investissements ciblés.","لذلك يفترض الانتقال العادل برامج إعادة تأهيل واستثمارات موجهة."],["À défaut, la contestation sociale risque de freiner les politiques climatiques les plus ambitieuses.","وإلا قد يعطل الاحتجاج الاجتماعي أكثر السياسات المناخية طموحا."]],[["Que redoutent les régions dépendantes des fossiles ?",["Une perte d'emplois","La pollution","Le froid"],0],["Que suppose une transition juste ?",["Des programmes de reconversion","Des taxes","Un arrêt immédiat"],0]]],
["L'art de la traduction","فن الترجمة","📜",[["Traduire ne consiste pas à substituer mot à mot un vocabulaire à un autre.","الترجمة ليست استبدال مفردات بأخرى كلمة بكلمة."],["Le traducteur doit restituer le ton, le rythme et les sous-entendus culturels d'un texte.","على المترجم أن ينقل النبرة والإيقاع والإيحاءات الثقافية للنص."],["Certains jeux de mots sont tout simplement intraduisibles et exigent une véritable recréation.","بعض التلاعبات اللفظية لا تترجم أصلا وتتطلب إعادة إبداع حقيقية."],["C'est pourquoi l'on dit souvent que traduire, c'est un peu trahir, mais avec élégance.","لذلك يقال غالبا إن الترجمة خيانة لكن بأناقة."]],[["Que doit restituer le traducteur ?",["Le ton et les sous-entendus","Les mots seulement","Le titre"],0],["Quel problème pose les jeux de mots ?",["Ils sont parfois intraduisibles","Ils sont trop longs","Ils sont obsolètes"],0]]],
["Une enquête sur le sommeil des adolescents","تحقيق حول نوم المراهقين","🛏️",[["Une enquête menée auprès de cinq mille lycéens révèle que la moitié dort moins de sept heures par nuit.","كشف تحقيق شمل خمسة آلاف تلميذ ثانوي أن النصف ينام أقل من سبع ساعات ليلا."],["Les écrans et les horaires de cours précoces sont désignés comme principaux responsables.","يشار إلى الشاشات وتبكير أوقات الدراسة كأهم المسؤولين."],["Les chercheurs observent un lien net entre privation de sommeil, irritabilité et baisse des résultats.","يلاحظ الباحثون صلة واضحة بين الحرمان من النوم والعصبية وتراجع النتائج."],["Ils préconisent d'ajuster les emplois du temps et d'informer les familles sur l'hygiène du sommeil.","يوصون بتعديل الجداول وتوعية الأسر بنظافة النوم."]],[["Quelle proportion dort moins de sept heures ?",["La moitié","Un dixième","Tous"],0],["Que préconisent les chercheurs ?",["Ajuster les emplois du temps","Supprimer les écrans","Plus de devoirs"],0]]],
["Les vertus de l'ennui","فضائل الملل","🌫️",[["Dans un monde saturé de stimulations, l'ennui est devenu une expérience que l'on s'empresse de fuir.","في عالم مشبع بالمثيرات صار الملل تجربة نسارع إلى الهروب منها."],["Pourtant, des psychologues soulignent qu'il stimule l'imagination et favorise la réflexion personnelle.","غير أن علماء نفس يؤكدون أنه ينشط الخيال ويعزز التأمل الشخصي."],["Laisser un enfant s'ennuyer lui apprend à inventer ses propres jeux.","ترك الطفل يمل يعلمه ابتكار ألعابه."],["Réhabiliter l'ennui reviendrait ainsi à protéger un espace essentiel de liberté intérieure.","وإعادة الاعتبار للملل تعني حماية فضاء أساسيا من الحرية الداخلية."]],[["Que stimule l'ennui selon les psychologues ?",["L'imagination","La colère","La paresse"],0],["Que apprend à l'enfant l'ennui ?",["Inventer ses jeux","Se plaindre","Dormir"],0]]],
["La rhétorique politique","الخطابة السياسية","🎤",[["Un discours politique efficace repose rarement sur la seule solidité de ses arguments.","نادرا ما يعتمد الخطاب السياسي الفعال على متانة حججه وحدها."],["Le recours aux anecdotes, aux répétitions et aux métaphores contribue à marquer les esprits.","يساهم اللجوء إلى الحكايات والتكرار والاستعارات في ترك الأثر."],["L'auditeur averti apprend à distinguer la persuasion légitime de la manipulation émotionnelle.","يتعلم المستمع الواعي أن يميز الإقناع المشروع من التلاعب العاطفي."],["L'éducation aux médias constitue, à cet égard, un rempart indispensable pour la démocratie.","وتشكل التربية الإعلامية في هذا الصدد سدا لا غنى عنه للديمقراطية."]],[["Qu'est-ce qui marque les esprits ?",["Les anecdotes et métaphores","Les chiffres","Les lois"],0],["Que doit savoir distinguer l'auditeur ?",["Persuasion et manipulation","Gauche et droite","Vrai et faux seulement"],0]]],
["Les migrations contemporaines","الهجرات المعاصرة","🧳",[["Les migrations résultent d'un faisceau de causes : conflits, pauvreté, bouleversements climatiques, aspirations personnelles.","تنتج الهجرات عن مجموعة أسباب: نزاعات وفقر واضطرابات مناخية وتطلعات شخصية."],["Les pays d'accueil oscillent entre besoin de main-d'œuvre et crainte d'une pression sur les services publics.","تتأرجح بلدان الاستقبال بين حاجتها لليد العاملة وخشيتها من ضغط على المرافق العمومية."],["Les études économiques soulignent pourtant l'apport des migrants à l'innovation et à la croissance.","ومع ذلك تبرز الدراسات الاقتصادية إسهام المهاجرين في الابتكار والنمو."],["Un débat apaisé exige de dépasser les caricatures et de s'appuyer sur des données fiables.","يتطلب نقاش هادئ تجاوز الصور النمطية والاعتماد على بيانات موثوقة."]],[["Quelles sont les causes citées ?",["Conflits, pauvreté, climat, aspirations","Seulement la guerre","Seulement l'argent"],0],["Que souligne les études économiques ?",["L'apport des migrants à l'innovation","Le coût de l'accueil","La baisse des salaires"],0]]],
["La notion de progrès","مفهوم التقدم","📈",[["Longtemps, le progrès a été identifié à l'accumulation de richesses et de connaissances techniques.","لزمن طويل ارتبط التقدم بتراكم الثروات والمعارف التقنية."],["Les crises écologiques ont toutefois conduit à interroger cette conception strictement quantitative.","غير أن الأزمات البيئية دفعت إلى مساءلة هذا التصور الكمي الصرف."],["Certains philosophes proposent désormais d'évaluer le progrès à l'aune du bien-être et de la durabilité.","يقترح بعض الفلاسفة اليوم تقييم التقدم بمعيار الرفاه والاستدامة."],["Ainsi redéfini, il cesserait d'être une course pour devenir un équilibre.","وبهذا التعريف يتوقف عن كونه سباقا ليصبح توازنا."]],[["À quoi le progrès a-t-il été identifié ?",["À l'accumulation de richesses","À la justice","À l'art"],0],["Que proposent certains philosophes ?",["Le mesurer par le bien-être et la durabilité","L'abandonner","L'accélérer"],0]]],
["Le droit à la déconnexion","حق الانقطاع","🔕",[["Avec la généralisation des smartphones, la frontière entre temps de travail et temps personnel s'est brouillée.","مع انتشار الهواتف الذكية تلاشت الحدود بين وقت العمل والوقت الشخصي."],["Des salariés répondent à des courriels tard le soir par crainte d'être mal perçus.","يرد موظفون على رسائل متأخرة ليلا خوفا من سوء التقدير."],["Plusieurs législations consacrent désormais un droit à la déconnexion, mais son application demeure inégale.","تكرس تشريعات عدة اليوم حق الانقطاع لكن تطبيقه متفاوت."],["La question est autant culturelle que juridique : elle suppose un changement de mentalités.","المسألة ثقافية بقدر ما هي قانونية: تتطلب تغيير العقليات."]],[["Pourquoi répondent-ils tard le soir ?",["Par crainte d'être mal perçus","Par plaisir","Par ennui"],0],["La question est-elle seulement juridique ?",["Non, aussi culturelle","Oui","On ne sait pas"],0]]],
["Architecture et identité","العمارة والهوية","🏛️",[["Les bâtiments d'une ville racontent, souvent mieux que les livres, les valeurs d'une époque.","تحكي مباني المدينة غالبا أفضل من الكتب قيم عصر."],["La standardisation des façades de verre et d'acier tend toutefois à effacer les particularités locales.","لكن توحيد الواجهات الزجاجية والفولاذية يميل إلى محو الخصوصيات المحلية."],["Des architectes tentent de réconcilier modernité et savoir-faire vernaculaires.","يحاول معماريون التوفيق بين الحداثة والمعارف المحلية."],["Une ville qui oublie son héritage risque de perdre une part de son âme.","مدينة تنسى تراثها تخاطر بخسارة جزء من روحها."]],[["Que tend à effacer la standardisation ?",["Les particularités locales","Le coût","Le bruit"],0],["Que tentent des architectes ?",["Réconcilier modernité et tradition","Tout détruire","Copier l'étranger"],0]]],
["Le bilinguisme","ثنائية اللغة","🌐",[["Contrairement aux craintes anciennes, le bilinguisme précoce n'entrave pas le développement de l'enfant.","خلافا لمخاوف قديمة لا يعيق التعدد اللغوي المبكر نمو الطفل."],["Des études en neurosciences suggèrent qu'il renforcerait la flexibilité cognitive et la capacité d'attention.","تشير دراسات في علوم الأعصاب إلى أنه يعزز المرونة الذهنية وقدرة الانتباه."],["Encore faut-il que chaque langue soit entretenue par un contact régulier et de qualité.","بشرط أن تصان كل لغة باتصال منتظم وجيد."],["Le bilinguisme est ainsi une richesse, pour peu qu'on lui offre les conditions de s'épanouir.","وهكذا يكون ثراء متى وفرت له شروط الازدهار."]],[["Le bilinguisme précoce nuit-il à l'enfant ?",["Non","Oui","Parfois toujours"],0],["Que renforcerait-il ?",["La flexibilité cognitive","La vitesse","La taille"],0]]],
["Les limites de la croissance","حدود النمو","📉",[["Une économie fondée sur la croissance perpétuelle se heurte aux limites physiques de la planète.","يصطدم اقتصاد قائم على النمو الدائم بالحدود المادية للكوكب."],["Certains économistes plaident pour une décroissance choisie des secteurs les plus polluants.","يدافع بعض الاقتصاديين عن انكماش مختار للقطاعات الأكثر تلويثا."],["D'autres parient sur l'innovation technologique pour découpler croissance et émissions.","ويراهن آخرون على الابتكار التقني للفصل بين النمو والانبعاثات."],["Le débat, loin d'être tranché, engage une conception même de la prospérité.","النقاش بعيد عن الحسم ويمس تصور الازدهار ذاته."]],[["Que plaident certains économistes ?",["Une décroissance des secteurs polluants","Plus de pétrole","Moins d'impôts"],0],["Sur quoi parient d'autres ?",["L'innovation technologique","L'agriculture","Le tourisme"],0]]],
["Le rôle de la littérature","دور الأدب","📖",[["Lire un roman, c'est habiter pendant quelques heures la conscience d'un autre.","قراءة رواية معناها السكن ساعات في وعي إنسان آخر."],["Cet exercice d'empathie nous rend plus sensibles à des réalités éloignées de la nôtre.","هذا التمرين في التعاطف يجعلنا أكثر حساسية لواقع بعيد عن واقعنا."],["La littérature n'offre pas de réponses toutes faites, mais affine notre capacité à poser les bonnes questions.","لا يقدم الأدب أجوبة جاهزة لكنه يصقل قدرتنا على طرح الأسئلة الصحيحة."],["À ce titre, elle demeure un instrument de formation morale irremplaçable.","وبهذا تبقى أداة تكوين خلقي لا تعوض."]],[["Que développe la lecture de romans ?",["L'empathie","La vitesse","La mémoire des dates"],0],["Que n'offre pas la littérature ?",["Des réponses toutes faites","Des histoires","Des émotions"],0]]],
["Santé mentale et société","الصحة النفسية والمجتمع","🧩",[["Longtemps taboue, la santé mentale s'invite enfin dans le débat public.","ظلت الصحة النفسية زمنا من المحرمات وها هي تدخل أخيرا النقاش العمومي."],["Cependant, l'accès aux soins psychologiques demeure limité, notamment dans les zones rurales.","غير أن الولوج إلى الرعاية النفسية ما زال محدودا خصوصا في الأرياف."],["Les campagnes de sensibilisation contribuent à réduire la stigmatisation des personnes concernées.","تساهم حملات التوعية في الحد من وصم المعنيين."],["Prendre soin de son esprit devrait être aussi naturel que de prendre soin de son corps.","الاعتناء بالعقل ينبغي أن يكون طبيعيا كالاعتناء بالجسد."]],[["Comment était la santé mentale autrefois ?",["Un tabou","Une priorité","Un loisir"],0],["Où l'accès aux soins est-il limité ?",["Dans les zones rurales","En ville","Partout pareil"],0]]],
["Le patrimoine immatériel","التراث اللامادي","🎻",[["Contes, chants, savoir-faire artisanaux : le patrimoine immatériel se transmet par la pratique plutôt que par les monuments.","حكايات وأغان وحرف: ينتقل التراث اللامادي بالممارسة لا بالمعالم."],["Sa fragilité tient au fait qu'il disparaît dès que cessent les occasions de le transmettre.","تكمن هشاشته في أنه يختفي حين تنقطع فرص نقله."],["L'UNESCO en a inscrit plusieurs éléments à son inventaire afin d'attirer l'attention des pouvoirs publics.","أدرجت اليونسكو عدة عناصر منه في قوائمها لجلب انتباه السلطات العمومية."],["Sa sauvegarde repose toutefois d'abord sur l'attachement des communautés qui le portent.","غير أن صونه يعتمد أولا على تعلق المجتمعات الحاملة له."]],[["Comment se transmet le patrimoine immatériel ?",["Par la pratique","Par les monuments","Par les livres"],0],["Sur quoi repose sa sauvegarde ?",["L'attachement des communautés","Les lois","Le tourisme"],0]]],
["Le journalisme d'investigation","الصحافة الاستقصائية","🔍",[["Le journalisme d'investigation exige patience, rigueur et recoupement minutieux des sources.","تتطلب الصحافة الاستقصائية صبرا ودقة وتقاطعا دقيقا للمصادر."],["Il s'expose parfois à des pressions, voire à des poursuites judiciaires.","قد يتعرض أحيانا لضغوط بل ولمتابعات قضائية."],["Pourtant, nombre de scandales n'auraient jamais été révélés sans ces enquêtes de longue haleine.","ومع ذلك ما كانت فضائح كثيرة لتنكشف لولا هذه التحقيقات الطويلة النفس."],["La protection des sources demeure donc une condition de la liberté de la presse.","لذلك تبقى حماية المصادر شرطا لحرية الصحافة."]],[["Qu'exige ce journalisme ?",["Patience et recoupement","Rapidité","Opinion"],0],["Quelle condition de la liberté de la presse est citée ?",["La protection des sources","Le profit","La publicité"],0]]],
["La ville et la nature","المدينة والطبيعة","🌿",[["Végétaliser les villes ne relève plus du simple embellissement : c'est une réponse aux îlots de chaleur.","لم يعد تخضير المدن مجرد تجميل بل جوابا على جزر الحرارة."],["Les arbres rafraîchissent l'air, absorbent la pollution et améliorent le bien-être des habitants.","تبرد الأشجار الهواء وتمتص التلوث وتحسن رفاه السكان."],["Les jardins partagés, quant à eux, renforcent les liens entre voisins.","وتعزز الحدائق المشتركة الروابط بين الجيران."],["La nature en ville n'est donc pas un luxe, mais une infrastructure à part entière.","فالطبيعة في المدينة ليست ترفا بل بنية تحتية كاملة."]],[["À quoi répond la végétalisation ?",["Aux îlots de chaleur","Au chômage","Aux inondations"],0],["Que renforcent les jardins partagés ?",["Les liens entre voisins","Les impôts","La sécurité"],0]]],
["Éloge de la lenteur","مديح البطء","🐌",[["À l'heure où tout s'accélère, certains choisissent délibérément de ralentir.","في وقت يتسارع فيه كل شيء يختار بعضهم عمدا أن يبطئ."],["Manger lentement, marcher sans but, lire sans hâte : ces gestes redonnent de l'épaisseur au temps.","الأكل ببطء والمشي بلا غاية والقراءة دون عجلة: تمنح هذه التصرفات الوقت كثافته."],["Ce mouvement ne prône pas la paresse mais une qualité de présence au monde.","لا تدعو هذه الحركة إلى الكسل بل إلى جودة الحضور في العالم."],["Peut-être est-ce là une forme discrète de résistance à la logique du rendement.","ربما هذا شكل خفي من مقاومة منطق المردودية."]],[["Que prône ce mouvement ?",["Une qualité de présence","La paresse","Le travail"],0],["À quoi résiste-t-il ?",["À la logique du rendement","À la technologie","À la ville"],0]]]
];
